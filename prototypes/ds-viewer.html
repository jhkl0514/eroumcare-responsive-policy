<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>디자인 시스템</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/static/woff2/SUIT.css">
<link rel="stylesheet" href="../design-system/css/tokens.css">
<style>
/* 뷰어 바깥 틀 — DS 토큰만 사용. 견본은 가운데 iframe 안에서 design-system/css와 함께 그린다(이 스타일과 분리) */
*{box-sizing:border-box;}
html,body{height:100%;}
body{margin:0;background:var(--ds-color-bg-tertiary);color:var(--ds-color-text-primary);font-family:'SUIT',var(--ds-font-family-suit);
  font-size:var(--ds-font-body-ss-regular-size);line-height:var(--ds-font-body-ss-regular-line-height);overflow:hidden;}
button{font:inherit;color:inherit;}
.ico{display:inline-flex;}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh;}
/* 상단 줄 */
.topbar{display:flex;align-items:center;gap:var(--ds-space-12);height:var(--ds-space-48);padding:0 var(--ds-space-16);background:var(--ds-color-bg-primary);border-bottom:1px solid var(--ds-color-border-secondary);}
.topbar h1{margin:0;font-size:var(--ds-font-body-sm-semibold-size);line-height:var(--ds-font-body-sm-semibold-line-height);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.topbar .spacer{flex:1;}
.topbar a{display:inline-flex;align-items:center;gap:var(--ds-space-4);color:var(--ds-color-darkblue-600);font-weight:600;text-decoration:none;white-space:nowrap;}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:var(--ds-space-40);height:var(--ds-space-40);border:0;border-radius:var(--ds-radius-4);background:transparent;cursor:pointer;}
.icon-btn:hover{background:var(--ds-color-bg-tertiary);}
.only-narrow{display:none;}
/* 3단 */
.body{display:grid;grid-template-columns:260px minmax(0,1fr) 0;min-height:0;}
.body.doc-open{grid-template-columns:260px minmax(0,1fr) var(--doc-w, 420px);}
/* 왼쪽 메뉴 */
.nav{overflow-y:auto;background:var(--ds-color-bg-primary);border-right:1px solid var(--ds-color-border-secondary);padding:var(--ds-space-8) 0 var(--ds-space-40);}
.grp-h{display:flex;align-items:center;justify-content:space-between;width:100%;padding:var(--ds-space-8) var(--ds-space-16);border:0;background:none;cursor:pointer;
  font-weight:700;color:var(--ds-color-text-primary);text-align:left;}
.grp-h .chev{display:inline-flex;transition:transform .2s;color:var(--ds-color-text-tertiary);}
.grp-h.open .chev{transform:rotate(90deg);}
.grp-items{display:none;padding-bottom:var(--ds-space-8);}
.grp-h.open + .grp-items{display:block;}
.item{display:flex;align-items:center;justify-content:space-between;gap:var(--ds-space-8);width:100%;padding:var(--ds-space-6) var(--ds-space-16) var(--ds-space-6) var(--ds-space-24);
  border:0;background:none;cursor:pointer;text-align:left;color:var(--ds-color-text-primary);}
.item:hover{background:var(--ds-color-bg-secondary);}
.item.on{background:var(--ds-color-darkblue-50);color:var(--ds-color-darkblue-800);font-weight:600;}
.item.todo{color:var(--ds-color-text-disabled);}
.item .tag{flex:0 0 auto;font-size:var(--ds-font-caption-xs-size);line-height:var(--ds-font-caption-xs-line-height);color:var(--ds-color-text-disabled);}
/* 가운데 */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;}
.main-h{display:flex;align-items:center;gap:var(--ds-space-12);flex-wrap:wrap;padding:var(--ds-space-12) var(--ds-space-20);background:var(--ds-color-bg-primary);border-bottom:1px solid var(--ds-color-border-secondary);}
.main-h .ttl{display:flex;flex-direction:column;min-width:0;}
.main-h .ttl small{color:var(--ds-color-text-tertiary);}
.main-h .ttl b{font-size:var(--ds-font-body-md-semibold-size);line-height:var(--ds-font-body-md-semibold-line-height);}
.main-h .tools{display:flex;align-items:center;gap:var(--ds-space-8);margin-left:auto;}
.seg{display:inline-flex;border:1px solid var(--ds-color-border-primary);border-radius:var(--ds-radius-4);overflow:hidden;}
.seg button{min-height:var(--ds-space-32);padding:0 var(--ds-space-12);border:0;background:var(--ds-color-bg-primary);cursor:pointer;font-weight:600;}
.seg button + button{border-left:1px solid var(--ds-color-border-primary);}
.seg button.on{background:var(--ds-color-darkblue-50);color:var(--ds-color-darkblue-600);}
.doc-btn{display:inline-flex;align-items:center;gap:var(--ds-space-6);min-height:var(--ds-space-32);padding:0 var(--ds-space-12);border:1px solid var(--ds-color-border-primary);
  border-radius:var(--ds-radius-4);background:var(--ds-color-bg-primary);cursor:pointer;font-weight:600;}
.doc-btn.on{border-color:var(--ds-color-darkblue-600);color:var(--ds-color-darkblue-600);background:var(--ds-color-darkblue-50);}
.stage{flex:1;overflow:auto;padding:var(--ds-space-20);}
.stage iframe{display:block;margin:0 auto;border:0;background:var(--ds-color-bg-primary);box-shadow:var(--ds-shadow-2);border-radius:var(--ds-radius-4);}
.empty{max-width:520px;margin:var(--ds-space-48) auto;padding:var(--ds-space-32) var(--ds-space-24);background:var(--ds-color-bg-primary);border-radius:var(--ds-radius-8);
  text-align:center;color:var(--ds-color-text-secondary);box-shadow:var(--ds-shadow-2);}
.empty b{display:block;margin-bottom:var(--ds-space-8);color:var(--ds-color-text-primary);font-size:var(--ds-font-body-sm-semibold-size);}
/* 오른쪽 설명문서 패널 — 허브 '관련 정책' 패널과 같은 구조(머리줄 + 본문 스크롤 + 왼쪽 경계 끌어 폭 조절) */
.doc{position:relative;display:none;flex-direction:column;min-width:0;min-height:0;background:var(--ds-color-bg-primary);border-left:1px solid var(--ds-color-border-secondary);}
.body.doc-open .doc{display:flex;}
.doc-resize{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:2;}
.doc-resize:hover,.doc-resize.drag{background:var(--ds-color-darkblue-200);}
.doc-h{display:flex;align-items:center;justify-content:space-between;gap:var(--ds-space-8);padding:var(--ds-space-8) var(--ds-space-12) var(--ds-space-8) var(--ds-space-20);border-bottom:1px solid var(--ds-color-border-secondary);}
.doc-h h2{margin:0;font-size:var(--ds-font-body-ss-semibold-size);line-height:var(--ds-font-body-ss-semibold-line-height);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.doc-h small{color:var(--ds-color-text-tertiary);font-weight:400;margin-left:var(--ds-space-6);}
.doc-c{flex:1;overflow-y:auto;padding:var(--ds-space-16) var(--ds-space-20) var(--ds-space-48);}
.notice{border:1px solid var(--ds-color-border-warning);background:var(--ds-color-bg-warning-subtle);border-radius:var(--ds-radius-8);padding:var(--ds-space-12) var(--ds-space-16);margin-bottom:var(--ds-space-16);}
.notice b{display:block;margin-bottom:var(--ds-space-4);}
.notice ul{margin:0;padding-left:var(--ds-space-20);}
.toc{border:1px solid var(--ds-color-border-secondary);border-radius:var(--ds-radius-8);padding:var(--ds-space-12) var(--ds-space-16);margin-bottom:var(--ds-space-16);background:var(--ds-color-bg-secondary);}
.toc:empty{display:none;}
.toc b{display:block;margin-bottom:var(--ds-space-6);}
.toc a{display:block;padding:var(--ds-space-2) 0;color:var(--ds-color-text-primary);text-decoration:none;}
.toc a.l3{padding-left:var(--ds-space-12);color:var(--ds-color-text-secondary);}
.toc a:hover{color:var(--ds-color-darkblue-600);}
.md{overflow-wrap:anywhere;}
.md h1{font-size:var(--ds-font-heading-sm-bold-size);line-height:var(--ds-font-heading-sm-bold-line-height);margin:0 0 var(--ds-space-12);}
.md h2{font-size:var(--ds-font-body-md-semibold-size);line-height:var(--ds-font-body-md-semibold-line-height);margin:var(--ds-space-24) 0 var(--ds-space-8);}
.md h3{font-size:var(--ds-font-body-sm-semibold-size);margin:var(--ds-space-16) 0 var(--ds-space-8);}
.md .hit{background:var(--ds-color-bg-warning-subtle);border-radius:var(--ds-radius-4);}
.md p,.md li{line-height:var(--ds-font-body-sm-regular-line-height);}
.md a{color:var(--ds-color-darkblue-600);}
.md code{background:var(--ds-color-bg-tertiary);border-radius:var(--ds-radius-4);padding:0 var(--ds-space-4);font-size:.92em;}
.md pre{background:var(--ds-color-bg-tertiary);border-radius:var(--ds-radius-4);padding:var(--ds-space-12);overflow-x:auto;}
.md pre code{padding:0;background:none;}
.md .tbl{overflow-x:auto;margin:var(--ds-space-8) 0;}
.md table{border-collapse:collapse;min-width:100%;}
.md th,.md td{border-bottom:1px solid var(--ds-color-border-secondary);padding:var(--ds-space-8);text-align:left;vertical-align:top;}
.md th{background:var(--ds-color-bg-tertiary);font-weight:600;white-space:nowrap;}
.figma{margin-top:var(--ds-space-24);border-top:1px solid var(--ds-color-border-secondary);padding-top:var(--ds-space-16);}
.figma h3{margin:0 0 var(--ds-space-8);font-size:var(--ds-font-body-sm-semibold-size);}
.figma .fg{margin-bottom:var(--ds-space-12);}
.figma .fg > span{display:block;color:var(--ds-color-text-secondary);margin-bottom:var(--ds-space-6);}
.figma .links{display:flex;flex-wrap:wrap;gap:var(--ds-space-6);}
.figma a{display:inline-flex;align-items:center;gap:var(--ds-space-6);min-height:var(--ds-space-32);padding:0 var(--ds-space-12);border:1px solid var(--ds-color-border-primary);
  border-radius:var(--ds-radius-4);color:var(--ds-color-text-primary);text-decoration:none;background:var(--ds-color-bg-secondary);}
.figma a code{color:var(--ds-color-text-secondary);font-size:var(--ds-font-caption-xs-size);}
.err{color:var(--ds-color-red-800);}
.dim{display:none;}
/* 좁은 화면(1024 이하): 왼쪽 메뉴·설명문서 모두 서랍 */
@media (max-width:1024px){
  .only-narrow{display:inline-flex;}
  .body,.body.doc-open{grid-template-columns:minmax(0,1fr);}
  .nav{position:fixed;z-index:30;top:var(--ds-space-48);bottom:0;left:0;width:min(300px,85vw);transform:translateX(-100%);transition:transform .25s;box-shadow:var(--ds-shadow-4);}
  .app.nav-open .nav{transform:none;}
  .doc,.body.doc-open .doc{display:flex;position:fixed;z-index:30;top:var(--ds-space-48);bottom:0;right:0;width:min(440px,92vw);transform:translateX(100%);transition:transform .25s;box-shadow:var(--ds-shadow-4);}
  .body.doc-open .doc{transform:none;}
  .doc-resize{display:none;}
  .app.nav-open .dim,.app.doc-drawer .dim{display:block;position:fixed;z-index:20;top:var(--ds-space-48);left:0;right:0;bottom:0;background:color-mix(in srgb, var(--ds-color-base-black) 40%, transparent);}
  .stage{padding:var(--ds-space-12);}
  .main-h{padding:var(--ds-space-12);}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <button class="icon-btn only-narrow" id="navBtn" aria-label="메뉴 열기"><span class="ico"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button>
    <h1>이로움Care 디자인 시스템</h1>
    <span class="spacer"></span>
    <a href="../index.html"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>정책 허브로</a>
  </header>
  <div class="body" id="body">
    <nav class="nav" id="nav" aria-label="디자인 시스템 목록"></nav>
    <main class="main">
      <div class="main-h">
        <div class="ttl"><small id="grp"></small><b id="ttl">-</b></div>
        <div class="tools">
          <span class="seg" id="wseg"><button data-w="1024">1024</button><button data-w="360">360</button></span>
          <button class="doc-btn" id="docBtn" aria-pressed="false"><span class="ico"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M7 3h7l5 5v13H7z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M14 3v5h5M10 13h6M10 17h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>설명문서</button>
        </div>
      </div>
      <div class="stage" id="stage"></div>
    </main>
    <aside class="doc" id="doc" aria-label="설명문서">
      <div class="doc-resize" id="docResize"></div>
      <div class="doc-h"><h2>설명문서<small id="docPath"></small></h2>
        <button class="icon-btn" id="docClose" aria-label="설명문서 닫기"><span class="ico"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span></button></div>
      <div class="doc-c" id="docC"></div>
    </aside>
  </div>
  <div class="dim" id="dim"></div>
</div>
<script>
/* 조정 중 항목 — 정책(CLAUDE.md)과 DS 값을 맞추는 중인 것. 있을 때만 설명문서 패널 맨 위에 보인다 */
var ADJUST = [];
var FRAMEWORK_FILE = 'AD6zHJIIn6yJ0ifS8w5pYv';     /* nav.json에 Figma 파일 키 필드가 없을 때 쓰는 프레임워크 파일 */
var LEGACY = { overview:'DESIGN.md', foundations:'foundations.md#color', button:'components/button.md', input:'components/text-input.md',
  select:'components/select.md', modal:'components/modal.md', 'status-chip':'components/status-chip.md' };   /* 예전 ?p= 링크 */
var DS = new URL('../design-system/', location.href).href;
var $ = function(id){ return document.getElementById(id); };
var esc = function(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
var store = { get:function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set:function(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } };
var narrow = function(){ return window.matchMedia('(max-width:1024px)').matches; };
var NAV = [], ITEMS = [], cur = null, width = 1024, mdCache = {}, sampleCache = {}, frame = null;
var findItem = function(f){ return ITEMS.find(function(x){ return x.file === f; }) || ITEMS.find(function(x){ return x.file.split('#')[0] === String(f).split('#')[0]; }); };

/* ---------- 왼쪽 메뉴: nav.json ---------- */
fetch(DS + 'nav.json', {cache:'no-cache'}).then(function(r){ return r.json(); }).then(function(nav){
  NAV = nav; nav.forEach(function(g){ g.items.forEach(function(it){ it.group = g.group; ITEMS.push(it); }); });
  var q = new URLSearchParams(location.search);
  var want = q.get('item') || LEGACY[q.get('p')] || '';
  cur = findItem(want) || offNav(want) || ITEMS[0];
  renderNav(); show(cur, true);
}).catch(function(e){ $('stage').innerHTML = '<div class="empty"><b>nav.json을 불러오지 못했습니다</b>'+esc(e.message)+'</div>'; });

/* nav.json 목록에 없는 문서(예: 정책 문서가 가리키는 옛 파일)는 메뉴 선택 없이 설명문서만 연다 */
function offNav(f){
  if(!/^[\w\/.-]+\.md(#[\w-]+)?$/.test(f)) return null;
  var it = {title:f.split('/').pop().replace(/\.md.*$/, ''), file:f, status:'done', group:'목록에 없는 문서', figmaNodeIds:[], offNav:true};
  ITEMS.push(it); setTimeout(function(){ setDoc(true, false); }, 0); return it;
}
function openGroups(){ try{ return JSON.parse(store.get('dsNavOpen') || 'null') || {}; }catch(e){ return {}; } }
function renderNav(){
  var open = openGroups();
  $('nav').innerHTML = NAV.map(function(g, gi){
    var isOpen = open[g.group] !== undefined ? open[g.group] : (gi < 2 || g.items.indexOf(cur) >= 0);
    return '<button class="grp-h'+(isOpen?' open':'')+'" data-g="'+esc(g.group)+'" aria-expanded="'+isOpen+'"><span>'+esc(g.group)+'</span>'+
      '<span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span></button>'+
      '<div class="grp-items">'+g.items.map(function(it){
        var todo = it.status !== 'done';
        return '<button class="item'+(todo?' todo':'')+'" data-f="'+esc(it.file)+'"><span>'+esc(it.title)+'</span>'+(todo?'<span class="tag">준비 중</span>':'')+'</button>';
      }).join('')+'</div>';
  }).join('');
  $('nav').querySelectorAll('.grp-h').forEach(function(b){ b.addEventListener('click', function(){
    var o = openGroups(), now = !b.classList.contains('open'); b.classList.toggle('open', now); b.setAttribute('aria-expanded', now); o[b.dataset.g] = now; store.set('dsNavOpen', JSON.stringify(o)); }); });
  $('nav').querySelectorAll('.item').forEach(function(b){ b.addEventListener('click', function(){
    var it = findItem(b.dataset.f); if(it){ show(it); $('app').classList.remove('nav-open'); } }); });
}
function markNav(){
  $('nav').querySelectorAll('.item').forEach(function(b){ var on = !!cur && b.dataset.f === cur.file; b.classList.toggle('on', on); if(on) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  var g = $('nav').querySelector('.item.on'); if(g){ var h = g.parentNode.previousElementSibling; if(h && !h.classList.contains('open')){ h.classList.add('open'); h.setAttribute('aria-expanded', true); } }
}
function show(it, first){
  cur = it; markNav();
  $('grp').textContent = it.group; $('ttl').textContent = it.title;
  document.title = it.title + ' · 디자인 시스템';
  var u = new URL(location.href); u.searchParams.delete('p'); u.searchParams.set('item', it.file);
  if(width === 360) u.searchParams.set('w', '360'); else u.searchParams.delete('w');
  history[first ? 'replaceState' : 'pushState'](null, '', u);
  renderSample(it); renderDoc(it);
}
window.addEventListener('popstate', function(){ var it = findItem(new URLSearchParams(location.search).get('item')); if(it) show(it, true); });

/* ---------- 가운데: 견본 (nav.json의 sample = design-system/samples/*.html) ---------- */
/* 뷰어가 덧붙이는 표시용 스타일만(dsv- 접두사). DS 컴포넌트 값은 바꾸지 않는다.
   모달 배경처럼 화면에 고정(position:fixed)되는 요소는 견본 칸 안에 가둔다(transform) */
var VCSS = 'body{margin:0;padding:var(--ds-space-20);font-family:var(--ds-font-family-suit);color:var(--ds-color-text-primary);background:var(--ds-color-bg-primary);}'+
  '.dsv-card{border:1px solid var(--ds-color-border-secondary);border-radius:var(--ds-radius-8);margin-bottom:var(--ds-space-16);}'+
  '.dsv-head{display:flex;align-items:center;justify-content:space-between;gap:var(--ds-space-8);padding:var(--ds-space-8) var(--ds-space-12);border-bottom:1px solid var(--ds-color-border-secondary);background:var(--ds-color-bg-secondary);border-radius:var(--ds-radius-8) var(--ds-radius-8) 0 0;}'+
  '.dsv-title{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-weight:700;color:var(--ds-color-darkblue-600);text-align:left;text-decoration:underline;text-underline-offset:3px;}'+
  '.dsv-code{flex:0 0 auto;display:inline-flex;align-items:center;gap:var(--ds-space-4);min-height:28px;padding:0 var(--ds-space-8);border:1px solid var(--ds-color-border-primary);border-radius:var(--ds-radius-4);background:var(--ds-color-bg-primary);cursor:pointer;font:inherit;font-size:var(--ds-font-caption-xs-size);font-weight:600;color:var(--ds-color-text-secondary);}'+
  '.dsv-stage{position:relative;transform:translateZ(0);padding:var(--ds-space-16);}'+
  '.dsv-stage > section{display:flex;flex-wrap:wrap;gap:var(--ds-space-16);align-items:flex-start;}'+
  '.dsv-fig{margin:0;display:flex;flex-direction:column;gap:var(--ds-space-6);min-width:0;}'+
  '.dsv-fig > :first-child{align-self:flex-start;}'+'.dsv-fig.wide{flex:1 1 240px;}'+'.dsv-fig.wide > :first-child{align-self:stretch;}'+
  '.dsv-cap,.dsv-legend{font-size:var(--ds-font-caption-xs-size);line-height:var(--ds-font-caption-xs-line-height);color:var(--ds-color-text-secondary);}'+
  '.dsv-cap code,.dsv-legend code{font-family:ui-monospace,Menlo,monospace;color:var(--ds-color-text-tertiary);word-break:break-all;}'+
  '.dsv-legend{border-top:1px dashed var(--ds-color-border-secondary);padding:var(--ds-space-8) var(--ds-space-12);display:grid;grid-template-columns:auto 1fr;gap:var(--ds-space-2) var(--ds-space-12);}'+
  '.dsv-legend span{cursor:default;} .dsv-legend span:hover{color:var(--ds-color-darkblue-600);}'+
  '.dsv-hl{outline:2px dashed var(--ds-color-darkblue-600) !important;outline-offset:2px !important;}'+
  '.dsv-toast{position:fixed;left:50%;bottom:var(--ds-space-16);transform:translateX(-50%);padding:var(--ds-space-8) var(--ds-space-16);border-radius:var(--ds-radius-8);background:var(--ds-color-grey-900);color:var(--ds-color-base-white);font-size:var(--ds-font-body-ss-regular-size);}';
function dsClasses(el){ return Array.prototype.filter.call(el.classList, function(c){ return /^ds-/.test(c); }).map(function(c){ return '.'+c; }).join(' '); }
function renderSample(it){
  var stage = $('stage');
  if(it.status !== 'done' && !it.sample){ stage.innerHTML = '<div class="empty"><b>준비 중</b>문서와 견본을 준비하고 있습니다.</div>'; frame = null; return; }
  if(!it.sample){ stage.innerHTML = '<div class="empty"><b>견본 준비 중</b>이 항목은 아직 견본 파일이 없습니다. [설명문서]에서 문서를 볼 수 있습니다.</div>'; frame = null; return; }
  var go = function(html){
    if(cur !== it) return;
    stage.innerHTML = '<iframe id="sw" title="'+esc(it.title)+' 견본"></iframe>'; frame = $('sw');
    frame.style.width = width + 'px';
    frame.addEventListener('load', function(){ build(frame, html); });
    frame.srcdoc = '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">'+
      '<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/static/woff2/SUIT.css">'+
      '<link rel="stylesheet" href="'+DS+'css/tokens.css"><link rel="stylesheet" href="'+DS+'css/components.css"><style>'+VCSS+'</style></head><body></body></html>';
  };
  if(sampleCache[it.sample] != null) return go(sampleCache[it.sample]);
  fetch(DS + it.sample, {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(t){ sampleCache[it.sample] = t; go(t); })
    .catch(function(){ if(cur === it){ stage.innerHTML = '<div class="empty"><b>견본 준비 중</b><code>'+esc(it.sample)+'</code> 파일을 찾지 못했습니다.</div>'; frame = null; } });
}
function build(f, html){
  var d = f.contentDocument, body = d.body;
  var src = new DOMParser().parseFromString('<body>'+html+'</body>', 'text/html');
  var sections = Array.prototype.filter.call(src.body.children, function(el){ return el.matches('section[data-sample]'); });
  if(!sections.length){ body.innerHTML = '<p>견본 묶음(data-sample)이 없습니다.</p>'; fit(); return; }
  sections.forEach(function(sec){
    var code = sec.outerHTML, path = sec.getAttribute('data-sample');   /* [코드]로 복사할 원본 */
    var card = d.createElement('div'); card.className = 'dsv-card';
    card.innerHTML = '<div class="dsv-head"><button class="dsv-title" type="button" title="설명문서의 같은 절로 이동"></button>'+
      '<button class="dsv-code" type="button" title="이 견본의 HTML을 복사합니다"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>코드</button></div>'+
      '<div class="dsv-stage"></div>';
    card.querySelector('.dsv-title').textContent = path;
    card.querySelector('.dsv-stage').appendChild(d.importNode(sec, true)); body.appendChild(card);
    card.querySelector('.dsv-title').addEventListener('click', function(){ openDocAt(path); });
    card.querySelector('.dsv-code').addEventListener('click', function(){ copy(code, d); });
  });
  /* 라벨 표시: 묶음 바로 아래 요소는 밑에 작은 글씨로, 안쪽 부품·화면 고정 요소는 묶음 아래 목록으로 */
  body.querySelectorAll('.dsv-stage > section').forEach(function(sec){
    Array.prototype.slice.call(sec.children).forEach(function(el){
      var lab = el.getAttribute('data-label');
      if(!lab || d.defaultView.getComputedStyle(el).position === 'fixed') return;
      var fig = d.createElement('figure'); fig.className = 'dsv-fig' + (el.tagName === 'LABEL' || /\bds-(field|select|textarea)\b/.test(el.className) ? ' wide' : '');
      sec.insertBefore(fig, el); fig.appendChild(el);
      var cap = d.createElement('figcaption'); cap.className = 'dsv-cap'; cap.innerHTML = esc(lab) + (dsClasses(el) ? ' <code>'+esc(dsClasses(el))+'</code>' : ''); fig.appendChild(cap);
    });
    var rest = Array.prototype.filter.call(sec.querySelectorAll('[data-label]'), function(el){ return !(el.parentNode && el.parentNode.classList.contains('dsv-fig')); });
    if(!rest.length) return;
    var lg = d.createElement('div'); lg.className = 'dsv-legend';
    rest.forEach(function(el){
      var a = d.createElement('span'); a.textContent = el.getAttribute('data-label');
      var b = d.createElement('code'); b.textContent = dsClasses(el) || el.tagName.toLowerCase();
      [a, b].forEach(function(x){ x.addEventListener('mouseenter', function(){ el.classList.add('dsv-hl'); }); x.addEventListener('mouseleave', function(){ el.classList.remove('dsv-hl'); }); lg.appendChild(x); });
    });
    sec.closest('.dsv-card').appendChild(lg);
  });
  if(d.fonts) d.fonts.ready.then(fit);
  if(window.ResizeObserver) new ResizeObserver(function(){ requestAnimationFrame(fit); }).observe(body);
  fit();
}
/* 견본 칸 높이: 화면 고정 요소(모달 배경)·펼친 목록이 칸 밖으로 넘치지 않게 내용 끝에 맞춘다 */
function fit(){
  if(!frame || !frame.contentDocument || !frame.contentDocument.body) return;
  var d = frame.contentDocument, win = d.defaultView;
  d.querySelectorAll('.dsv-stage').forEach(function(stg){
    var top = stg.getBoundingClientRect().top, need = 0;
    stg.querySelectorAll('*').forEach(function(el){
      if(win.getComputedStyle(el).position === 'fixed'){
        var box = el.firstElementChild; if(box) need = Math.max(need, box.scrollHeight + 2 * parseFloat(win.getComputedStyle(el).paddingTop || 0) + 8);
        return;
      }
      if(el.closest('[style*="position: fixed"]')) return;
      var r = el.getBoundingClientRect(); if(r.height && !hasFixedAncestor(el, stg, win)) need = Math.max(need, r.bottom - top + 16);
    });
    if(Math.abs((parseFloat(stg.style.minHeight) || 0) - need) > 1) stg.style.minHeight = need + 'px';
  });
  var h = Math.max(160, d.documentElement.scrollHeight) + 'px'; if(frame.style.height !== h) frame.style.height = h;
}
function hasFixedAncestor(el, stop, win){ for(var p = el.parentElement; p && p !== stop; p = p.parentElement){ if(win.getComputedStyle(p).position === 'fixed') return true; } return false; }
function copy(text, d){
  var done = function(){ var t = d.createElement('div'); t.className = 'dsv-toast'; t.textContent = '견본 HTML을 복사했습니다'; d.body.appendChild(t); setTimeout(function(){ t.remove(); }, 1600); };
  var fallback = function(){ var ta = d.createElement('textarea'); ta.value = text; d.body.appendChild(ta); ta.select(); try{ d.execCommand('copy'); done(); }catch(e){} ta.remove(); };
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}
function setWidth(w){
  width = w; $('wseg').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on', +b.dataset.w === w); });
  if(frame){ frame.style.width = w + 'px'; setTimeout(fit, 80); }
  if(cur){ var u = new URL(location.href); if(w === 360) u.searchParams.set('w','360'); else u.searchParams.delete('w'); history.replaceState(null, '', u); }
}
$('wseg').querySelectorAll('button').forEach(function(b){ b.addEventListener('click', function(){ setWidth(+b.dataset.w); }); });
setWidth(+new URLSearchParams(location.search).get('w') === 360 ? 360 : 1024);

/* ---------- 오른쪽: 설명문서 ---------- */
function mdLink(href, base){
  if(/^(https?:|mailto:)/.test(href)) return {href:href, ext:true};
  if(href[0] === '#') return {href:href, anchor:href.slice(1)};
  var abs = new URL(href, DS + base).href, rel = abs.replace(DS, '');
  return findItem(rel) ? {href:'?item='+encodeURIComponent(rel), item:rel} : {href:abs, ext:true};
}
function slug(t){ return t.trim().toLowerCase().replace(/[^\w가-힣]+/g, '-').replace(/^-|-$/g, ''); }
function renderDoc(it){
  var file = it.file.split('#')[0], anchor = it.file.split('#')[1];
  $('docPath').textContent = 'design-system/' + file;
  var c = $('docC');
  var head = ADJUST.length ? '<div class="notice" role="note"><b>조정 중 항목</b><ul>'+ADJUST.map(function(a){ return '<li>'+a+'</li>'; }).join('')+'</ul></div>' : '';
  if(it.status !== 'done'){ c.innerHTML = head + '<div class="md" id="md"><h1>'+esc(it.title)+'</h1><p>문서를 준비하고 있습니다.</p></div>' + figmaHtml(it, ''); return; }
  var draw = function(text){
    if(cur !== it) return;
    c.innerHTML = head + '<nav class="toc" id="toc" aria-label="목차"></nav><div class="md" id="md"></div>' + figmaHtml(it, text);
    var md = $('md'); md.innerHTML = window.marked ? marked.parse(text) : '<pre>'+esc(text)+'</pre>';
    md.querySelectorAll('table').forEach(function(t){ var w = document.createElement('div'); w.className = 'tbl'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
    md.querySelectorAll('a[href]').forEach(function(a){
      var L = mdLink(a.getAttribute('href'), file); a.setAttribute('href', L.href);
      if(L.ext){ a.target = '_blank'; a.rel = 'noopener'; }
      if(L.item) a.addEventListener('click', function(e){ e.preventDefault(); var t = findItem(L.item); if(t){ show(t); if(L.item.indexOf('#') > 0) setTimeout(function(){ goAnchor(L.item.split('#')[1]); }, 400); } });
      if(L.anchor) a.addEventListener('click', function(e){ e.preventDefault(); goAnchor(L.anchor); });
    });
    var hs = md.querySelectorAll('h2, h3'), used = {};
    hs.forEach(function(h){ var s = 'h-' + (slug(h.textContent) || 'sec'); while(used[s]) s += '-'; used[s] = 1; h.id = s; });
    $('toc').innerHTML = hs.length ? '<b>목차</b>' + Array.prototype.map.call(hs, function(h){ return '<a href="#'+h.id+'" class="'+(h.tagName === 'H3' ? 'l3' : 'l2')+'">'+esc(h.textContent)+'</a>'; }).join('') : '';
    $('toc').querySelectorAll('a').forEach(function(a){ a.addEventListener('click', function(e){ e.preventDefault(); var t = document.getElementById(a.getAttribute('href').slice(1)); if(t) scrollDocTo(t); }); });
    c.scrollTop = 0;
    if(anchor) goAnchor(anchor, true);
  };
  if(mdCache[file] != null) return draw(mdCache[file]);
  c.innerHTML = head + '<p>불러오는 중…</p>';
  fetch(DS + file, {cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(t){ mdCache[file] = t; draw(t); })
    .catch(function(e){ if(cur === it) c.innerHTML = head + '<p class="err">문서를 불러오지 못했습니다 ('+esc(e.message)+')</p>' + figmaHtml(it, ''); });
}
/* Figma 링크 두 종류: .md 안의 DS 라이브러리 링크(값 기준) / nav.json figmaNodeIds = 프레임워크(사용 원칙 참고) */
function figmaHtml(it, text){
  var lib = [], seen = {}, re = /\[([^\]]+)\]\((https:\/\/www\.figma\.com\/[^)\s]+)\)/g, m;
  while((m = re.exec(text))){ var id = (m[2].match(/node-id=([\d-]+)/) || [])[1], k = id || m[2]; if(seen[k]) continue; seen[k] = 1;
    lib.push('<a href="'+esc(m[2])+'" target="_blank" rel="noopener">'+esc(m[1].replace(/\s*\d+[:\-]\d+$/, '') || 'Figma')+(id ? ' <code>'+id.replace('-', ':')+'</code>' : '')+'</a>'); }
  var key = it.figmaFileKey || it.figmaFile || it.fileKey || FRAMEWORK_FILE;
  var fw = (it.figmaNodeIds || []).map(function(n){ return '<a href="https://www.figma.com/design/'+encodeURIComponent(key)+'?node-id='+encodeURIComponent(n.replace(':', '-'))+'" target="_blank" rel="noopener">'+esc(it.title)+' <code>'+esc(n)+'</code></a>'; });
  return '<section class="figma"><h3>Figma 링크</h3>'+
    '<div class="fg"><span>DS 라이브러리 — 값 기준</span><div class="links">'+(lib.join('') || '<span>문서에 링크 없음</span>')+'</div></div>'+
    '<div class="fg"><span>프레임워크 — 사용 원칙 참고</span><div class="links">'+(fw.join('') || '<span>노드 없음</span>')+'</div>'+(it.figmaStatus ? '<span>'+esc(it.figmaStatus)+'</span>' : '')+'</div></section>';
}
function scrollDocTo(t){
  var c = $('docC'); c.scrollTop += t.getBoundingClientRect().top - c.getBoundingClientRect().top - 8;
  t.classList.add('hit'); setTimeout(function(){ t.classList.remove('hit'); }, 1600);
}
function goAnchor(a, quiet){ var t = document.getElementById(a) || document.getElementById('h-' + slug(a)); if(!t) return; if(quiet){ var c = $('docC'); c.scrollTop += t.getBoundingClientRect().top - c.getBoundingClientRect().top - 8; } else scrollDocTo(t); }
/* 견본 묶음 제목 → 같은 제목의 절. 경로(A > B)의 가장 안쪽 이름부터 맞는 제목을 찾는다 */
function openDocAt(path){
  setDoc(true);
  var norm = function(s){ return s.replace(/^[\d-]+\.\s*/, '').replace(/\s+/g, ' ').trim().toLowerCase(); };
  var segs = path.split('>').map(norm).reverse();
  var tryFind = function(){
    var hs = Array.prototype.slice.call(document.querySelectorAll('#md h1, #md h2, #md h3, #md h4'));
    if(!hs.length) return false;
    for(var i = 0; i < segs.length; i++){
      var s = segs[i], hit = hs.find(function(h){ return norm(h.textContent) === s; }) || hs.find(function(h){ var t = norm(h.textContent); return t.length > 1 && (t.indexOf(s) >= 0 || s.indexOf(t) >= 0); });
      if(hit){ setTimeout(function(){ scrollDocTo(hit); }, 40); return true; }
    }
    $('docC').scrollTop = 0; return true;
  };
  if(!tryFind()){ var n = 0, t = setInterval(function(){ if(tryFind() || ++n > 20) clearInterval(t); }, 150); }
}
function setDoc(open, save){
  $('body').classList.toggle('doc-open', open);
  $('app').classList.toggle('doc-drawer', open && narrow());
  $('docBtn').classList.toggle('on', open); $('docBtn').setAttribute('aria-pressed', open);
  if(save !== false && !narrow()) store.set('dsDocOpen', open ? '1' : '0');
  setTimeout(fit, 60);
}
$('docBtn').addEventListener('click', function(){ setDoc(!$('body').classList.contains('doc-open')); });
$('docClose').addEventListener('click', function(){ setDoc(false); });
$('dim').addEventListener('click', function(){ $('app').classList.remove('nav-open'); if($('body').classList.contains('doc-open')) setDoc(false, false); });
$('navBtn').addEventListener('click', function(){ $('app').classList.toggle('nav-open'); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && narrow()){ $('app').classList.remove('nav-open'); setDoc(false, false); } });
if(!narrow() && store.get('dsDocOpen') === '1') setDoc(true, false);   /* 열림 상태 기억(좁은 화면은 서랍이라 처음엔 닫힘) */
window.addEventListener('resize', function(){ $('app').classList.toggle('doc-drawer', $('body').classList.contains('doc-open') && narrow()); });

/* 설명문서 폭 조절 — 허브 패널과 같은 방식(왼쪽 경계를 끌기, 폭 기억) */
(function(){
  var body = $('body'), h = $('docResize'), MIN = 300, MAX = 760, drag = false, sx = 0, sw = 0;
  var saved = +store.get('dsDocWidth'); if(saved) body.style.setProperty('--doc-w', saved + 'px');
  var curW = function(){ return parseInt(getComputedStyle(body).getPropertyValue('--doc-w'), 10) || 420; };
  h.addEventListener('mousedown', function(e){ drag = true; sx = e.clientX; sw = curW(); h.classList.add('drag'); document.body.style.userSelect = 'none'; if(frame) frame.style.pointerEvents = 'none'; e.preventDefault(); });
  window.addEventListener('mousemove', function(e){ if(!drag) return; var w = Math.max(MIN, Math.min(Math.min(MAX, Math.round(innerWidth * .6)), sw + sx - e.clientX)); body.style.setProperty('--doc-w', w + 'px'); });
  window.addEventListener('mouseup', function(){ if(!drag) return; drag = false; h.classList.remove('drag'); document.body.style.userSelect = ''; if(frame) frame.style.pointerEvents = ''; store.set('dsDocWidth', curW()); fit(); });
})();
</script>
