<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/static/woff2/SUIT.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이로움케어 반응형 정책 — 프로토타입 허브</title>
<style>
  :root{
    --bg:#f5f6f8; --bg-elevated:#ffffff; --bg-sunken:#eef0f3;
    --border:#e2e5ea; --border-strong:#cbd0d8;
    --text:#1c2128; --text-secondary:#5b6472; --text-tertiary:#8890999;
    --accent:#3d5afe; --accent-soft:#eef0ff; --accent-text:#2a3fd6;
    --code-bg:#f1f2f6; --code-text:#c0392b;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --bg-elevated:#1c1f26; --bg-sunken:#12141a;
      --border:#2a2e37; --border-strong:#3a3f4b;
      --text:#e7e9ee; --text-secondary:#a2a9b6; --text-tertiary:#767d8a;
      --accent:#8ba3ff; --accent-soft:#20264a; --accent-text:#aebcff;
      --code-bg:#22252d; --code-text:#ff9d8a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'SUIT',-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh; display:flex; flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    height:60px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; background:var(--bg-elevated); border-bottom:1px solid var(--border);
    box-shadow:var(--shadow); z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); flex:0 0 auto;}
  .brand h1{font-size:15px; font-weight:700; margin:0; letter-spacing:-.01em;}
  .brand .sub{font-size:12px; color:var(--text-secondary); margin-left:8px; font-weight:400;}
  .top-actions{display:flex; align-items:center; gap:8px;}
  .doc-link{
    font-size:12.5px; color:var(--text-secondary); text-decoration:none; padding:7px 12px;
    border:1px solid var(--border); border-radius:8px; background:var(--bg-sunken);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:inherit;
  }
  .doc-link:hover{border-color:var(--border-strong); color:var(--text);}

  /* ---------- Shell: 좌측 메뉴(항상 노출) + 메인 영역(홈/상세 전환) ---------- */
  .shell{flex:1 1 auto; display:flex; min-height:0;}
  .main-area{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; min-height:0;}

  /* ---------- Body grid (상세 화면: 스테이지 + 정책 패널) ---------- */
  .body{flex:1 1 auto; display:grid; --policy-w:400px; grid-template-columns:1fr 6px var(--policy-w); min-height:0;}
  .body[hidden]{ display:none; }

  /* 우측 정책 패널 리사이즈 핸들 */
  .resize-handle{
    cursor:col-resize; background:transparent; position:relative; z-index:4;
  }
  .resize-handle::after{
    content:""; position:absolute; top:0; bottom:0; left:2px; width:2px; background:var(--border);
  }
  .resize-handle:hover::after, .resize-handle.dragging::after{ background:var(--accent); }
  .resize-handle.dragging{ background:color-mix(in srgb, var(--accent) 8%, transparent); }

  /* ---------- Left menu (항상 노출 — 홈/상세 화면 공통) ---------- */
  .sidebar-menu{
    width:220px; flex:0 0 220px;
    border-right:1px solid var(--border); background:var(--bg-elevated);
    overflow-y:auto; padding:14px 10px;
  }
  .menu-group-header{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    font-size:13.5px; font-weight:800; color:var(--text); padding:9px 8px; margin-top:10px;
    background:none; border:none; cursor:pointer; font-family:inherit; border-radius:6px; text-align:left;
  }
  .menu-group-header:first-child{margin-top:0;}
  .menu-group-header:hover{background:var(--bg-sunken);}
  .menu-group-header .count{color:var(--text-tertiary); font-weight:600; font-size:12px;}
  .menu-group-header .chev{color:var(--text-tertiary); transition:transform .15s; flex:0 0 auto;}
  .menu-group-header.open .chev{transform:rotate(90deg);}
  .menu-group-items{display:none;}
  .menu-group-items.open{display:block;}
  .menu-item{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
    padding:10px 10px; border-radius:8px; border:1px solid transparent; background:none;
    cursor:pointer; margin-bottom:4px; font-family:inherit;
  }
  .menu-item:hover{background:var(--bg-sunken);}
  .menu-item.active{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 35%, transparent);}
  .menu-num{
    flex:0 0 auto; min-width:22px; height:22px; padding:0 4px; border-radius:6px; background:var(--bg-sunken);
    color:var(--text-secondary); font-size:10.5px; font-weight:700; display:flex; align-items:center; justify-content:center;
  }
  .menu-item.active .menu-num{background:var(--accent); color:#fff;}
  .menu-text .menu-title{font-size:13px; font-weight:600; color:var(--text); margin-bottom:2px;}
  .menu-item.active .menu-text .menu-title{color:var(--accent-text);}
  .menu-text .menu-desc{font-size:11.5px; color:var(--text-secondary); line-height:1.4;}

  /* ---------- Center stage ---------- */
  .stage{display:flex; flex-direction:column; min-width:0; background:var(--bg-sunken);}
  .stage-header{
    flex:0 0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border); background:var(--bg-elevated);
  }
  .stage-header .file-title{font-size:13px; font-weight:700;}
  .stage-header .file-name{font-size:11.5px; color:var(--text-tertiary); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:2px;}
  .stage-header .open-new{
    font-size:12px; color:var(--accent-text); text-decoration:none; padding:6px 10px;
    border:1px solid var(--border); border-radius:7px; background:var(--bg-sunken); white-space:nowrap;
  }
  .stage-header .open-new:hover{border-color:var(--border-strong);}
  .proto-frame{flex:1 1 auto; width:100%; border:0; background:#fff;}

  /* ---------- Right policy panel ---------- */
  .policy-panel{
    border-left:1px solid var(--border); background:var(--bg-elevated);
    display:flex; flex-direction:column; min-width:0;
  }
  .policy-header{
    flex:0 0 auto; padding:14px 18px 12px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .policy-header h2{font-size:14.5px; margin:0; font-weight:700;}
  .toggle-btn{
    font-size:12.5px; color:var(--text-secondary); background:var(--bg-sunken); border:1px solid var(--border);
    border-radius:7px; padding:6px 10px; cursor:pointer; font-family:inherit;
  }
  .toggle-btn:hover{border-color:var(--border-strong); color:var(--text);}
  .toggle-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .policy-content{flex:1 1 auto; overflow-y:auto; padding:18px 20px 40px;}

  .p-section{margin-bottom:24px;}
  .p-section.primary .p-section-card{border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent);}
  .p-section-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px 17px; box-shadow:var(--shadow);}
  .p-tag{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.03em; color:var(--accent-text); background:var(--accent-soft); padding:3px 8px; border-radius:5px; margin-bottom:9px;}
  .p-tag.secondary{color:var(--text-secondary); background:var(--bg-sunken);}
  .p-section h3{font-size:15.5px; margin:0 0 9px; font-weight:700; letter-spacing:-.01em;}
  .p-section p{margin:0 0 9px; color:var(--text); font-size:14.5px; line-height:1.65;}
  .p-section p:last-child{margin-bottom:0;}
  .p-section ul, .p-section ol{margin:0 0 9px; padding-left:20px; font-size:14.5px; line-height:1.65;}
  .p-section li{margin-bottom:6px;}
  .p-section li:last-child{margin-bottom:0;}
  .mono, code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em; background:var(--code-bg); color:var(--code-text); padding:1px 5px; border-radius:4px;}
  .policy-table{width:100%; border-collapse:collapse; margin:0 0 11px; font-size:13.5px;}
  .policy-table th, .policy-table td{border:1px solid var(--border); padding:7px 9px; text-align:left; vertical-align:top;}
  .policy-table th{background:var(--bg-sunken); font-weight:700; color:var(--text-secondary); font-size:12.5px;}
  .related-toggle{
    width:100%; text-align:left; background:var(--bg-sunken); border:1px solid var(--border); border-radius:8px;
    padding:10px 13px; font-size:13.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;
  }
  .related-toggle:hover{color:var(--text); border-color:var(--border-strong);}
  .related-toggle .chev{transition:transform .15s ease;}
  .related-toggle.open .chev{transform:rotate(90deg);}
  .related-body{display:none;}
  .related-body.open{display:block;}
  .checklist{list-style:none; padding-left:0;}
  .checklist li{padding-left:22px; position:relative;}
  .checklist li::before{content:"☐"; position:absolute; left:0; color:var(--text-tertiary);}
  .checklist li.done{color:var(--text-secondary);}
  .checklist li.done::before{content:"☑"; color:var(--accent);}
  .checklist li.done .strike{text-decoration:line-through; color:var(--text-tertiary);}

  /* ---------- 전체 문서 보기: 좁은 사이드 패널 대신 넓은 오버레이 모달 ---------- */
  .doc-modal-overlay{
    position:fixed; inset:0; background:rgba(16,20,28,.5); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:5vh 20px;
  }
  .doc-modal-overlay[hidden]{ display:none; }
  .doc-modal{
    background:var(--bg-elevated); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.3);
    width:min(920px, 100%); height:100%; max-height:90vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .doc-modal-header{
    flex:0 0 auto; padding:18px 24px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .doc-modal-header h2{font-size:17px; margin:0; font-weight:700;}
  .doc-modal-close{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg-sunken);
    color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .doc-modal-close:hover{border-color:var(--border-strong); color:var(--text);}
  .doc-modal-body{flex:1 1 auto; overflow-y:auto; padding:24px 28px 48px;}
  .doc-modal-body .p-section p, .doc-modal-body .p-section ul, .doc-modal-body .p-section ol{font-size:15.5px;}
  .doc-modal-body .p-section h3{font-size:17px;}

  /* ---------- 홈 화면: 프로토타입을 카테고리별 썸네일 카드로 한눈에 ---------- */
  #homeView{flex:1 1 auto; overflow-y:auto; padding:32px 28px 60px;}
  #homeView[hidden]{ display:none; }
  .home-inner{max-width:1200px; margin:0 auto;}
  .home-intro{margin-bottom:24px;}
  .home-intro h2{font-size:20px; margin:0 0 6px; font-weight:800;}
  .home-intro p{font-size:14px; color:var(--text-secondary); margin:0; line-height:1.6;}
  .home-doc-card{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:32px; cursor:pointer; font:inherit; color:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  .home-doc-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .home-doc-card .icon{font-size:26px; flex:0 0 auto;}
  .home-doc-card .title{font-size:15.5px; font-weight:700; margin-bottom:2px;}
  .home-doc-card .desc{font-size:13px; color:var(--text-secondary);}
  .home-doc-card .arrow{margin-left:auto; font-size:18px; color:var(--text-tertiary); flex:0 0 auto;}

  .gallery-group-label{font-size:23px; font-weight:800; color:var(--text); letter-spacing:-.01em;
    margin:36px 0 16px; padding-bottom:10px; border-bottom:2px solid var(--border);}
  .gallery-group-label:first-child{margin-top:0;}
  .gallery-grid{display:flex; flex-wrap:wrap; gap:16px;}
  .gallery-card{width:280px; border:1px solid var(--border); border-radius:10px; overflow:hidden;
    background:var(--bg-elevated); cursor:pointer; text-align:left; transition:border-color .15s, box-shadow .15s;
    padding:0; margin:0; font:inherit; display:block;}
  .gallery-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .gallery-thumb{width:280px; height:175px; overflow:hidden; position:relative; background:#fff; pointer-events:none;
    border-bottom:1px solid var(--border);}
  .gallery-thumb iframe{width:1280px; height:800px; border:0; transform:scale(0.21875); transform-origin:top left;}
  .gallery-thumb-placeholder{width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--text-tertiary); font-size:13px;}
  .gallery-card-body{padding:12px 14px;}
  .gallery-card-title{font-size:14.5px; font-weight:700; color:var(--text); margin-bottom:4px;}
  .gallery-card-desc{font-size:12.5px; color:var(--text-secondary); line-height:1.5;}

  /* ---------- 상세 화면 상단 홈 버튼 ---------- */
  .home-back{
    font-size:12.5px; color:var(--text-secondary); text-decoration:none; padding:7px 12px;
    border:1px solid var(--border); border-radius:8px; background:var(--bg-sunken);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:inherit;
    cursor:pointer; flex:0 0 auto;
  }
  .home-back:hover{border-color:var(--border-strong); color:var(--text);}

  /* ---------- Responsive: stack on narrow viewports ---------- */
  @media (max-width: 980px){
    .shell{flex-direction:column;}
    .sidebar-menu{
      width:auto; flex:0 0 auto; max-height:180px;
      border-right:0; border-bottom:1px solid var(--border); display:flex; overflow-x:auto; overflow-y:hidden; padding:10px;
    }
    .sidebar-menu .menu-group-header{display:none;}
    .sidebar-menu .menu-group-items{display:flex !important;}
    .menu-item{flex:0 0 auto; width:220px; margin-bottom:0; margin-right:8px;}
    .body{grid-template-columns:1fr; grid-template-rows:auto minmax(300px,55vh) auto; overflow-y:auto;}
    .policy-panel{border-left:0; border-top:1px solid var(--border);}
    .resize-handle{display:none;}
    .doc-modal-overlay{padding:0;}
    .doc-modal{width:100%; height:100%; max-height:100%; border-radius:0;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>이로움케어 반응형 정책</h1>
      <span class="sub">프로토타입 허브</span>
    </div>
    <div class="top-actions">
      <button class="doc-link" id="toggleGallery" style="cursor:pointer;">🏠 홈</button>
      <a class="doc-link" href="CLAUDE.md" target="_blank" rel="noopener">📄 CLAUDE.md 원문</a>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar-menu" id="menu"></nav>
    <div class="main-area">
      <div id="homeView">
        <div class="home-inner">
          <div class="home-intro">
            <h2>이로움케어 반응형 정책 — 프로토타입 허브</h2>
            <p>좌측 카테고리별로 정리된 프로토타입을 클릭하면 실제 화면과 관련 정책 조항을 함께 볼 수 있습니다.</p>
          </div>
          <button class="home-doc-card" id="homeDocCard">
            <span class="icon">📄</span>
            <span>
              <div class="title">전체 정책 문서 보기</div>
              <div class="desc">CLAUDE.md 전체를 처음부터 끝까지 — 브레이크포인트 원칙부터 9번 운영관리 화면군까지</div>
            </span>
            <span class="arrow">›</span>
          </button>
          <div id="homeGrid"></div>
        </div>
      </div>

      <div class="body" id="bodyGrid" hidden>
        <main class="stage">
      <div class="stage-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="home-back" id="homeBackBtn">← 홈으로</button>
          <div>
            <div class="file-title" id="stageTitle">-</div>
            <div class="file-name" id="stageFile">-</div>
          </div>
        </div>
        <a class="open-new" id="stageOpen" href="#" target="_blank" rel="noopener">새 탭에서 열기 ↗</a>
      </div>
      <iframe class="proto-frame" id="protoFrame" title="prototype preview"></iframe>
    </main>
    <div class="resize-handle" id="resizeHandle"></div>
    <aside class="policy-panel">
      <div class="policy-header">
        <h2>관련 정책</h2>
        <button class="toggle-btn" id="toggleFullDoc">전체 문서 보기</button>
      </div>
      <div class="policy-content" id="policyContent"></div>
    </aside>
      </div>
    </div>
  </div>
</div>

<div class="doc-modal-overlay" id="docModalOverlay" hidden>
  <div class="doc-modal">
    <div class="doc-modal-header">
      <h2>CLAUDE.md 전체 문서</h2>
      <button class="doc-modal-close" id="docModalClose" aria-label="닫기">✕</button>
    </div>
    <div class="doc-modal-body" id="docModalBody"></div>
  </div>
</div>

<script>
/* ---------------- Policy section data (from CLAUDE.md) ---------------- */
var SECTIONS = {
  s1: { title:"1. 브레이크포인트 원칙", html:
    '<table class="policy-table"><thead><tr><th>값</th><th>역할</th></tr></thead><tbody>'+
    '<tr><td class="mono">1024px</td><td>PC ↔ 모바일 전환 기준 (전역, 유일한 1차 분기)</td></tr>'+
    '<tr><td class="mono">360px</td><td>모바일 구간 내 하위 기준 — 모바일 최소 지원폭, 모달 Full 전환</td></tr>'+
    '</tbody></table>'+
    '<p><strong>폐기된 값</strong>: 480px, 640px, 768px, 1060px — 전부 과거 검토 과정에서 임시로 쓰였다가 위 두 값으로 통합됨.</p>'+
    '<p><strong>1060px는 브레이크포인트가 아님</strong> — PC 레이아웃 내부 콘텐츠 컨테이너 고정 폭(1920 캔버스 → 1400 Wrapper → 1060 contents_wrapper)일 뿐.</p>'+
    '<p><strong>1024px은 레이아웃 기준이지 입력장치 기준이 아니다</strong> — 터치 노트북·랜드스케이프 태블릿도 폭 1024 이상이면 PC 레이아웃. hover 전용 인터랙션 금지(클릭으로도 100% 동작).</p>'+
    '<p><strong>PC 콘텐츠 영역 상한</strong>: <strong>확정(2026-09-23, Figma 4개 PC 화면 전수 확인)</strong> — <strong>1060px 고정, 전 화면 공통</strong>(페이지마다 다르지 않음). 정해두지 않으면 초광폭 모니터에서 무한정 늘어남. (구 4-3의 "1400px"는 좌측 aside(302px) 포함 Content Wrapper 폭 오기 — 정정)</p>' },

  s2: { title:"2. 레이아웃 전략 — 반응형 vs 적응형", html:
    '<table class="policy-table"><thead><tr><th>구분</th><th>정의</th><th>적용 사례</th></tr></thead><tbody>'+
    '<tr><td><strong>반응형</strong></td><td>같은 DOM을 CSS로 재배치</td><td>상세보기, 모달</td></tr>'+
    '<tr><td><strong>적응형</strong></td><td>PC·모바일 구조 자체가 다름(테이블 vs 카드)</td><td>리스트</td></tr>'+
    '</tbody></table>'+
    '<p>판단 기준: 정보 밀도·인터랙션 패턴이 본질적으로 다르면 적응형, 배치만 바꿔도 되면 반응형.</p>' },

  s31: { title:"3-1. 텍스트형 (읽기전용 정보 테이블)", html:
    '<p>예: 주문 정보, 회수 신청 정보 등 label-value 나열형 데이터.</p>'+
    '<ul>'+
    '<li>헤더(라벨) 셀: <span class="mono">max-width:128px; min-width:80px</span> (배경 <span class="mono">#f5f5f5</span>)</li>'+
    '<li>값 셀: <span class="mono">min-width:160px</span></li>'+
    '<li><strong>flex-shrink만 사용, wrap 없음</strong> — 최소 240px(80+160)까지 좌우 2열 유지 → 별도 스택 폴백 불필요</li>'+
    '<li>배경 없는 버전(회수정보 조회형): 라벨 125px, 배경 없음</li>'+
    '</ul>' },

  s32: { title:"3-2. 입력필드형 (실제 입력 가능한 폼 필드)", html:
    '<p>예: 배송정보 수정, 회수지 주소 수정 등.</p>'+
    '<ul>'+
    '<li>라벨: <span class="mono">125px 고정, flex-shrink:0</span></li>'+
    '<li>콘텐츠: <span class="mono">flex:1 0 0</span>, 최소폭은 모드에 따라 다름'+
      '<ul><li>수정 모드: <span class="mono">min-width:280px</span> → 전환 지점 125+4+280=<strong>409px</strong></li>'+
      '<li>조회 모드: <span class="mono">min-width:180px</span> → 전환 지점 125+8+180=<strong>313px</strong></li></ul></li>'+
    '<li>전환 지점은 브레이크포인트로 못박은 값이 아니라 공식에서 자연히 나오는 결과 — 문서엔 숫자 아닌 공식을 남길 것'+
      '<ul><li><strong>재확인(2026-09-28, Figma 노드 실측)</strong>: 409px·313px는 산수로 지어낸 값이 아니라 Figma에 그 폭 그대로 프레임이 존재함. <span class="mono">배송조회_입력폼</span>(node 6591:177940, 폭 409px)에서 라벨 x=0/w=125, 콘텐츠 x=129/w=280(gap 4px) 확인. <span class="mono">배송조회</span>(node 6591:173787, 폭 313px)에서 라벨 x=0/w=125, 콘텐츠 x=133/w=180(gap 8px) 확인. 340px 프레임(node 6591:160253)에서는 라벨/콘텐츠가 위아래로 줄바꿈된 상태도 확인.</li></ul></li>'+
    '<li>flex-wrap 컨테이너라 미디어쿼리 없이 순수 flexbox로 동작</li>'+
    '<li><strong>PC(1024px↑) 상한</strong>: 입력 콘텐츠 영역 <span class="mono">max-width:480px</span> (Figma 실측)</li>'+
    '</ul>' },

  s33: { title:"3-3. 모달", html:
    '<p><strong>타입 판단 기준</strong>: 테이블(행/열 데이터) 포함 여부 — 요소 개수가 아님.</p>'+
    '<table class="policy-table"><thead><tr><th>유형</th><th>사이즈</th><th>예시</th></tr></thead><tbody>'+
    '<tr><td>텍스트형(안내/확인)</td><td class="mono">sm-340</td><td>주문 불가 안내, 회수요청 취소 확인</td></tr>'+
    '<tr><td>정보확인/입력형/검색-리스트형</td><td class="mono">md-480</td><td>회수 요청하기, 회수접수 취소, 주소 수정, 상품 변경</td></tr>'+
    '<tr><td>테이블 포함형</td><td class="mono">lg-600 / xl-800</td><td>실제 사례 미확인 — 발생 시 문서 업데이트</td></tr>'+
    '</tbody></table>'+
    '<table class="policy-table"><thead><tr><th>구간</th><th>sm-340</th><th>md-480</th><th>lg-600/xl-800</th></tr></thead><tbody>'+
    '<tr><td>1024px↑</td><td>340 고정</td><td>480 고정</td><td>600/800 고정</td></tr>'+
    '<tr><td>360~1024px</td><td>340 고정</td><td><strong>340으로 축소</strong></td><td><strong>Full</strong>(테이블 가로 스크롤)</td></tr>'+
    '<tr><td>360px 미만</td><td colspan="3">Full, 좌우 마진 10px</td></tr>'+
    '</tbody></table>'+
    '<p><strong>버튼 폭</strong>: md/lg가 1024px↑(=480/600으로 뜬 상태)일 때 각 150px 고정폭, gap 12px 가운데 정렬(150+12+150=312px). sm-340은 항상 전체폭 분할.</p>'+
    '<ul><li>딤(dim) 배경 위 정중앙 정렬</li><li>오버레이(모달/드롭다운/달력/바텀시트)는 하나만 — 새로 열리면 기존 것 자동 닫힘</li>'+
    '<li>내용이 넘치면 모달 자체를 max-height로 제한, 내부 스크롤(정중앙 정렬 유지)</li></ul>' },

  s34: { title:"3-4. 액션 버튼 배치", html:
    '<ul>'+
    '<li><strong>PC</strong>: 페이지 타이틀 옆(우측), Hug 사이즈(<span class="mono">flex:0 0 auto</span>) — 전체폭 분할 금지</li>'+
    '<li><strong>모바일</strong>: 타이틀 아래로 이동 + 화면 하단 sticky 플로팅(흰색 그라데이션 페이드), 버튼은 폭을 나눠 가짐(Full)</li>'+
    '<li>모바일 하단 sticky 요소는 <span class="mono">env(safe-area-inset-bottom)</span> 필수</li>'+
    '</ul>' },

  s35: { title:"3-5. 팝오버 / 바텀시트", html:
    '<ul>'+
    '<li><strong>PC</strong>: anchored popover — 호버 200ms 지연 후 열림, 300ms 지연 후 닫힘. 다른 그룹 아이콘 호버 시 기존 팝오버 즉시 닫고 새로 열림</li>'+
    '<li><strong>모바일</strong>: 탭하면 바텀시트로 열림</li>'+
    '<li>달력/셀렉트 드롭다운 동일 원칙: 모바일은 트리거와 동일한 좌우 여백(<span class="mono">left:0;right:0</span>), PC만 고정폭(예: 달력 320px)</li>'+
    '<li><strong>바텀시트 공통 스펙</strong>(Figma 확인, 2026-09-22): 상단 모서리 반경 <strong>40px</strong>, 드래그 핸들바 없음(타이틀+X로 바로 시작). 타이틀 상단 여백 <strong>32px</strong>(바깥 래퍼 12px+안쪽 Contents 래퍼 20px 합산 — 이중 래퍼 구조 그대로 가져갈 것)</li>'+
    '</ul>' },

  s36: { title:"3-6. 페이지네이션 (PC 전용)", html:
    '<p><strong>확정(Figma 실측, 2026-09-23)</strong> — 이전엔 스펙 없이 임시 구현, 이제 정식 규칙.</p>'+
    '<ul>'+
    '<li>3분할(<span class="mono">justify-content:space-between</span>): 좌측 "전체 N/M" 건수 · 중앙 이전/다음+페이지 번호 · 우측 "N개씩" 선택</li>'+
    '<li>페이지 번호 버튼: <strong>32×32px, radius 4px</strong> — 원형/알약 아님</li>'+
    '<li><strong>활성 페이지</strong>: 브랜드색 꽉 채움이 아니라 <strong>연한 틴트 배경(<span class="mono">#eff1fd</span>) + 진한 텍스트(<span class="mono">#141e76</span>) semibold</strong></li>'+
    '<li>이전/다음 버튼: 테두리 없는 아이콘 버튼, 비활성 시 투명도로만 표시</li>'+
    '<li>모바일에는 이 컴포넌트 없음(카드 리스트는 별도 스크롤 방식)</li>'+
    '</ul>' },

  s41: { title:"4-1. 대여 회수 상세보기", html:
    '<ul>'+
    '<li>상태별 액션 버튼:'+
      '<ul><li>회수접수 · 회수확인중 → 회수접수 취소 + 이로움에 회수 요청</li>'+
      '<li>회수요청 → <strong>회수요청 취소</strong>(활성) <em>— 구 명칭 "회수철회" 폐기, 2026-09-22 확정</em>. <strong>사유 수집 안 함</strong>(확정, 2026-09-23) — 접수취소와 달리 사유 없이 바로 취소, 형평성 문제는 현상 유지로 종결</li>'+
      '<li>회수준비중 · 회수완료 · 회수취소 · 회수취소완료 → 액션 버튼 없음</li></ul></li>'+
    '<li><strong>마스킹</strong>: 수급자/신청자 정보는 회수접수 상태에서만 마스킹, 이후 상태는 전체 노출</li>'+
    '<li><strong>신청자 정보 필드</strong>: 수급자 이름 / 보호자 이름 / 상담받을 연락처 / 회수지주소 — 요양인정번호는 불포함</li>'+
    '<li><strong>회수지주소</strong>: 주소 텍스트 위, "수정"(Filled) 아래로 세로 배치된 하나의 셀(PC colspan 전체폭)</li>'+
    '<li>모달: 케어 공통 컴포넌트(타이틀+X) 통일, 회수 요청은 2단계(요청하기→요청 확인)+전체/하위동의, 회수지 주소는 우편번호/기본주소(읽기전용)/상세주소 3필드</li>'+
    '<li>서비스 불가 지역은 <span class="mono">alert()</span> 대신 모달 내 인라인 안내</li>'+
    '<li>취소 사유는 상품 정보 영역(상품명 아래) 배경 없는 텍스트 한 줄</li>'+
    '<li>정보 테이블: 라벨-값 한 줄 유지, 완전 스택 금지 / 모바일 전용 접기·펼치기(PC 미노출)</li>'+
    '<li><strong>브레이크포인트</strong> — <strong>정정(2026-09-28)</strong>: 폐기된 640px 미디어쿼리 → 전 화면 공통 1024px 기준으로 통일. 프리셋 프레임 도구·PC 1060px 캡핑도 추가</li>'+
    '</ul>' },

  s42: { title:"4-2. 주문요청관리 리스트", html:
    '<ul>'+
    '<li><strong>적응형</strong>: PC=테이블, 모바일=카드</li>'+
    '<li>PC 검색: 기본 주문일자만, "상세" 토글로 품목/상태/검색어 펼침. 날짜 두 개+구간 세그먼트(3개월/일주일/이번달/지난달/1년), 라벨 <strong>120px</strong>(⚠️ 3-2 입력필드형 라벨 125px와는 다른 값, 혼동 주의)</li>'+
    '<li><strong>꺽쇠 탭(PC)</strong>: 활성 탭은 좌·우·상단 2px 테두리만, 하단은 탭 그룹 전체를 감싸는 2px 라인 하나 공유</li>'+
    '<li><strong>모바일 구입/대여 전환</strong>: <strong>확정(2026-09-22, Figma 가이드 메모 대조)</strong> — filled segmented toggle(풀와이드). 회색(<span class="mono">#eee</span>) 알약 트랙 안에서 선택된 세그먼트만 브랜드색(<span class="mono">#323da3</span>) 배경. 토글·필터칩 영역은 동일 배경(<span class="mono">#fafafa</span>), 사이 구분선 없음. "대여 주문"에서만 "품목" 필터칩 노출</li>'+
    '<li>모바일 카드 본문: 돌봄주문번호/주문번호 행은 삭제됨 — 헤더는 상태칩+신청일시, 본문은 수급자명(마스킹)+품목+상품정보. "함께 요청" 배지는 흰 배경 그림자 알약 스타일</li>'+
    '<li>모바일 바텀시트 <strong>4종</strong>(3종에서 정정, 2026-09-22): 검색(주문요청일 2단 버튼그룹+날짜범위+품목/상태 선택+상세검색), 품목 선택, <strong>주문상태 선택</strong>(전체+9개 상태 — 이전 누락됐던 시트), 함께 요청. 품목/상태 시트는 라디오가 아니라 틴트 배경(<span class="mono">#eff1fd</span>)+체크마크. 바텀시트 공통: 상단 모서리 40px, 핸들바 없이 타이틀+X로 시작</li>'+
    '<li>그룹 행 하이라이트: 동일 수급자+동일 시간대는 <span class="mono">#EFF1FD</span> → <span class="mono">#E8F5E9</span> 교차 배경</li>'+
    '<li>함께 요청 배지: 숫자는 본인 제외 나머지 건수, 품목 검색 시 배지 노출하되 배경 강조색 미적용</li>'+
    '<li><strong>함께 요청 바텀시트</strong>: 서브헤딩 "동일 시간대에 요청된 묶음 주문 건", 항목마다 chevron 필수, 하단은 "확인"(필드) 단일 버튼. <strong>확정(2026-09-23)</strong>: 노출은 현재 조회 상품 제외 나머지, 탭 시 해당 상품 주문요청관리 상세로 이동</li>'+
    '<li><strong>주문번호 노출 조건</strong>: <strong>정정(2026-09-22)</strong> — "이상" 비교로 설명 안 되는 취소 계열이 있어 전체 목록으로 명시. 노출: 주문완료/출고준비중/출고완료/배송완료/취소요청/취소완료. 비노출(<span class="mono">-</span>): 신규배정/주문확인중/주문취소</li>'+
    '<li>모바일 카드 터치 영역 3분리(카드 전체/주문번호/함께요청) — 목적지가 달라 <span class="mono">stopPropagation()</span> 필수</li>'+
    '<li>아이콘은 이모지 대신 인라인 SVG(Lucide 스타일)</li>'+
    '</ul>' },

  s43: { title:"4-3. 주문요청관리 상세", html:
    '<ul>'+
    '<li>PC 콘텐츠 영역 상한 <span style="text-decoration:line-through;color:var(--text-tertiary);">1400px</span> → <strong>정정(2026-09-23): 1060px</strong> — 1400px는 좌측 aside 포함 Content Wrapper 폭이었음</li>'+
    '<li>상태별 조건부 노출:'+
      '<ul><li>총 대여 금액 바: 요양정보 확인 후부터, 신규배정·주문취소·취소완료는 미노출</li>'+
      '<li>배송희망일: 신규배정 미노출, 주문확인중부터 편집 가능, <strong>주문완료 이후 읽기전용 — 확정(2026-09-23)</strong>, 주문취소·취소완료 미노출(침대 품목에서만 해당, 배송정보 변경과 별개 필드). <strong>단, 완전 잠금 아님</strong> — "배송정보 변경하기" 진입 시 함께 수정 가능해짐</li>'+
      '<li>설치옵션 추가/삭제, 상품변경: 주문완료 이후 읽기전용 리스트로 전환</li></ul></li>'+
    '<li>코드 레벨: 모든 input/select는 배경·글자색 명시적 지정(OS 다크모드 자동 반영 렌더링 사고 방지 — select 검은 배경 버그 실제 발생)</li>'+
    '</ul>' },

  s44: { title:"4-4. 대여 회수 관리 리스트", html:

  s9: { title:"9. 이로움케어 사업소 / 운영관리 화면군", html:
    '<p><strong>배경</strong>: 대대여(플러스+) 운영관리 시스템은 현재 PC가 PHP, 모바일이 별도 React 앱으로 <strong>이중 관리</strong>되고 있음 — 이 반응형 정책 문서를 만드는 근본 이유. Figma 파일 <span class="mono">H8lqlZitePnf5dTDPB5GzR</span>에 운영관리 앱 3개: <strong>이로움케어 사업소</strong>(사업소 직원용) / <strong>입출고 창고</strong>(창고 직원용) / <strong>설치파트너</strong>(설치업체용). 1~8번은 전부 소비자용 화면 기준이었고, 9번부터 운영관리 화면군.</p>'+
    '<p style="background:var(--accent-soft);border-radius:8px;padding:10px 12px;"><strong>⚠️ 중요 정정(2026-09-28)</strong>: 9-1의 셸(GNB+SideNav+Container)은 <strong>Figma에만 있는, 아직 서비스에 반영 안 된 리뉴얼 디자인</strong>이다. 실제 운영 중인 사업소 화면은 탭+이벤트배너+다중 링크의 무거운 GNB, 계정박스+장바구니위젯+공지사항까지 붙은 복잡한 SNB를 쓰는 <strong>구버전 셸</strong> — 사업소도 리뉴얼을 시도했지만 개발 반영이 안 끝난 상태. 반면 입출고 창고·설치파트너는 <strong>리뉴얼이 실제로 배포</strong>돼서 새 셸을 쓴다. → 템플릿 표준은 새 셸로 채택, 사업소 구버전은 별도 반응형 규칙화하지 않음(새 셸로 교체가 목표) — 즉 9-1은 <strong>입출고 창고·설치파트너 전용이고 사업소는 제외</strong>.</p>'+
    '<h4>콘텐츠 컨테이너 · 셸 (입출고 창고·설치파트너 전용)</h4>'+
    '<ul>'+
    '<li>PC: GNB(56px, 미니멀) + SideNav(240px) + 콘텐츠 <span class="mono">1200px</span>(내부 패딩 32px → 실콘텐츠 <strong>1136px</strong>) — 14회 반복 확인. 소비자용 1060px과 다른 값</li>'+
    '<li>모바일 콘텐츠 컨테이너: 360px, 내부 패딩 20px → 실콘텐츠 <strong>320px</strong> — 1번 360px 규칙과 일치</li>'+
    '<li><strong>SideNav→모바일 전환(재정정, 2026-09-28 실화면 노드 실측)</strong>: PC SideNav는 사라지고 <strong>상단 GNB가 브랜드색(#323da3) 배경+흰 타이틀+우측 햄버거(48×48)</strong>로 바뀜 — 이 상단 햄버거가 전체메뉴를 여는 실제 트리거. 햄버거 탭 시 <strong>전체화면 <span class="mono">전체메뉴</span> 오버레이</strong>(프로필카드+로그아웃 → 구분선 8px → <span class="mono">Sidemenu_Items</span> 메뉴리스트, PC 42px→모바일 48px). 이전엔 화면 하단 <span class="mono">System_navigation</span>(48px, 햄버거/닫기/뒤로가기 아이콘)을 앱 내비게이션으로 잘못 봤으나, 이건 Android 3버튼 시스템 내비 같은 <strong>OS 레벨 chrome 목업</strong>이라 우리 앱 UI가 아님(제외). 설치파트너는 하단 유사 아이콘만 확인, 상단 GNB 구조는 미재확인</li>'+
    '</ul>'+
    '<h4>기존 규칙 재사용 확인됨 (이로움케어 사업소)</h4>'+
    '<p>상세형(텍스트형+입력필드형+버튼), 주문신청폼(입력필드형), 이용현황(Tab+세그먼트+페이지네이션), 정산(텍스트형 테이블) — 전부 3-1~3-6 그대로. 모달은 <span class="mono">Modal_xl_800_계약서</span> — <strong>3번 "lg-600/xl-800 실제 사례 미확인" 항목의 첫 확인 사례</strong>.</p>'+
    '<h4>신규 패턴 6개 발견</h4>'+
    '<ul>'+
    '<li><strong>상품 카드 그리드 리스트</strong>(이로움케어 사업소) — PC 자체가 카드 그리드(필터+정렬+Pagination). "적응형"과 다른 제3의 리스트 유형</li>'+
    '<li><strong>Toast 알림</strong>(입출고 창고) — radius 8px, 아이콘24+텍스트16 SemiBold, 시맨틱별 색상 변경(danger 예시 확인, 나머지 variant 추후 실측)</li>'+
    '<li><strong>좌측 컬럼 고정 + 가로 스크롤 테이블</strong>(입출고 창고) — 컬럼 8~9개 이상 넓은 테이블에서 앞쪽 컬럼군 고정, "표를 밀어보세요" 힌트</li>'+
    '<li><strong>월간 캘린더</strong>(설치파트너) — 7열 그리드가 1136px을 정확히 7등분, 날짜별 이벤트 pill+건수 배지</li>'+
    '<li><strong>지도+리스트 스플릿 뷰</strong>(설치파트너) — 지도 위 마커 + 우측 플로팅 리스트 패널(722px). 모바일: 지도 전체화면 위 <strong>드래그형 하단 리스트</strong>(<span class="mono">bottom_List</span>)로 전환 — 확인됨</li>'+
    '<li><strong>사진 업로드 그리드</strong>(설치파트너) — 88×88px 썸네일, 최대 10장, 각 우상단 닫기버튼</li>'+
    '</ul>'+
    '<h4>아직 확인 안 된 것</h4>'+
    '<ul class="checklist">'+
    '<li>캘린더의 모바일 반응형 처리 — PC 전용으로만 확인됨</li>'+
    '<li>Toast 색상 variant(success/warning 등), 노출 위치/스택 방식</li>'+
    '<li>설치파트너 라벨 폭(160px)이 다른 화면에서도 일관된 값인지</li>'+
    '<li>이로움케어 사업소 나머지(회수, 서비스 제공 안내), 반품/AS·수급자관리 화면(추후 Figma 추가 예정)</li>'+
    '</ul>' }
};

/* ---------------- Render ---------------- */
var state = { activeId:null, openCategory:"common-pattern" };

function toggleCategory(cat){
  state.openCategory = (state.openCategory === cat) ? null : cat;
  renderMenu();
}
function renderMenu(){
  var html = '';
  CATEGORY_ORDER.forEach(function(cat, catIdx){
    var items = PROTOS.filter(function(p){ return p.category === cat; });
    if(!items.length) return;
    var isOpen = state.openCategory === cat;
    html += '<button class="menu-group-header'+(isOpen?' open':'')+'" onclick="toggleCategory(\''+cat+'\')">'+
      '<span>'+CATEGORY_LABEL[cat]+' <span class="count">('+items.length+')</span></span>'+
      '<span class="chev">›</span></button>';
    html += '<div class="menu-group-items'+(isOpen?' open':'')+'">';
    items.forEach(function(p, itemIdx){
      /* 번호는 "대카테고리-항목" 형식(예: 1-1, 1-2, 2-1) — 중간에 항목이 추가돼도
         해당 카테고리 안에서만 밀리고 다른 카테고리 번호는 안 흔들림 */
      html += '<button class="menu-item'+(state.activeId===p.id?' active':'')+'" onclick="selectProto(\''+p.id+'\')">'+
        '<span class="menu-num">'+(catIdx+1)+'-'+(itemIdx+1)+'</span>'+
        '<span class="menu-text"><div class="menu-title">'+p.title+'</div><div class="menu-desc">'+p.desc+'</div></span>'+
        '</button>';
    });
    html += '</div>';
  });
  document.getElementById('menu').innerHTML = html;
}

function renderStage(){
  var p = PROTOS.find(function(x){ return x.id === state.activeId; });
  document.getElementById('stageTitle').textContent = p.title;
  document.getElementById('stageFile').textContent = 'prototypes/'+p.id;
  document.getElementById('stageOpen').href = 'prototypes/'+p.id;
  document.getElementById('protoFrame').src = 'prototypes/'+p.id;
}

function sectionCard(sid, isPrimary){
  var s = SECTIONS[sid];
  return '<div class="p-section'+(isPrimary?' primary':'')+'">'+
    '<div class="p-section-card">'+
    '<span class="p-tag'+(isPrimary?'':' secondary')+'">'+(isPrimary?'핵심 규칙':'함께 참고')+'</span>'+
    '<h3>'+s.title+'</h3>'+s.html+
    '</div></div>';
}

function renderPolicy(){
  var box = document.getElementById('policyContent');
  var p = PROTOS.find(function(x){ return x.id === state.activeId; });
  var html = sectionCard(p.primary, true);
  if(p.related && p.related.length){
    html += '<button class="related-toggle" id="relatedToggle" onclick="toggleRelated()">'+
      '<span>함께 참고할 조항 ('+p.related.length+')</span><span class="chev">›</span></button>'+
      '<div class="related-body" id="relatedBody">'+
      p.related.map(function(sid){ return sectionCard(sid, false); }).join('')+
      '</div>';
  }
  box.innerHTML = html;
}

function toggleRelated(){
  document.getElementById('relatedToggle').classList.toggle('open');
  document.getElementById('relatedBody').classList.toggle('open');
}

function selectProto(id){
  state.activeId = id;
  var p = PROTOS.find(function(x){ return x.id === id; });
  state.openCategory = p.category; /* 선택한 항목의 대카테고리를 자동으로 펼침 */
  document.getElementById('homeView').hidden = true;
  document.getElementById('bodyGrid').hidden = false;
  document.getElementById('homeGrid').innerHTML = ''; /* 썸네일 iframe 정리 */
  renderMenu(); renderStage(); renderPolicy();
}

/* ---------------- 전체 문서 모달 ---------------- */
var docModalOverlay = document.getElementById('docModalOverlay');
function openDocModal(){
  document.getElementById('docModalBody').innerHTML =
    FULL_DOC_ORDER.map(function(sid){ return sectionCard(sid, false); }).join('');
  docModalOverlay.hidden = false;
}
function closeDocModal(){ docModalOverlay.hidden = true; }
document.getElementById('toggleFullDoc').addEventListener('click', openDocModal);
document.getElementById('docModalClose').addEventListener('click', closeDocModal);
docModalOverlay.addEventListener('click', function(e){ if(e.target === docModalOverlay) closeDocModal(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !docModalOverlay.hidden) closeDocModal(); });

/* ---------------- 홈 화면 (카테고리별 프로토타입 카드 그리드) ---------------- */
function renderHome(){
  var html = '';
  CATEGORY_ORDER.forEach(function(cat){
    var items = PROTOS.filter(function(p){ return p.category === cat; });
    if(!items.length) return;
    html += '<div class="gallery-group-label">'+CATEGORY_LABEL[cat]+' ('+items.length+')</div><div class="gallery-grid">';
    items.forEach(function(p){
      html += '<button class="gallery-card" onclick="selectProto(\''+p.id+'\')">'+
        '<div class="gallery-thumb"><iframe src="prototypes/'+p.id+'" loading="lazy" tabindex="-1"></iframe></div>'+
        '<div class="gallery-card-body">'+
        '<div class="gallery-card-title">'+p.title+'</div>'+
        '<div class="gallery-card-desc">'+p.desc+'</div>'+
        '</div></button>';
    });
    html += '</div>';
  });
  document.getElementById('homeGrid').innerHTML = html;
}
function goHome(){
  state.activeId = null;
  document.getElementById('bodyGrid').hidden = true;
  document.getElementById('homeView').hidden = false;
  renderHome();
  renderMenu(); /* 좌측 메뉴는 홈에서도 항상 노출 — active 표시 해제 반영 */
}
document.getElementById('toggleGallery').addEventListener('click', goHome);
document.getElementById('homeBackBtn').addEventListener('click', goHome);
document.getElementById('homeDocCard').addEventListener('click', openDocModal);

/* ---------------- 우측 패널 드래그 리사이즈 ---------------- */
(function(){
  var bodyGrid = document.getElementById('bodyGrid');
  var handle = document.getElementById('resizeHandle');
  var protoFrame = document.getElementById('protoFrame');
  var MIN_W = 300, MAX_W = 760;
  var saved;
  try{ saved = localStorage.getItem('policyPanelWidth'); }catch(e){}
  if(saved){ bodyGrid.style.setProperty('--policy-w', saved + 'px'); }

  var dragging = false, startX = 0, startW = 0;
  function currentWidth(){
    var v = getComputedStyle(bodyGrid).getPropertyValue('--policy-w').trim();
    return parseInt(v, 10) || 400;
  }
  function onMove(e){
    if(!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var delta = startX - x; // 왼쪽으로 끌면 패널이 넓어짐
    var maxAllowed = Math.min(MAX_W, Math.round(window.innerWidth * 0.6));
    var w = Math.max(MIN_W, Math.min(maxAllowed, startW + delta));
    bodyGrid.style.setProperty('--policy-w', w + 'px');
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    if(protoFrame) protoFrame.style.pointerEvents = '';
    try{ localStorage.setItem('policyPanelWidth', currentWidth()); }catch(e){}
  }
  function onDown(e){
    dragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startW = currentWidth();
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    if(protoFrame) protoFrame.style.pointerEvents = 'none';
    e.preventDefault();
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
})();

goHome();
</script>
