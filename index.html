<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/static/woff2/SUIT.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이로움케어 반응형 정책 — 프로토타입 허브</title>
<style>
  :root{
    --bg:#f5f6f8; --bg-elevated:#ffffff; --bg-sunken:#eef0f3;
    --border:#e2e5ea; --border-strong:#cbd0d8;
    --text:#1c2128; --text-secondary:#5b6472; --text-tertiary:#8890999;
    --accent:#3d5afe; --accent-soft:#eef0ff; --accent-text:#2a3fd6;
    --code-bg:#f1f2f6; --code-text:#c0392b;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --bg-elevated:#1c1f26; --bg-sunken:#12141a;
      --border:#2a2e37; --border-strong:#3a3f4b;
      --text:#e7e9ee; --text-secondary:#a2a9b6; --text-tertiary:#767d8a;
      --accent:#8ba3ff; --accent-soft:#20264a; --accent-text:#aebcff;
      --code-bg:#22252d; --code-text:#ff9d8a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'SUIT',-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh; display:flex; flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    height:60px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; background:var(--bg-elevated); border-bottom:1px solid var(--border);
    box-shadow:var(--shadow); z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot{width:10px; height:10px; border-radius:50%; background:var(--accent); flex:0 0 auto;}
  .brand h1{font-size:15px; font-weight:700; margin:0; letter-spacing:-.01em;}
  .brand .sub{font-size:12px; color:var(--text-secondary); margin-left:8px; font-weight:400;}
  .top-actions{display:flex; align-items:center; gap:8px;}
  /* ---------- 검색 (2026-09-30) ---------- */
  .search-wrap{position:relative;}
  .search-box{display:flex; align-items:center; gap:8px; width:340px; height:36px; padding:0 10px; border:1px solid var(--border);
    border-radius:8px; background:var(--bg-sunken); color:var(--text-tertiary);}
  .search-box:focus-within{border-color:var(--accent); background:var(--bg-elevated);}
  .search-box input{flex:1 1 auto; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:13px;}
  .search-box kbd{font:inherit; font-size:11px; color:var(--text-tertiary); border:1px solid var(--border); border-radius:4px; padding:1px 5px;}
  .search-results{position:absolute; top:42px; right:0; width:460px; max-height:70vh; overflow-y:auto; background:var(--bg-elevated);
    border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.18); padding:6px; z-index:50;}
  .search-results[hidden]{display:none;}
  .sr-item{display:block; width:100%; text-align:left; font:inherit; color:var(--text); background:none; border:0; border-radius:8px; padding:9px 10px; cursor:pointer;}
  .sr-item.active, .sr-item:hover{background:var(--accent-soft);}
  .sr-top{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;}
  .sr-kind{flex:0 0 auto; font-size:11px; font-weight:700; color:var(--accent-text); background:var(--accent-soft); border-radius:4px; padding:1px 6px;}
  .sr-item.active .sr-kind, .sr-item:hover .sr-kind{background:var(--bg-elevated);}
  .sr-snip{font-size:12px; color:var(--text-secondary); margin-top:3px; line-height:1.5;}
  .sr-empty{font-size:13px; color:var(--text-tertiary); padding:14px 10px;}
  mark{background:#ffe58a; color:inherit; border-radius:2px; padding:0 1px;}
  @media (max-width: 980px){ .search-box{width:200px;} .search-results{width:min(460px, calc(100vw - 32px));} }
  .doc-link{
    font-size:12.5px; color:var(--text-secondary); text-decoration:none; padding:7px 12px;
    border:1px solid var(--border); border-radius:8px; background:var(--bg-sunken);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:inherit;
  }
  .doc-link:hover{border-color:var(--border-strong); color:var(--text);}

  /* ---------- Shell: 좌측 메뉴(항상 노출) + 메인 영역(홈/상세 전환) ---------- */
  .shell{flex:1 1 auto; display:flex; min-height:0;}
  .main-area{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; min-height:0;}

  /* ---------- Body grid (상세 화면: 스테이지 + 정책 패널) ---------- */
  .body{flex:1 1 auto; display:grid; --policy-w:400px; grid-template-columns:1fr 6px var(--policy-w); min-height:0;}
  .body[hidden]{ display:none; }

  /* 우측 정책 패널 리사이즈 핸들 */
  .resize-handle{
    cursor:col-resize; background:transparent; position:relative; z-index:4;
  }
  .resize-handle::after{
    content:""; position:absolute; top:0; bottom:0; left:2px; width:2px; background:var(--border);
  }
  .resize-handle:hover::after, .resize-handle.dragging::after{ background:var(--accent); }
  .resize-handle.dragging{ background:color-mix(in srgb, var(--accent) 8%, transparent); }

  /* ---------- Left menu (항상 노출 — 홈/상세 화면 공통) ---------- */
  .sidebar-menu{
    width:220px; flex:0 0 220px;
    border-right:1px solid var(--border); background:var(--bg-elevated);
    overflow-y:auto; padding:14px 10px;
  }
  .menu-group-header{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    font-size:13.5px; font-weight:800; color:var(--text); padding:9px 8px; margin-top:10px;
    background:none; border:none; cursor:pointer; font-family:inherit; border-radius:6px; text-align:left;
  }
  .menu-group-header:first-child{margin-top:0;}
  .menu-group-header:hover{background:var(--bg-sunken);}
  .menu-group-header .count{color:var(--text-tertiary); font-weight:600; font-size:12px;}
  .menu-group-header .chev{color:var(--text-tertiary); transition:transform .15s; flex:0 0 auto;}
  .menu-group-header.open .chev{transform:rotate(90deg);}
  .menu-group-items{display:none;}
  .menu-group-items.open{display:block;}
  .menu-item{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
    padding:10px 10px; border-radius:8px; border:1px solid transparent; background:none;
    cursor:pointer; margin-bottom:4px; font-family:inherit;
  }
  .menu-item:hover{background:var(--bg-sunken);}
  .menu-item.active{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 35%, transparent);}
  .menu-text .menu-title{font-size:13px; font-weight:600; color:var(--text); margin-bottom:2px;}
  .menu-item.active .menu-text .menu-title{color:var(--accent-text);}
  .menu-text .menu-desc{font-size:11.5px; color:var(--text-secondary); line-height:1.4;}

  /* ---------- Center stage ---------- */
  .stage{display:flex; flex-direction:column; min-width:0; background:var(--bg-sunken);}
  .stage-header{
    flex:0 0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border); background:var(--bg-elevated);
  }
  .stage-header .file-title{font-size:13px; font-weight:700;}
  .stage-header .file-name{font-size:11.5px; color:var(--text-tertiary); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:2px;}
  .stage-header .open-new{
    font-size:12px; color:var(--accent-text); text-decoration:none; padding:6px 10px;
    border:1px solid var(--border); border-radius:7px; background:var(--bg-sunken); white-space:nowrap;
  }
  .stage-header .open-new:hover{border-color:var(--border-strong);}
  .stage-actions{display:flex; align-items:center; gap:8px;}
  .copy-link{display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12px; font-weight:600; color:#fff; background:var(--accent);
    border:1px solid var(--accent); border-radius:7px; padding:6px 10px; cursor:pointer; white-space:nowrap;}
  .copy-link:hover{filter:brightness(1.08);}
  .p-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .p-card-head h3{margin-top:0;}
  .card-link{flex:0 0 auto; display:inline-flex; align-items:center; gap:4px; font:inherit; font-size:12px; color:var(--text-tertiary);
    background:none; border:1px solid var(--border); border-radius:6px; padding:3px 8px; cursor:pointer; white-space:nowrap;}
  .card-link:hover{color:var(--accent-text); border-color:var(--accent);}
  .p-section-card.flash{outline:2px solid var(--accent); outline-offset:2px; transition:outline-color .6s;}
  .copy-toast{position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:#1a1a1a; color:#fff; font-size:13px;
    padding:10px 16px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s; z-index:2000; max-width:calc(100% - 32px);}
  .copy-toast.show{opacity:1;}
  .proto-frame{flex:1 1 auto; width:100%; border:0; background:#fff;}

  /* ---------- Right policy panel ---------- */
  .policy-panel{
    border-left:1px solid var(--border); background:var(--bg-elevated);
    display:flex; flex-direction:column; min-width:0;
  }
  .policy-header{
    flex:0 0 auto; padding:14px 18px 12px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .policy-header h2{font-size:14.5px; margin:0; font-weight:700;}
  .toggle-btn{
    font-size:12.5px; color:var(--text-secondary); background:var(--bg-sunken); border:1px solid var(--border);
    border-radius:7px; padding:6px 10px; cursor:pointer; font-family:inherit;
  }
  .toggle-btn:hover{border-color:var(--border-strong); color:var(--text);}
  .toggle-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .policy-content{flex:1 1 auto; overflow-y:auto; padding:18px 20px 40px;}

  .p-section{margin-bottom:24px;}
  .p-section.primary .p-section-card{border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent);}
  .p-section-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px 17px; box-shadow:var(--shadow);}
  .proto-ref{font-size:12.5px; color:var(--text-tertiary); margin-top:10px;}
  .p-tag{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.03em; color:var(--accent-text); background:var(--accent-soft); padding:3px 8px; border-radius:5px; margin-bottom:9px;}
  .p-tag.secondary{color:var(--text-secondary); background:var(--bg-sunken);}
  .p-section h3{font-size:15.5px; margin:0 0 9px; font-weight:700; letter-spacing:-.01em;}
  .p-section p{margin:0 0 9px; color:var(--text); font-size:14.5px; line-height:1.65;}
  .p-section p:last-child{margin-bottom:0;}
  .p-section ul, .p-section ol{margin:0 0 9px; padding-left:20px; font-size:14.5px; line-height:1.65;}
  .p-section li{margin-bottom:6px;}
  .p-section li:last-child{margin-bottom:0;}
  .mono, code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em; background:var(--code-bg); color:var(--code-text); padding:1px 5px; border-radius:4px;}
  .policy-table{width:100%; border-collapse:collapse; margin:0 0 11px; font-size:13.5px;}
  .policy-table th, .policy-table td{border:1px solid var(--border); padding:7px 9px; text-align:left; vertical-align:top;}
  .policy-table th{background:var(--bg-sunken); font-weight:700; color:var(--text-secondary); font-size:12.5px;}
  .related-toggle{
    width:100%; text-align:left; background:var(--bg-sunken); border:1px solid var(--border); border-radius:8px;
    padding:10px 13px; font-size:13.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;
  }
  .related-toggle:hover{color:var(--text); border-color:var(--border-strong);}
  .related-toggle .chev{transition:transform .15s ease;}
  .related-toggle.open .chev{transform:rotate(90deg);}
  .related-body{display:none;}
  .related-body.open{display:block;}
  .checklist{list-style:none; padding-left:0;}
  .checklist li{padding-left:22px; position:relative;}
  .checklist li::before{content:"☐"; position:absolute; left:0; color:var(--text-tertiary);}
  .checklist li.done{color:var(--text-secondary);}
  .checklist li.done::before{content:"☑"; color:var(--accent);}
  .checklist li.done .strike{text-decoration:line-through; color:var(--text-tertiary);}

  /* ---------- 전체 문서 보기: 좁은 사이드 패널 대신 넓은 오버레이 모달 ---------- */
  .doc-modal-overlay{
    position:fixed; inset:0; background:rgba(16,20,28,.5); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:5vh 20px;
  }
  .doc-modal-overlay[hidden]{ display:none; }
  .doc-modal{
    background:var(--bg-elevated); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.3);
    width:min(920px, 100%); height:100%; max-height:90vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .doc-modal-header{
    flex:0 0 auto; padding:18px 24px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .doc-modal-header h2{font-size:17px; margin:0; font-weight:700;}
  .doc-modal-close{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg-sunken);
    color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .doc-modal-close:hover{border-color:var(--border-strong); color:var(--text);}
  .doc-modal-body{flex:1 1 auto; overflow-y:auto; padding:24px 28px 48px;}
  .doc-modal-body .p-section p, .doc-modal-body .p-section ul, .doc-modal-body .p-section ol{font-size:15.5px;}
  .doc-modal-body .p-section h3{font-size:17px;}

  /* ---------- 홈 화면: 프로토타입을 카테고리별 썸네일 카드로 한눈에 ---------- */
  #homeView{flex:1 1 auto; overflow-y:auto; padding:32px 28px 60px;}
  #homeView[hidden]{ display:none; }
  .home-inner{max-width:1200px; margin:0 auto;}
  .home-intro{margin-bottom:24px;}
  .home-intro h2{font-size:20px; margin:0 0 6px; font-weight:800;}
  .home-intro p{font-size:14px; color:var(--text-secondary); margin:0; line-height:1.6;}
  .home-doc-card{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:32px; cursor:pointer; font:inherit; color:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  .home-doc-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .home-doc-card .icon{font-size:26px; flex:0 0 auto;}
  .home-doc-card .title{font-size:15.5px; font-weight:700; margin-bottom:2px;}
  .home-doc-card .desc{font-size:13px; color:var(--text-secondary);}
  .home-doc-card .arrow{margin-left:auto; font-size:18px; color:var(--text-tertiary); flex:0 0 auto;}

  .gallery-group-label{font-size:23px; font-weight:800; color:var(--text); letter-spacing:-.01em;
    margin:36px 0 16px; padding-bottom:10px; border-bottom:2px solid var(--border);}
  .gallery-group-label:first-child{margin-top:0;}
  .gallery-grid{display:flex; flex-wrap:wrap; gap:16px;}
  .gallery-card{width:280px; border:1px solid var(--border); border-radius:10px; overflow:hidden;
    background:var(--bg-elevated); cursor:pointer; text-align:left; transition:border-color .15s, box-shadow .15s;
    padding:0; margin:0; font:inherit; display:block;}
  .gallery-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .gallery-thumb{width:280px; height:175px; overflow:hidden; position:relative; background:#fff; pointer-events:none;
    border-bottom:1px solid var(--border);}
  .gallery-thumb iframe{width:1280px; height:800px; border:0; transform:scale(0.21875); transform-origin:top left;}
  .gallery-thumb-placeholder{width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--text-tertiary); font-size:13px;}
  .gallery-card-body{padding:12px 14px;}
  .gallery-card-title{font-size:14.5px; font-weight:700; color:var(--text); margin-bottom:4px;}
  .gallery-card-desc{font-size:12.5px; color:var(--text-secondary); line-height:1.5;}

  /* ---------- 상세 화면 상단 홈 버튼 ---------- */
  .home-back{
    font-size:12.5px; color:var(--text-secondary); text-decoration:none; padding:7px 12px;
    border:1px solid var(--border); border-radius:8px; background:var(--bg-sunken);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:inherit;
    cursor:pointer; flex:0 0 auto;
  }
  .home-back:hover{border-color:var(--border-strong); color:var(--text);}

  /* ---------- Responsive: stack on narrow viewports ---------- */
  @media (max-width: 980px){
    .shell{flex-direction:column;}
    .sidebar-menu{
      width:auto; flex:0 0 auto; max-height:180px;
      border-right:0; border-bottom:1px solid var(--border); display:flex; overflow-x:auto; overflow-y:hidden; padding:10px;
    }
    .sidebar-menu .menu-group-header{display:none;}
    .sidebar-menu .menu-group-items{display:flex !important;}
    .menu-item{flex:0 0 auto; width:220px; margin-bottom:0; margin-right:8px;}
    .body{grid-template-columns:1fr; grid-template-rows:auto minmax(300px,55vh) auto; overflow-y:auto;}
    .policy-panel{border-left:0; border-top:1px solid var(--border);}
    .resize-handle{display:none;}
    .doc-modal-overlay{padding:0;}
    .doc-modal{width:100%; height:100%; max-height:100%; border-radius:0;}
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="dot"></span>
      <h1>이로움케어 반응형 정책</h1>
      <span class="sub">프로토타입 허브</span>
    </div>
    <div class="top-actions">
      <div class="search-wrap">
        <label class="search-box"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input type="search" id="siteSearch" placeholder="정책·화면 검색 (예: 4-4, 펼침, 340)" autocomplete="off" aria-label="정책·화면 검색" aria-controls="searchResults"><kbd id="searchKbd">⌘K</kbd></label>
        <div class="search-results" id="searchResults" role="listbox" hidden></div>
      </div>
      <button class="doc-link" id="toggleGallery" style="cursor:pointer;">🏠 홈</button>
      <a class="doc-link" href="CLAUDE.md" target="_blank" rel="noopener">📄 CLAUDE.md 원문</a>
    </div>
  </header>

  <div class="shell">
    <nav class="sidebar-menu" id="menu"></nav>
    <div class="main-area">
      <div id="homeView">
        <div class="home-inner">
          <div class="home-intro">
            <h2>이로움케어 반응형 정책 — 프로토타입 허브</h2>
            <p>좌측 카테고리별로 정리된 프로토타입을 클릭하면 실제 화면과 관련 정책 조항을 함께 볼 수 있습니다.</p>
          </div>
          <button class="home-doc-card" id="homeDocCard">
            <span class="icon">📄</span>
            <span>
              <div class="title">전체 정책 문서 보기</div>
              <div class="desc">CLAUDE.md 전체를 처음부터 끝까지 — 브레이크포인트 원칙부터 9번 운영관리 화면군까지</div>
            </span>
            <span class="arrow">›</span>
          </button>
          <div id="homeGrid"></div>
        </div>
      </div>

      <div class="body" id="bodyGrid" hidden>
        <main class="stage">
      <div class="stage-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <button class="home-back" id="homeBackBtn">← 홈으로</button>
          <div>
            <div class="file-title" id="stageTitle">-</div>
            <div class="file-name" id="stageFile">-</div>
          </div>
        </div>
        <div class="stage-actions">

var SECTIONS = {
  s1: { title:"1. 브레이크포인트 (모든 컴포넌트가 이 값을 인용)", html:
    '<table class="policy-table"><thead><tr><th>값</th><th>역할</th></tr></thead><tbody><tr><td><strong>1024px</strong></td><td>PC ↔ 모바일 전환(유일한 1차 분기). <strong>1024px 이하 = 모바일, 1025px 이상 = PC</strong></td></tr><tr><td><strong>360px</strong></td><td>모바일 최소 지원폭. 콘텐츠 분기에는 쓰지 않음(모달도 360 분기 없음, 3-3)</td></tr><tr><td><strong>1199px / 1439px</strong></td><td>PC 안에서 <strong>앱별 사이드바를 숨기는 2차 기준</strong> — 사업소 1199px 이하, 대대여 1439px 이하</td></tr></tbody></table><ul><li><strong>CSS</strong>: 모바일 <span class="mono">max-width:1024px</span>, PC <span class="mono">min-width:1024.02px</span>. <span class="mono">1024/1025</span>로 쓰면 확대·축소로 폭이 1024.5px 같은 소수가 될 때 어느 쪽에도 속하지 않는 틈이 생기므로 소수로 맞물린다</li><li>정확히 1024px(아이패드 가로 포함)은 <strong>모바일</strong>이다</li><li><strong>폭 기준이지 입력장치 기준이 아니다.</strong> 터치 노트북·가로 태블릿도 폭이 1025 이상이면 PC 레이아웃. 대신 hover에만 의존하는 동작은 만들지 않고 클릭으로도 100% 동작하게 한다</li><li>이 외의 값(480·640·768 등)은 브레이크포인트로 쓰지 않는다. 768 같은 태블릿 프레임은 모바일 레이아웃이 넓은 폭에서 어떻게 보이는지 보여주는 예시일 뿐이다</li></ul><p><strong>PC 콘텐츠 폭(앱별 고정값 — 브레이크포인트 아님)</strong></p><table class="policy-table"><thead><tr><th>앱</th><th>콘텐츠 폭</th><th>비고</th></tr></thead><tbody><tr><td>이로움케어(소비자·사업소)</td><td><strong>1060px</strong> 고정, 전 화면 공통</td><td>1920 캔버스 → Content Wrapper 1400(좌측 aside 302 포함) → contents 1060</td></tr><tr><td>대대여(입출고 창고·설치파트너)</td><td>컨테이너 1200 − 패딩 32×2 = <strong>1136px</strong></td><td>9-1</td></tr></tbody></table><p>정해 두지 않으면 초광폭 모니터에서 무한정 늘어나므로 반드시 상한을 둔다.</p><p><strong>앱별 PC 셸 축소 구간</strong> — PC(1025px 이상) 안에서 사이드바를 숨기는 기준은 앱마다 다르다. 모바일 전환(1024px 이하)은 두 앱 같다.</p><table class="policy-table"><thead><tr><th>앱</th><th>사이드바 표시</th><th>사이드바 숨김</th><th>모바일</th></tr></thead><tbody><tr><td>이로움케어 사업소</td><td>1200px 이상</td><td><strong>1199px 이하</strong> 왼쪽 SNB 숨김</td><td>1024px 이하</td></tr><tr><td>대대여(입출고 창고·설치파트너)</td><td>1440px 이상</td><td><strong>1439px 이하</strong> SideNav 숨김</td><td>1024px 이하</td></tr></tbody></table><ul><li><strong>사업소 1025~1199px</strong>: SNB 숨김(<span class="mono">.snb{display:none}</span>), 콘텐츠 1060px</li><li><strong>대대여 1025~1439px</strong>: SideNav는 화면 밖으로 숨고 <strong>햄버거로 콘텐츠 위에 겹쳐 열린다(오버레이)</strong>. 콘텐츠와 GNB는 <strong>최소 폭 1440px 유지 + 가로 스크롤</strong>(1440 = SideNav 240 + 콘텐츠 영역 1200)</li><li><strong>대대여 1440px 이상</strong>: SideNav 항상 표시, GNB 햄버거로 접고 펼침(9-1)</li><li>근거: DS "모바일 정의" 해상도 주석("모바일 기준: 1024px 이하"), 퍼블 CSS <span class="mono">max-width:1199px</span>·<span class="mono">max-width:1439px</span>. DS 주석 "1024~1023 축소 및 스크롤"은 1024~1439의 오기로 봄</li></ul><p class="proto-ref">→ <span class="mono">breakpoint-map.html</span></p>' },
  s2: { title:"2. 레이아웃 전략 — 반응형 vs 적응형", html:
    '<table class="policy-table"><thead><tr><th>구분</th><th>정의</th><th>적용</th></tr></thead><tbody><tr><td><strong>반응형</strong></td><td>같은 DOM을 CSS로 재배치. 화면 하나로 전 구간 대응</td><td>상세 화면(3-11), 모달(3-3), 카드 목록형(3-10), 월간 캘린더(9-7)</td></tr><tr><td><strong>적응형</strong></td><td>PC와 모바일 구조가 다름(테이블 vs 카드). <strong>두 구조를 한 페이지에 모두 두고</strong> 1024/1025px에서 표시만 전환</td><td>테이블 리스트(3-9)와 그 검색 영역(3-7)</td></tr></tbody></table><ul><li>판단 기준: 정보 밀도나 조작 방식이 PC·모바일에서 본질적으로 다르면 적응형, 같은 정보를 배치만 바꿔 보여줄 수 있으면 반응형</li><li><strong>어느 쪽이든 한 페이지(한 URL)다.</strong> 모바일을 별도 페이지·별도 앱으로 만들지 않는다 — PC(PHP) 페이지 안에 모바일 구조를 함께 넣고 1024px 이하에서 전환한다. 테이블을 CSS만으로 카드처럼 바꾸는 방식도 쓰지 않는다(적응형은 두 구조를 따로 둔다)</li><li>전환 대상: 대대여 모바일(현재 별도 React 앱)과 현재 퍼블의 별도 모바일 페이지(<span class="mono">*_mobile.html</span>)는 이 방식으로 합친다 — PC·모바일 이중 관리를 없애는 것이 이 정책의 목적</li></ul>' },
  s31: { title:"3-1. 텍스트형 (읽기전용 정보 테이블)", html:
    '<p>주문 정보, 회수 신청 정보처럼 라벨-값을 나열하는 표.</p><ul><li>라벨 셀: <span class="mono">max-width:128px; min-width:80px</span>, 배경 <span class="mono">#f5f5f5</span></li><li>값 셀: <span class="mono">min-width:160px</span></li><li><strong>flex-shrink만 쓰고 wrap은 쓰지 않는다.</strong> 라벨은 128→80, 값은 자기 min-width까지 줄어든다. 240px(80+160)까지 좌우 2열이 유지되므로 세로 스택으로 바꾸는 분기는 필요 없다</li><li>배경 없는 버전(조회형): 라벨 125px, 배경 없음</li></ul><p class="proto-ref">→ <span class="mono">order-detail-mobile.html</span>, <span class="mono">rental-return-detail-prototype.html</span></p>' },
  s32: { title:"3-2. 입력필드형 (입력 가능한 폼 필드)", html:
    '<p>배송정보 수정, 회수지 주소 수정 같은 입력 폼.</p><ul><li>라벨: <strong>125px 고정</strong>, <span class="mono">flex-shrink:0</span></li><li>콘텐츠: <span class="mono">flex:1 0 0</span>, 최소폭은 모드에 따라 다름<ul><li>수정 모드 <span class="mono">min-width:280px</span> → 줄바꿈 지점 = 125 + gap 4 + 280 = <strong>409px</strong></li><li>조회 모드 <span class="mono">min-width:180px</span> → 줄바꿈 지점 = 125 + gap 8 + 180 = <strong>313px</strong></li></ul></li><li>줄바꿈 지점은 브레이크포인트가 아니라 <strong>공식의 결과</strong>다. 라벨 폭이나 최소폭이 바뀌면 같이 바뀌므로 숫자가 아니라 공식을 기준으로 삼는다</li><li>flex-wrap 컨테이너라 미디어쿼리 없이 동작</li><li>PC(1025px 이상)에서 입력 콘텐츠 영역은 <span class="mono">max-width:480px</span>에서 멈춘다</li><li><strong>입력칸 상태</strong>(DS <span class="mono">Textfield</span>): 높이 PC 40 / 모바일 48, radius 4<table class="policy-table"><thead><tr><th>상태</th><th>테두리</th><th>배경</th></tr></thead><tbody><tr><td>기본(값 없음)</td><td>1px PC <span class="mono">#616161</span> / 모바일 <span class="mono">#bdbdbd</span></td><td>흰색</td></tr><tr><td>값 입력됨</td><td>1px <span class="mono">#333</span></td><td>흰색</td></tr><tr><td>포커스</td><td><strong>2px <span class="mono">#323da3</span></strong></td><td>흰색</td></tr><tr><td>에러</td><td>2px <span class="mono">#e53935</span></td><td>흰색</td></tr><tr><td>비활성·읽기전용</td><td>1px <span class="mono">#bdbdbd</span></td><td><span class="mono">#eee</span></td></tr></tbody></table></li></ul><p>버튼으로만 채우는 칸(우편번호·기본주소 등)은 <strong>읽기전용</strong> 스타일</p><ul><li><strong>지우기(X) 버튼</strong>: 텍스트 입력칸은 <strong>값이 없으면 X 없음, 값이 있으면 X 노출</strong>. 읽기전용·비활성 칸, 날짜·셀렉트 칸(오른쪽에 달력·화살표 아이콘이 있는 칸)에는 X 없음. X를 누르면 값만 지우고 포커스는 그 칸에 유지(모바일 키보드 유지). 아이콘 24, 모바일 터치 영역 40×40 이상. 입력 글자가 X 밑으로 들어가지 않게 오른쪽 패딩을 X 폭만큼 확보. 입력칸 오른쪽에 돋보기 등 다른 아이콘이 있을 때도 같은 원칙</li><li>근거: Figma <span class="mono">배송조회_입력폼</span> 409px(<span class="mono">6591:177940</span>), <span class="mono">배송조회</span> 313px(<span class="mono">6591:173787</span>), 340px 줄바꿈 상태(<span class="mono">6591:160253</span>) / DS <span class="mono">Textfield</span> 컴포넌트(X 옵션은 아직 없음 — 컴포넌트에 추가 필요)</li></ul><p class="proto-ref">→ <span class="mono">form-breakpoint-demo.html</span></p>' },
  s33: { title:"3-3. 모달", html:
    '<p><strong>유형은 "테이블(행/열 데이터) 포함 여부"로 판단한다</strong> — 요소 개수가 아님.</p><table class="policy-table"><thead><tr><th>유형</th><th>크기</th><th>모바일(1024px 이하) 형태</th><th>예시</th></tr></thead><tbody><tr><td>텍스트형(안내·확인)</td><td><strong>480</strong></td><td>모달</td><td>주문 불가 안내, 주문하기 확인, 회수요청 취소 확인</td></tr><tr><td>정보확인·입력·검색형</td><td><strong>480</strong></td><td><strong>사유 작성·주소 입력은 바텀시트</strong>(길면 전체 화면). 선택만 하는 팝업·검색-리스트형은 모달(아래 기준)</td><td>회수 요청하기(모달), 회수접수 취소·회수지 주소 수정(바텀시트), 상품 변경(검색-리스트, 모달)</td></tr><tr><td>테이블 포함형</td><td><strong>600 / 800</strong></td><td>모달(테이블은 가로 스크롤)</td><td>입고처리 모달(600), 계약서·소독필증 모달(800)</td></tr></tbody></table><ul><li><strong>모달 폭 규칙은 한 줄이다</strong>: 모든 모달 <span class="mono">width:min(모달 크기, 100% - 40px)</span>. 화면이 넉넉하면 원래 크기(480·600·800), <strong>화면이 모달보다 좁아지면 좌우 마진 20을 남기고 꽉 찬다(Full)</strong>. 모달 크기를 바꾸는 미디어쿼리는 두지 않는다<table class="policy-table"><thead><tr><th>화면 폭</th><th>480 모달</th><th>600 모달</th><th>800 모달</th></tr></thead><tbody><tr><td>1025 이상(PC)</td><td>480</td><td>600</td><td>800</td></tr><tr><td>768(태블릿)</td><td>480</td><td>600</td><td>728</td></tr><tr><td>390</td><td>350</td><td>350</td><td>350</td></tr><tr><td>360</td><td>320</td><td>320</td><td>320</td></tr></tbody></table></li><li>340이라는 별도 크기는 없다. Figma의 340 모달 프레임은 480 모달이 폰 폭에서 줄어든 모습(좌우 마진은 20 적용)으로 본다</li><li><strong>바텀시트 vs 모달 — 사유 작성·주소 입력은 바텀시트</strong><ul><li>모바일 기본은 바텀시트. 상세 화면 등에서는 상황에 따라 모달 허용</li><li>기준은 <strong>키보드</strong>: <strong>사유 작성·주소 입력처럼 글자를 직접 입력하는 폼은 바텀시트</strong>(키보드가 올라오면 모달 안의 입력칸·버튼이 가려진다). 선택만 하는 팝업(셀렉트·체크박스·버튼 선택)과 <strong>검색-리스트형</strong>(검색어로 목록을 골라 선택, 예: 상품 변경)은 모달</li><li>예: 회수 요청하기·상품 변경 = 모달 / 회수지 주소 수정·회수접수 취소 = 바텀시트</li><li>바텀시트 안 입력 폼은 모바일 크기(입력 48, 버튼 54)</li><li>바텀시트 안의 셀렉트를 누르면 <strong>옵션 시트</strong>(선택 행 틴트 + 체크, 하단 "선택완료")가 원래 시트 <strong>대신</strong> 열리고, 선택완료·닫기 시 원래 시트로 돌아간다(3-7 날짜 선택 시트와 같은 흐름)</li></ul></li><li><strong>버튼 폭</strong><ul><li><strong>PC</strong>: 모든 모달 버튼 <strong>150px 고정</strong>, gap 12px, 가운데 정렬(2개면 150+12+150=312px). <strong>버튼 1개도 150 고정</strong></li><li><strong>모바일</strong>: <strong>Full</strong> — 버튼들이 모달 폭을 나눠 가진다</li></ul></li><li>모달은 딤 배경 위 <strong>정중앙</strong>. 내용이 넘치면 모달에 <span class="mono">max-height</span>를 주고 내부 스크롤</li><li>오버레이(모달·드롭다운·달력·바텀시트)는 <strong>하나만</strong> — 새로 열리면 기존 것이 닫힌다</li><li>근거: 테이블형 lg-600 <span class="mono">모달-입고처리_디폴트</span>(600×908)·<span class="mono">모달_정상여부 확인</span>, xl-800 <span class="mono">PC_대대여 계약서 모달_디폴트</span>·<span class="mono">Modal_xl_800_소독필증 발급</span>(9번) / 회수접수 취소 바텀시트 <span class="mono">7317:76226</span></li></ul><p class="proto-ref">→ <span class="mono">modal-types-gallery.html</span></p>' },
  s34: { title:"3-4. 액션 버튼 배치", html:
    '<ul><li><strong>PC</strong>: 페이지 타이틀 오른쪽, <strong>Hug 사이즈</strong>(<span class="mono">flex:0 0 auto</span>) — 전체폭 분할 금지</li><li><strong>모바일</strong>: 화면 하단 <strong>고정(sticky)</strong> + 흰색 그라데이션 페이드, 버튼은 폭을 나눠 가짐(Full), 높이 <strong>LG 54</strong></li><li><strong>모바일 하단 고정 버튼 영역 여백</strong>: 위 32 / 좌우 20 / <strong>아래 20 + safe-area</strong><ul><li><span class="mono">padding:32px 20px calc(20px + env(safe-area-inset-bottom))</span></li><li>viewport 메타에 <span class="mono">viewport-fit=cover</span> 필수(없으면 <span class="mono">env()</span> 값이 0)</li><li>아래 20이 필요한 이유: 안드로이드·인앱 브라우저는 safe-area가 0이라 버튼이 브라우저 하단 툴바에 붙는다</li><li>바텀시트·검색 시트 하단 버튼은 <strong>위·아래 32</strong> 그대로. 페이지 하단 버튼만 20인 이유는 스크롤 중인 본문을 계속 가리기 때문(32면 본문 가림 118px, 홈 표시줄 기기 152px)</li></ul></li><li><strong>모바일 본문 맨 아래 일반 버튼</strong>(주문목록·회수목록 등, 고정 아님): 영역 여백 <strong>위 48 / 아래 20</strong></li><li>근거: Figma 주문요청관리 대여 상세 신규배정 모바일 <span class="mono">6534:185304</span>(<span class="mono">buttonArea</span> 32/20/20/20), 주문완료 <span class="mono">6523:27942</span></li></ul><p class="proto-ref">→ <span class="mono">order-detail-mobile.html</span>, <span class="mono">action-button-placement-demo.html</span></p>' },
  s35: { title:"3-5. 팝오버 / 바텀시트", html:
    '<ul><li><strong>PC</strong>: 트리거에 붙는 팝오버 — 호버 200ms 뒤 열림, 벗어나고 300ms 뒤 닫힘(실수 호버 방지). 다른 트리거에 호버하면 기존 팝오버를 즉시 닫고 새로 연다. 클릭으로도 100% 동작해야 한다</li><li><strong>모바일</strong>: 탭하면 바텀시트로 연다. 툴팁도 탭 → 바텀시트</li><li>달력·셀렉트 드롭다운: 모바일은 트리거와 같은 좌우 폭(<span class="mono">left:0;right:0</span>), PC만 고정폭(예: 달력 320px)</li><li><strong>바텀시트 공통 스펙</strong><ul><li>상단 모서리 반경 <strong>40px</strong>, 드래그 핸들 없음(타이틀 + X 닫기로 시작)</li><li>타이틀 위 여백 <strong>32px</strong> = 바깥 래퍼 12 + 안쪽 콘텐츠 래퍼 20 — 이중 래퍼 구조를 그대로 구현</li><li>높이는 고정 px 없이 화면 비율로 최대 높이를 두고, 넘치면 <strong>콘텐츠 영역만 스크롤</strong>(타이틀·하단 버튼 고정)</li><li>하단 버튼 영역 위·아래 32</li></ul></li><li>근거: DS "바텀시트 스크롤 정의"(<span class="mono">8990:16490</span>)의 232/442px·"380" 메모는 쓰지 않음 / DS "모바일 툴팁" 주석</li></ul><p class="proto-ref">→ <span class="mono">order-detail-mobile.html</span>, <span class="mono">order-list-adaptive.html</span>, <span class="mono">rental-return-list.html</span>, <span class="mono">popover-bottomsheet-compare-demo.html</span></p>' },
  s36: { title:"3-6. 페이지네이션 (PC 전용)", html:
    '<ul><li>3분할(<span class="mono">justify-content:space-between</span>): <strong>왼쪽</strong> "전체 N/M" · <strong>가운데</strong> 이전/다음 + 페이지 번호 · <strong>오른쪽</strong> "N개씩" 선택</li><li>페이지 번호: <strong>32×32, radius 4</strong> (원형·알약 아님)</li><li>활성 페이지: 연한 틴트 <span class="mono">#eff1fd</span> + 진한 글자 <span class="mono">#141e76</span> SemiBold (브랜드색으로 채우지 않음)</li><li>이전/다음: 테두리 없는 아이콘 버튼(아이콘 24, 히트 영역 32×32), 비활성은 투명도로만 표시</li><li><strong>모바일</strong>: 적응형 목록(3-9)은 페이지네이션 없이 스크롤로 이어서 불러온다. 반응형 카드 목록(3-10)은 화면 성격에 따라 있음·없음 둘 다 가능</li><li>근거: Figma <span class="mono">Pagination</span> 컴포넌트</li></ul><p class="proto-ref">→ <span class="mono">order-list-adaptive.html</span>, <span class="mono">rental-return-list.html</span>, <span class="mono">pagination-compare-demo.html</span></p>' },
  s37: { title:"3-7. 검색 영역 (리스트 화면 전용 — 적응형)", html:
    '<p>PC 검색 패널과 모바일 필터칩 + 바텀시트를 <strong>둘 다 두고 1024/1025px에서 표시만 전환</strong>한다(2번 적응형). 사업소처럼 <strong>PC 페이지 안에 모바일 구조를 함께 넣고</strong> 1024px 이하에서 전환하는 방식이며, 모바일을 별도 페이지로 만들지 않는다.</p><p><strong>PC — 검색 패널</strong></p><ul><li>패널: bg <span class="mono">#fafafa</span>, 테두리 1px <span class="mono">#bdbdbd</span>, radius 4, 패딩 16</li><li>행: 높이 44(패딩 12/0), 아래 구분선 1px <span class="mono">#eee</span>. 2열 배치(각 50%), 옵션이 많으면 한 행 전체폭</li><li>라벨: <strong>120px 고정</strong>, 14px SemiBold <span class="mono">#1a1a1a</span> (3-2 입력필드 라벨 125px와 다른 값)</li><li><strong>날짜 행</strong>(첫 행, 높이 64): 라벨 + [날짜 기준 셀렉트 160] + [시작일 160 <span class="mono">~</span> 종료일 160, 달력 아이콘 24, <span class="mono">yyyy-mm-dd</span>] + [기간 세그먼트], 요소 간격 12. 입력류 테두리 <span class="mono">#333</span>, 패딩 8/12<ul><li><strong>세그먼트</strong>: 테두리 <span class="mono">#616161</span>, 패딩 4, radius 4, 칸 68×32. 선택 칸 bg <span class="mono">#e0e0e0</span> + SemiBold <span class="mono">#1a1a1a</span>(양옆 구분선 숨김), 미선택 Regular <span class="mono">#616161</span> + 칸 사이 1×12 구분선 <span class="mono">#eee</span></li><li><strong>구성은 화면마다 다르다</strong>(통일하지 않음, 화면별 Figma를 따름)<table class="policy-table"><thead><tr><th>화면</th><th>기간 버튼</th></tr></thead><tbody><tr><td>입출고 창고</td><td>오늘 / 어제 / 일주일 / 지난달 / 3개월</td></tr><tr><td>주문요청관리(4-2)</td><td>3개월 / 일주일 / 이번달 / 지난달 / 1년</td></tr><tr><td>회수 관리(4-4)·반품/AS</td><td>일주일 / 1개월 / 3개월 / 6개월 / 1년</td></tr></tbody></table></li><li><strong>기본값이 있는 화면은 처음부터 선택된 상태</strong>로 보이고 날짜 칸도 그 기간으로 채운다</li><li>세그먼트를 누르면 날짜 자동 입력, 날짜를 직접 고치거나 달력에서 고르면 세그먼트 선택 해제</li></ul></li><li><strong>체크박스 옵션</strong>(복수 선택): 기본은 "전체"만 체크. 다른 항목을 누르면 "전체" 해제, "전체"를 누르면 그 행 전체 체크(다시 누르면 전체 해제), 개별 항목이 모두 체크되면 "전체"도 자동 체크. 항목 간격 16, 체크박스 20×20 radius 4(미선택 테두리 <span class="mono">#616161</span>, 선택 <span class="mono">#323da3</span> 채움 + 흰 체크 16), 체크박스–글자 8, 14px</li><li><strong>셀렉트·달력은 DS 컴포넌트</strong>(네이티브 <span class="mono">&lt;select&gt;</span>·<span class="mono">&lt;input type=date&gt;</span> 금지, 6-2)<ul><li>셀렉트(SelectField 160×40, 테두리 <span class="mono">#333</span>): 열리면 <strong>2px <span class="mono">#323da3</span></strong> + 화살표 180° 회전. 옵션 패널 = 아래 8px, 테두리 <span class="mono">#616161</span>, radius 4, 패딩 8, 최대 높이 210 스크롤, 항목 패딩 9/8·간격 4, 호버·선택 bg <span class="mono">#eff1fd</span>, 선택 항목 <span class="mono">#323da3</span> Bold + 오른쪽 체크 24</li><li>달력(DS <span class="mono">calendar_Default</span>): 날짜 칸 아래 팝오버. 헤더 이전/다음 40×40 + "M월" 18px Heavy, 요일 줄 bg <span class="mono">#f5f5f5</span> 12px Medium, 날짜 칸 높이 40·원 32, 14px SemiBold <span class="mono">#555</span>, 이전/다음 달 <span class="mono">#bdbdbd</span>, 호버 <span class="mono">#f2fde4</span>, 오늘·선택 <span class="mono">#90ee02</span></li></ul></li><li><strong>검색어 행</strong>(높이 64): 셀렉트 160×40 + 입력 264×40(테두리 <span class="mono">#616161</span>), 간격 8, 좌우 패딩 12, placeholder <span class="mono">#bdbdbd</span>. 셀렉트 옵션은 <strong>그 화면 테이블의 식별 컬럼 이름</strong>을 쓴다(예: 회수 관리 = 수급자 / 요양인정번호 / 연락처 / 돌봄 회수 신청번호 / 원 주문번호, 입출고 창고 = 전체 / 바코드 / 상품명 / 사업소명)</li><li>하단 버튼: 가운데 정렬, 위 패딩 16, 간격 10 — 초기화(외곽선) + 검색(채움) <strong>각 130×36</strong>, 14px SemiBold</li><li><strong>접기 버튼</strong>(오른쪽 위): bg <span class="mono">#eee</span>, 높이 36, 패딩 8/16, radius 4, 14px SemiBold <span class="mono">#555</span> + 채움 삼각형 16<ul><li>펼친 상태 "접기 ▲", 접힌 상태 "상세 ▼"</li><li>접으면 첫 행(날짜)과 검색·초기화 버튼만 남는다</li><li><strong>기본은 펼침</strong>(입고처리·주문요청관리·회수 관리 등). 예외: 수급자 목록(3-10)의 상세 조건 패널은 접힘</li></ul></li></ul><p><strong>모바일 — 필터칩 + 적용 태그 + 바텀시트</strong></p><ul><li>① <strong>필터칩 줄</strong>(높이 56): bg <span class="mono">#fafafa</span>, 아래 구분선 <span class="mono">#eee</span>, 패딩 12/0/12/20, 칩 간격 6, 가로 스크롤<ul><li>칩: 높이 <strong>32</strong>, radius 999, 패딩 4/12/4/16, 14px + chevron-down 20</li><li><strong>표기: 기본값("전체")일 때 "이름 : 값"</strong>(예: "상태 : 전체"), <strong>값을 고르면 값만</strong>(예: "반품접수 확인")</li><li>기본값 칩: 흰 배경 + 테두리 <span class="mono">#e0e0e0</span> + Regular / 값 선택 칩: bg <span class="mono">#f5f5f5</span> + 테두리 <span class="mono">#999</span> + SemiBold</li><li>오른쪽 끝에 <strong>"검색" 칩 고정</strong>(필터 아이콘 24 + 글자), 그 앞 28px 페이드</li></ul></li><li>② <strong>적용 태그 줄</strong>(높이 48, 적용된 조건이 있을 때만): 태그 = bg <span class="mono">#eff1fd</span> 알약(radius 999, 높이 32, 14px SemiBold <span class="mono">#141e76</span>, 패딩 4/4/4/8) + X 20, 간격 4, 가로 스크롤. X로 개별 해제. 오른쪽 끝 "초기화"(reset 아이콘 24 + 14px) 고정</li><li>③ <strong>건수</strong>(높이 56): 16px Regular <span class="mono">#616161</span>, 왼쪽 패딩 20. 오른쪽에 정렬 셀렉트를 둘 수 있음</li><li>칩 탭 → <strong>단일 선택 시트</strong>: 3-5 바텀시트 + 타이틀 20px Bold + 닫기 32. 옵션 행 패딩 10/8/10/12, 간격 6, radius 4, 16px. <strong>현재 값(기본 "전체")이 처음부터 선택 표시</strong> — 선택 행만 틴트 <span class="mono">#eff1fd</span> + 글자 <span class="mono">#141e76</span> + 체크. 하단 "선택완료"(풀폭, 높이 54, 18px SemiBold)</li><li>"검색" 칩 탭 → <strong>검색 시트</strong><ul><li>섹션(타이틀 18px SemiBold, 섹션 간격 24, 타이틀–옵션 12)마다 <strong>버튼 그리드</strong>: 옵션 4개면 2열, 3개면 3열, 간격 8. 버튼 패딩 12/16, radius 4, 미선택 테두리 <span class="mono">#bdbdbd</span> + 16px Regular <span class="mono">#616161</span>, 선택 테두리 <span class="mono">#333</span> + SemiBold <span class="mono">#333</span></li><li><strong>날짜 섹션</strong>: 기간 버튼 + 시작일 <span class="mono">~</span> 종료일(테두리 <span class="mono">#bdbdbd</span>, 패딩 12, 16px, 달력 아이콘). <strong>"직접선택"일 때만 날짜 칸 활성</strong>(그 외엔 글자 <span class="mono">#bdbdbd</span>), 기본 기간이 있으면 처음부터 선택 상태. 날짜 칸을 누르면 <strong>달력 바텀시트</strong>("yyyy-MM" 헤더, 하단 "선택완료")가 검색 시트 <strong>대신</strong> 열리고, 선택완료·닫기 시 검색 시트로 돌아온다. 기간 버튼 구성은 DS 모바일 정의(일주일 / 이번달 / 3개월 / 직접선택) 또는 화면별 Figma를 따른다</li><li>마지막에 "상세검색" 입력(테두리 <span class="mono">#bdbdbd</span>, 패딩 12). 안내 문구에는 그 화면의 검색 대상을 쓴다(예: "수급자명, 회수번호, 요양인정번호 검색")</li><li>하단 고정 버튼(위·아래 32, 흰 그라데이션): 초기화 <strong>120px</strong>(bg <span class="mono">#eee</span> / 글자 <span class="mono">#555</span>) + 검색(나머지 폭, 브랜드색), 높이 54</li><li>콘텐츠만 스크롤, 타이틀·하단 버튼 고정(3-5)</li></ul></li><li><strong>모바일 필터는 모두 단일 선택</strong>(PC 체크박스 복수 선택과 다름). 시트 그림자 <span class="mono">0 8px 24px rgba(0,0,0,.2), 0 0 4px rgba(0,0,0,.12)</span>, 오버레이는 하나만</li><li>화면별 옵션 값(참고): 입고처리 회수 상태 = 회수요청 / 회수준비중 / 회수완료 / 입고완료. 입고처리 Figma는 상품유형·입고경로 옵션명이 PC·모바일에서 다르게 그려져 있어 확인 필요(7번)</li><li>근거: Figma 입출고 창고 <span class="mono">입고처리</span>·<span class="mono">입고대기</span>·<span class="mono">입고대기_검색</span>·<span class="mono">입고대기_상품유형</span>, 날짜 행 <span class="mono">9865:63366</span> / DS 모바일 검색 필터 <span class="mono">8608:13146</span>, 달력 시트 <span class="mono">8607:12083</span>, <span class="mono">calendar_Default</span> <span class="mono">6240:8714</span></li></ul><p class="proto-ref">→ <span class="mono">search-filter-compare-demo.html</span></p>' },
  s41: { title:"4-1. 대여 회수 상세보기", html:
    '<p><strong>상태별 표시</strong></p><table class="policy-table"><thead><tr><th>상태</th><th>상단 버튼(PC 오른쪽 위 / 모바일 하단 고정)</th><th>회수번호</th><th>신청자 정보</th></tr></thead><tbody><tr><td>회수접수</td><td>회수 접수 확인</td><td><span class="mono">-</span></td><td>이름 마스킹, 요양인정번호·연락처·회수지주소 <span class="mono">-</span></td></tr><tr><td>회수확인중</td><td>회수접수 취소 + <strong>이로움에 회수 요청</strong></td><td><span class="mono">-</span></td><td>전체 노출, 회수지 수정 가능</td></tr><tr><td>회수요청</td><td><strong>회수요청 취소</strong></td><td>번호 노출</td><td>전체 노출, 회수지 수정 가능</td></tr><tr><td>회수준비중 · 회수완료</td><td>없음</td><td>번호 노출</td><td>전체 노출</td></tr><tr><td>회수취소</td><td>없음</td><td><span class="mono">-</span> (회수요청 전 취소라 미발급)</td><td>전체 노출</td></tr><tr><td>회수취소완료</td><td>없음</td><td>번호 노출</td><td>전체 노출</td></tr></tbody></table><ul><li><strong>회수번호는 회수요청 시점에 발급</strong>된다. 목록(4-4)의 "돌봄 회수 신청번호"(<span class="mono">COL…</span>, 모든 상태 노출)와 다른 번호</li><li>버튼이 없는 상태에서는 비활성 버튼이나 툴팁도 노출하지 않는다</li><li>회수요청 취소는 <strong>사유를 받지 않는다</strong>(접수 취소와 다름)</li><li>회수취소 상태는 상품 정보 영역(상품명 아래)에 "회수접수 취소 사유 : …"를 배경 없는 한 줄로 표시</li><li>본문 맨 아래 "회수목록" 버튼(3-4, 3-11)</li></ul><p><strong>정보 영역</strong></p><ul><li>회수 신청 정보: 회수 신청일시 / 돌봄 회수 신청번호 / 이로움 원 주문번호(링크) / 회수번호</li><li>신청자 정보: 수급자 이름 / 요양인정번호 / 보호자 이름 / 상담받을 연락처 / 회수지주소. PC는 2쌍/행(3-11), 회수지주소는 한 줄 전체</li><li><strong>회수지주소</strong>: PC는 주소 오른쪽 같은 줄 끝에 <strong>"회수지 수정"</strong> 버튼(회색 채움, bg <span class="mono">#eee</span> / 글자 <span class="mono">#555</span>), 모바일은 주소 아래에 버튼</li><li>모바일에서는 회수 신청 정보·신청자 정보를 접고 펼칠 수 있다(PC는 항상 펼침)</li><li>회수사유: 읽기 전용 박스, 모바일은 박스 안에서 스크롤</li><li>메모: 사업소 내부용 입력(최대 1000자). <strong>입력하면 [메모등록] 활성</strong>, 등록된 메모마다 삭제 버튼</li></ul><p><strong>팝업</strong>(크기·버튼·바텀시트 규칙은 3-3)</p><table class="policy-table"><thead><tr><th>팝업</th><th>내용</th><th>모바일</th></tr></thead><tbody><tr><td>회수 요청하기 → 회수 요청 확인</td><td>2단계. 회수 사유 셀렉트(사망 / 병원·요양원 입소 / 이사 / 그 외, 기본 문구 "사유를 선택해 주세요") + 전체 동의·하위 동의 연동. 동의 전에는 확인 비활성</td><td>모달(선택만)</td></tr><tr><td>회수접수 취소</td><td>취소 사유 셀렉트. "기타(직접 입력)"를 고르면 상세 사유 입력(최대 200자) + "입력된 사유는 돌봄앱 사용자에게 노출됩니다" 안내. 버튼 취소 / 저장</td><td><strong>바텀시트</strong>, 셀렉트는 옵션 시트</td></tr><tr><td>회수지 주소 수정</td><td>우편번호·기본 주소는 <strong>읽기전용</strong>(우편번호 버튼으로만 채움), 상세 주소 입력. 버튼 취소 / 수정</td><td><strong>바텀시트</strong></td></tr><tr><td>회수요청 취소</td><td>사유 없이 확인</td><td>모달</td></tr><tr><td>메모 삭제</td><td>삭제 확인</td><td>모달</td></tr><tr><td>회수 요청 불가 안내</td><td>서비스 불가 지역 등 — 브라우저 <span class="mono">alert()</span> 대신 이 팝업</td><td>모달</td></tr><tr><td>이로움돌봄 주문건 회수 안내</td><td>닫기 / 계속 진행</td><td>모달</td></tr></tbody></table><ul><li>결과 알림은 Toast(9-5): 회수접수 취소 완료, 회수지 주소 저장, 메모 저장 성공·실패</li><li>근거: Figma "260907 돌봄 대대여 사업소 연동" &gt; 이로움돌봄 회수 관리(<span class="mono">6613:190424</span>) — 회수접수 <span class="mono">6534:177679</span>, 회수확인중 <span class="mono">6543:76520</span>, 회수요청 <span class="mono">6543:79003</span>, 모달 <span class="mono">6613:194023</span>, 모바일 회수접수 취소 <span class="mono">7317:76226</span></li></ul><p class="proto-ref">→ <span class="mono">rental-return-detail-prototype.html</span></p>' },
  s42: { title:"4-2. 주문요청관리 리스트", html:
    '<p>적응형(PC 테이블 / 모바일 카드, 3-7·3-9). <strong>구입 주문 / 대여 주문</strong> 두 유형을 오간다.</p><p><strong>PC</strong></p><ul><li><strong>꺽쇠 탭</strong>: 활성 탭만 좌·우·위 2px 테두리, 아래 테두리 없음. 탭 그룹 전체가 아래 2px 선 하나를 공유</li><li>검색 패널(3-7): <strong>기본 펼침</strong> — 주문일자(날짜 2개 + 기간 3개월[기본] / 일주일 / 이번달 / 지난달 / 1년), 품목(대여만, 라디오 전체 / 전동침대 / 수동휠체어 / 경사로 — "경사로"·"실외경사로" 명칭 확인 중, 7번), 주문상태, 검색어</li><li>테이블 컬럼: NO / 품목(대여만) / 수급자 / 요양인정번호 / 휴대폰번호 / 돌봄주문번호 / 주문번호 / 주문상태 / 주문일시. 행 호버 bg <span class="mono">#eff1fd</span>, 행 클릭 → 주문요청관리 상세</li><li><strong>주문번호</strong>: 주문완료 / 출고준비중 / 출고완료 / 배송완료 / 취소요청 / 취소완료에서만 노출(밑줄 링크 → 대대여 이용현황 상세, 행 클릭과 목적지가 다름). 신규배정 / 주문확인중 / 주문취소는 <span class="mono">-</span></li></ul><p><strong>모바일</strong></p><ul><li>페이지 제목 20px Bold</li><li><strong>구입/대여 토글</strong>: 풀폭 세그먼트 — 트랙 높이 52(bg <span class="mono">#eee</span>, 안쪽 여백 4), 선택 버튼 높이 44·bg <span class="mono">#323da3</span>·16px Bold. 타이틀 아래·필터칩 위에 두고 필터칩 줄과 같은 bg <span class="mono">#fafafa</span>, 사이 구분선 없음. 선택 표시는 CSS 비율(<span class="mono">calc(50% - 4px)</span> + <span class="mono">translateX</span>)로 — 창 크기가 바뀌어도 어긋나지 않게</li><li>필터칩: 품목(대여만) / 상태 / 검색</li><li>카드: 헤더 = 상태칩 + 신청일시, 본문 = 수급자명(마스킹) + L번호 / 품목 / 상품정보. 패딩 16 16 24 16(3-8)</li><li><strong>터치 영역 3개</strong>: 카드 전체 → 상세, 주문번호 → 이용현황, 함께 요청 → 바텀시트. 목적지가 다르므로 <span class="mono">stopPropagation()</span> 필수</li><li>바텀시트 4종<ul><li>검색: 주문 요청일(일주일 / 이번달 / 지난달, 3개월[기본] / 1년 / 직접선택 — 2줄) + 날짜(직접선택일 때만 활성) + 품목 + 주문 진행상태 + 상세검색("수급자명, 주문번호, 요양인정번호 검색")</li><li>품목 선택, 주문상태 선택(전체 + 9개 상태) — 선택 행 틴트 + 체크(3-7)</li><li>함께 요청(아래)</li></ul></li><li>페이지네이션 없음(3-6)</li></ul><p><strong>함께 요청(묶음 주문)</strong></p><ul><li>같은 수급자 + 같은 시간대 주문서는 한 묶음. 묶음 행(카드) 배경을 <span class="mono">#eff1fd</span> → <span class="mono">#e8f5e9</span> 교차로 칠해 묶음 경계를 구분(PC 행·모바일 카드 같은 로직)</li><li>표시: 주문서번호 오른쪽 link-2 아이콘(24, 히트 영역 28×28) + 숫자 배지(<strong>본인 제외</strong> 건수, 원형 min-width 14, bg <span class="mono">#323da3</span>, 흰 9px Bold). 단일 품목 건은 표시 안 함. 품목으로 검색·필터한 경우 배지는 보이되 배경 강조는 안 함</li><li>PC: 아이콘 호버 → 팝오버(3-5 지연 규칙). 모바일: "함께 요청 N건" 알약 → 바텀시트("동일 시간대에 요청된 묶음 주문 건", 항목마다 상품명 + 상태칩 + <span class="mono">&gt;</span>, 하단 "확인" 단일 버튼)</li><li>목록에는 <strong>현재 보고 있는 상품을 뺀 나머지</strong>만. 항목을 누르면 그 상품의 주문요청관리 상세로 이동</li><li>근거: Figma 주문요청 관리_대여 리스트(<span class="mono">6410:19835</span>) — PC <span class="mono">6340:14255</span>, 모바일 <span class="mono">6408:15421</span>, 가이드 <span class="mono">6410:19836</span>·<span class="mono">6447:11039</span></li></ul><p class="proto-ref">→ <span class="mono">order-list-adaptive.html</span></p>' },
  s43: { title:"4-3. 주문요청관리 상세", html:
    '<p>반응형 한 페이지(PC 콘텐츠 1060px). 구성: 주문정보 → 주문상품(+ 설치옵션, 배송희망일, 총 대여 금액) → 배송정보 → 본문 맨 아래 "주문목록".</p><p><strong>상태별 표시</strong></p><table class="policy-table"><thead><tr><th>상태</th><th>상단 버튼</th><th>주문번호</th><th>총 대여 금액</th><th>배송희망일</th><th>배송정보 변경</th></tr></thead><tbody><tr><td>신규배정</td><td>주문취소 + <strong>주문정보확인</strong></td><td><span class="mono">-</span></td><td>없음</td><td>없음</td><td>없음</td></tr><tr><td>주문확인중</td><td>주문취소 + <strong>주문하기</strong></td><td><span class="mono">-</span></td><td>요양정보 조회 후</td><td><strong>편집</strong></td><td>가능</td></tr><tr><td>주문완료</td><td>없음</td><td>노출</td><td>있음</td><td>읽기전용*</td><td>가능</td></tr><tr><td>출고준비중 · 출고완료 · 배송완료 · 취소요청</td><td>없음</td><td>노출</td><td>있음</td><td>읽기전용</td><td>없음</td></tr><tr><td>주문취소</td><td>없음</td><td><span class="mono">-</span></td><td>없음</td><td>없음</td><td>없음</td></tr><tr><td>취소완료</td><td>없음</td><td>노출</td><td>없음</td><td>없음</td><td>없음</td></tr></tbody></table><p>\\* 주문완료 이후 배송희망일은 잠기지만, "배송정보 변경하기"로 들어가면 폼 안에서 함께 수정할 수 있다</p><ul><li>상단 버튼 위 <strong>안내 말풍선</strong>: 신규배정 "\'주문정보 확인\' 버튼을 눌러야 정보를 확인할 수 있습니다.", 주문확인중 "\'요양정보\'를 조회해야 주문이 가능합니다." 모바일은 하단 고정 버튼 위, 주 버튼 폭에 맞춰 2줄</li><li>신규배정은 수급자·보호자 이름·연락처 마스킹, 요양인정번호 <span class="mono">-</span>. 주문확인중부터 전체 노출 + 요양인정번호 옆 <strong>"조회"</strong> 버튼(요양정보 조회)</li><li>주문확인중: 대여 안내 띠("대여 주문은 품목별 1개, 수량 1개 단위로 진행됩니다."), <strong>상품변경</strong> 버튼, 설치옵션 선택(셀렉트 + 선택 항목 X 삭제), 본인부담금. 주문완료 이후 설치옵션·상품은 읽기전용 목록</li><li>주문번호 옆 일시는 돌봄주문번호와 같은 <span class="mono">(yyyy-mm-dd hh:mm)</span> 형식</li><li>주문취소 상태는 "주문 취소 사유 : …" 한 줄 표시</li><li><strong>주문완료 결과 화면</strong>(주문하기 직후): 완료 안내 박스(체크 아이콘 + "주문이 완료되었습니다." + "\'상품준비중\' 상태로 진행됩니다.") + 주문상품 요약 + 본문 맨 아래 "주문 요청 상세" / "주문목록"</li><li><strong>배송정보 변경 폼</strong>: 이름* / 주소*(우편번호·기본주소 읽기전용 + 상세주소) / 전화번호 / 휴대폰번호* / 배송희망일(마감 안내 "내일부터 최대 14일 후까지, 오후 1시 마감") / 배송요청사항(셀렉트 + 직접 입력 "한글 20자, 영문 40자 이내"). 헤더 버튼 취소하기 / 저장하기. 모바일은 화면 폭에 맞게(3-2), 텍스트 칸에는 지우기 버튼(3-2)</li><li><strong>함께 요청</strong>: 돌봄주문번호 옆 아이콘. PC는 호버 팝오버, 모바일은 <strong>아이콘 아래 팝오버 카드</strong>(목록 화면의 바텀시트와 다름 — Figma 기준)</li></ul><p><strong>팝업</strong>(3-3)</p><table class="policy-table"><thead><tr><th>팝업</th><th>내용</th><th>모바일</th></tr></thead><tbody><tr><td>주문하기</td><td>"주문 완료 후에는 수량과 옵션을 변경할 수 없습니다…" 버튼 <strong>취소 / 주문하기</strong></td><td>모달</td></tr><tr><td>주문 불가 안내</td><td>요양정보 미조회, 급여 잔액 부족, 삭제된 주문 등 5종. 버튼 "확인"</td><td>모달</td></tr><tr><td>상품변경(상품 추가)</td><td>상품명 검색 입력(돋보기 아이콘 칸, 3-2 오른쪽 패딩) + 결과 선택</td><td>모달(검색-리스트형)</td></tr></tbody></table><ul><li>근거: Figma To-Be 주문요청 관리_대여(<span class="mono">6340:14254</span>) — 신규배정 <span class="mono">6481:16653</span>, 주문확인중 <span class="mono">6482:128078</span>·모바일 <span class="mono">6522:25439</span>, 주문완료 결과 <span class="mono">6523:27780</span>, 주문완료 <span class="mono">6591:179012</span>, 출고·배송·취소 섹션, 주문하기 모달 <span class="mono">6815:39967</span>, 주문불가 <span class="mono">6830:55874</span> 등</li></ul><p class="proto-ref">→ <span class="mono">order-detail-mobile.html</span></p>' },
  s44: { title:"4-4. 대여 회수 관리 리스트", html:
    '<p>적응형(PC 테이블 / 모바일 카드, 3-7·3-9). 대여 전용이라 구입/대여 토글은 없다.</p><p><strong>PC</strong></p><ul><li>검색 패널(3-7): <strong>기본 펼침</strong> — 회수 신청일(날짜 2개 + 기간 일주일 / 1개월 / 3개월[기본] / 6개월 / 1년), 회수 진행상태(전체 + 7개 상태), 검색어(수급자 / 요양인정번호 / 연락처 / 돌봄 회수 신청번호 / 원 주문번호)</li><li>테이블 컬럼: NO / 수급자 / 요양인정번호 / 연락처 / 돌봄 회수 신청번호 / 원 주문번호(밑줄 링크) / 회수상태 / 회수 신청일</li><li>PC에서도 수급자·요양인정번호·연락처 <strong>마스킹</strong>(홍\\*동, L123456\\*\\*\\*\\*, 010-\\*\\*\\*\\*-1234)</li><li>돌봄 회수 신청번호(<span class="mono">COL…</span>)는 <strong>모든 상태에서 노출</strong></li><li>결과 없음: 테이블 헤더 + "검색 조건에 맞는 회수 요청 내역이 없습니다."</li></ul><p><strong>모바일</strong></p><ul><li>필터칩: 기간(기본 3개월) / 상태(기본 "상태 : 전체") / 검색. "3개월" 칩을 누르면 날짜 검색 시트</li><li>카드: 헤더 = 상태칩 + 회수 신청일시, 본문 = 수급자명(마스킹) + L번호 / "돌봄주문 : RET-…". 함께 요청 없음</li><li>바텀시트: 검색(회수 신청일 버튼 2줄 + 날짜 + 회수 진행상태 + 상세검색 "수급자명, 회수번호, 요양인정번호 검색"), <strong>회수 진행상태 선택</strong>(전체 + 7개 상태)</li><li>페이지네이션 없음(3-6)</li><li>근거: Figma PC_이로움돌봄 회수 관리 - 리스트 — PC <span class="mono">6534:177232</span>, 모바일 <span class="mono">6542:28738</span>, 검색 시트 <span class="mono">6542:70590</span>, 상태 시트 <span class="mono">6542:28973</span></li></ul><p class="proto-ref">→ <span class="mono">rental-return-list.html</span></p>' },
  s5: { title:"5. DS 시맨틱 컬러 / 상태칩", html:
    '<p>상태칩은 <strong>도메인마다 별도 Figma 컴포넌트</strong>를 쓴다 — <span class="mono">Status chip-Order</span>(구매), <span class="mono">Status chip-Rental</span>(대여), <span class="mono">Status chip-Return</span>(회수, 구 <span class="mono">-Collect</span>), <span class="mono">Status chip-AS</span>. 구분자는 하이픈. 구매와 대여는 같은 라벨(배송완료·취소요청 등)이 있어도 다른 컴포넌트이므로 화면 도메인에 맞는 것을 쓴다.</p><ul><li>공통 크기: 높이 32, radius 999(알약), 패딩 4/12, gap 4, SUIT SemiBold 14px / 줄 높이 20. 테이블 안 배지는 높이 24·12px Medium(3-9)</li></ul><p><strong>대여 주문 상태(9종)</strong></p><table class="policy-table"><thead><tr><th>상태</th><th>배경</th><th>테두리</th><th>글자</th></tr></thead><tbody><tr><td>신규배정</td><td><span class="mono">#eff6ff</span></td><td><span class="mono">#dbeafe</span></td><td><span class="mono">#1e40af</span></td></tr><tr><td>주문확인중</td><td><span class="mono">#e8f5e9</span></td><td><span class="mono">#c8e6c9</span></td><td><span class="mono">#166534</span></td></tr><tr><td>주문완료 · 출고완료</td><td><span class="mono">#f2fde4</span></td><td><span class="mono">#c6f68d</span></td><td><span class="mono">#09af00</span></td></tr><tr><td>출고준비중 · 취소요청</td><td><span class="mono">#fff8e1</span></td><td><span class="mono">#ffb300</span></td><td><span class="mono">#ff8f00</span></td></tr><tr><td>배송완료</td><td><span class="mono">#e3e5f5</span></td><td><span class="mono">#ced2f4</span></td><td><span class="mono">#141e76</span></td></tr><tr><td>주문취소</td><td><span class="mono">#ffebee</span></td><td><span class="mono">#ffcdd2</span></td><td><span class="mono">#c62828</span></td></tr><tr><td>취소완료</td><td><span class="mono">#f5f5f5</span></td><td><span class="mono">#bdbdbd</span></td><td><span class="mono">#555555</span></td></tr></tbody></table><p><strong>회수 상태(7종)</strong></p><table class="policy-table"><thead><tr><th>상태</th><th>배경</th><th>테두리</th><th>글자</th></tr></thead><tbody><tr><td>회수접수</td><td><span class="mono">#eff6ff</span></td><td><span class="mono">#dbeafe</span></td><td><span class="mono">#1e40af</span></td></tr><tr><td>회수확인중</td><td><span class="mono">#e8f5e9</span></td><td><span class="mono">#c8e6c9</span></td><td><span class="mono">#166534</span></td></tr><tr><td>회수요청</td><td><span class="mono">#fff8e1</span></td><td><span class="mono">#ffb300</span></td><td><span class="mono">#ff8f00</span></td></tr><tr><td>회수준비중</td><td><span class="mono">#f2fde4</span></td><td><span class="mono">#c6f68d</span></td><td><span class="mono">#09af00</span></td></tr><tr><td>회수완료</td><td><span class="mono">#e3e5f5</span></td><td><span class="mono">#ced2f4</span></td><td><span class="mono">#141e76</span></td></tr><tr><td>회수취소</td><td><span class="mono">#ffebee</span></td><td><span class="mono">#ffcdd2</span></td><td><span class="mono">#c62828</span></td></tr><tr><td>회수취소완료</td><td><span class="mono">#f5f5f5</span></td><td><span class="mono">#bdbdbd</span></td><td><span class="mono">#555555</span></td></tr></tbody></table><ul><li>두 표는 같은 색 단계를 공유한다: 파랑(시작) → 초록(확인) → 라임(완료·준비) / 주황(요청·대기) → 네이비 틴트(최종 완료) → 빨강(취소) → 회색(취소 완료)</li><li>반품·A/S 상태칩과 도메인 간 상태(반품완료·A/S완료 등)는 아직 검증 안 됨</li><li>근거: Figma "대여 - 상태값" 범례, <span class="mono">Status chip-Collect</span>(현 <span class="mono">-Return</span>) 컴포넌트</li></ul>' },
  s6: { title:"6. 코드 레벨 원칙 (반복된 실수에서 나온 규칙)", html:
    '<p>1. <strong>입력류(input·select·커스텀 필드)는 배경색·글자색을 명시한다.</strong> 지정하지 않으면 OS 다크모드에 따라 브라우저가 임의로 칠한다(select가 검은 배경으로 나온 사례)</p><p>2. <strong>아이콘은 인라인 SVG로.</strong> 이모지와 기호 문자(▾ ▲ ▼ ☰ ✕ × 등)도 쓰지 않는다</p><ul><li><span class="mono">&lt;select&gt;</span> 기본 화살표도 예외 없음 — <span class="mono">appearance:none</span> + 커스텀 SVG 화살표, 오른쪽 여백은 입력칸 왼쪽 패딩과 대칭(보통 12px)</li><li>입력칸 안에 아이콘(돋보기·달력·지우기)이 있으면 <strong>입력 글자가 아이콘 밑으로 들어가지 않게 그 폭만큼 패딩</strong>을 준다</li></ul><p>3. <strong>하단 고정 요소는 <span class="mono">env(safe-area-inset-bottom)</span> + viewport 메타 <span class="mono">viewport-fit=cover</span>.</strong> 기본 아래 여백은 3-4</p><p>4. <strong>오버레이는 항상 하나만.</strong> 새로 열리면 기존 것을 먼저 닫는다</p><p>5. <strong>화면을 복제하면 숨김 레이어·문구·옵션을 다시 확인한다.</strong> 정상 버튼이 숨겨지고 범용 버튼이 노출된 채 남거나, 다른 화면의 문구·셀렉트 옵션·시트가 그대로 남는 사례가 반복됨(예: 주문 화면에 반품 검색 시트, 셀렉트에 지역 샘플)</p><p>6. <strong>폰트는 SUIT, 크기는 14px 이상 짝수(14·16·18·20…).</strong> SUIT는 <span class="mono">https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/static/woff2/SUIT.css</span>로 로드하고 <span class="mono">font-family</span> 맨 앞에 <span class="mono">\'SUIT\'</span>. 예외는 Figma가 명시한 작은 배지류뿐(원형 숫자 배지 9px Bold, 상태 배지 12px 등). 13px 이하·홀수로 임의 조정 금지</p><p>7. <strong>크기·위치는 JS로 px을 박지 말고 CSS 비율로.</strong> 로드할 때만 계산한 px은 창 크기·기기 회전 때 어긋난다(구입/대여 토글 선택 표시 사례). 꼭 JS가 필요하면 resize 때 다시 계산한다</p><p>8. <strong>한 페이지 원칙(2번)</strong>: 모바일을 별도 페이지로 만들지 않는다. PC 페이지 안에서 1024px 이하 전환</p>' },
  s7: { title:"7. 아직 확정되지 않은 항목", html:
    '<p>확정되면 해당 절에 반영하고 이 목록에서 지운다(경위는 부록).</p><table class="policy-table"><thead><tr><th>#</th><th>항목</th><th>현재 상태</th><th>관련</th></tr></thead><tbody><tr><td>1</td><td><strong>사업소 돌봄 화면(주문요청·회수)의 모바일 상단 헤더</strong></td><td>Figma는 소비자 GNB(이로움 로고·상품 검색·판매/대여 탭). 반품/AS는 9-1 사업소 모바일 셸(브랜드색 GNB + 햄버거)로 정함 — 같은 사업소 화면이라 9-1 적용이 자연스러움</td><td>4-1~4-4, 9-1, 9-9</td></tr><tr><td>2</td><td>모바일 "품목" 칩 표기</td><td>Figma·퍼블 모두 "품목"만 표시. 3-7 규칙대로면 기본 상태는 "품목 : 전체"</td><td>3-7, 4-2</td></tr><tr><td>3</td><td>대여 품목 명칭</td><td>Figma 화면 "경사로", 가이드 메모·테이블 값 "실외경사로"로 섞여 있음</td><td>4-2</td></tr><tr><td>4</td><td>주문요청관리 PC 검색어 셀렉트 옵션</td><td>Figma에 목록 없음. 회수 관리처럼 테이블 식별 컬럼(수급자 / 요양인정번호 / 휴대폰번호 / 돌봄주문번호 / 주문번호)으로 제안</td><td>3-7, 4-2</td></tr><tr><td>5</td><td>상세 화면 모바일 "함께 요청"</td><td>Figma는 아이콘 아래 팝오버 카드, 3-5 원칙은 모바일 = 바텀시트(목록 화면은 바텀시트)</td><td>3-5, 4-3</td></tr><tr><td>6</td><td>입고처리 옵션명 PC·모바일 불일치</td><td>상품유형 "침대/휠체어/경사로" vs "전동침대/수동휠체어/경사로(실외용)", 입고경로 "설치업체/택배" vs "서명요청중/택배"</td><td>3-7</td></tr><tr><td>7</td><td>DS <span class="mono">Textfield</span> 지우기(X) 옵션</td><td>규칙은 3-2에 확정, 컴포넌트에 옵션 추가는 디자인 작업 남음</td><td>3-2</td></tr><tr><td>8</td><td>텍스트형·입력필드형 외 제3의 콘텐츠 유형</td><td>현재는 두 유형으로 전 화면 커버</td><td>3-1, 3-2</td></tr></tbody></table>' },
  s38: { title:"3-8. 모바일 간격", html:
    '<p>DS "모바일 정의"의 모바일 간격 규칙. 3-1·3-2·카드 목록을 담는 <strong>컨테이너 여백</strong>이다(컴포넌트 내부 규칙은 각 절 기준).</p><table class="policy-table"><thead><tr><th>대상</th><th>패딩(상 / 좌우)</th><th>간격(gap)</th><th>비고</th></tr></thead><tbody><tr><td>카드 UI 기본</td><td><span class="mono">24px / 16px</span></td><td>—</td><td>예: 대대여 상품 카드</td></tr><tr><td>카드 UI, 상단에 상태값이 붙는 화면</td><td><span class="mono">16px 16px 24px 16px</span></td><td>—</td><td>예: 이용현황 &gt; 주문내역, 출고처리, 주문요청 카드</td></tr><tr><td>카드 목록</td><td>—</td><td>카드 사이 <strong>12px</strong></td><td>건수 영역이 있으면 건수–첫 카드 <strong>0</strong>, 없으면 <strong>20px</strong></td></tr><tr><td>View(상세) 화면</td><td><span class="mono">24px / 20px</span></td><td>4px</td><td>아코디언 섹션은 <span class="mono">8px / 20px</span>, gap 4</td></tr><tr><td>입력 화면</td><td><span class="mono">24px / 20px</span></td><td>24px</td><td>3-2 입력 폼을 담는 컨테이너</td></tr></tbody></table><ul><li>화면 좌우 여백은 <strong>20px</strong>(360 화면 → 콘텐츠 320, 9-1)</li><li>근거: DS Figma <span class="mono">64Q1Re56aiAA8Al89pqjnV</span> "모바일 정의"(<span class="mono">8576:8969</span>)</li></ul>' },
  s39: { title:"3-9. 리스트 본문 — PC 테이블 ↔ 모바일 카드 (적응형)", html:
    '<p>3-7 검색 영역 아래의 목록. PC 테이블과 모바일 카드를 둘 다 두고 1024/1025px에서 표시만 전환한다.</p><p><strong>PC — 탭 줄 + 테이블</strong></p><ul><li>탭 줄: 밑줄 탭(패딩 16/20, 16px SemiBold, 활성 <span class="mono">#1a1a1a</span> + 아래 2px <span class="mono">#333</span>, 비활성 <span class="mono">#999</span>), 줄 아래 1px <span class="mono">#616161</span>. 오른쪽에 <strong>일괄 처리 버튼</strong>(채움 36px, 14px SemiBold) — 체크한 행이 대상, 0건이면 비활성</li><li>테이블: 헤더 높이 52·bg <span class="mono">#f5f5f5</span>·아래 1px <span class="mono">#bdbdbd</span>·14px SemiBold / 행 높이 52·아래 1px <span class="mono">#eee</span>·14px Regular. 셀 안 두 줄 정보는 두 줄까지, 넘치면 말줄임</li><li>체크박스 컬럼 44px, 헤더 체크박스 = 전체 선택, <strong>선택한 행 bg <span class="mono">#eff1fd</span></strong></li><li>정렬: 날짜 컬럼 헤더에 정렬 아이콘(8×16, 기본 <span class="mono">#999</span>, 오름·내림은 해당 삼각형만 <span class="mono">#323da3</span>). 누를 때마다 기본 → 오름차순 → 내림차순</li><li>상태 배지: 높이 24, 12px Medium(Figma 명시값, 6-6 예외)</li><li><strong>컬럼 합이 콘텐츠 폭(1136px)을 넘으면 좌측 고정 + 가로 스크롤</strong>: 좌측 식별 컬럼(예: 체크박스 44 + 바코드 234 + 상품명 162 = 440px)은 고정, 나머지만 가로 스크롤. 스크롤바 높이 2px(트랙 <span class="mono">#eee</span>, 막대 <span class="mono">#333</span>). 표 아래 오른쪽에 "표를 밀어보세요." + 화살표 아이콘(14px <span class="mono">#616161</span>, 위 간격 10). 구현 방식은 자유(표 두 개 분리 또는 <span class="mono">position:sticky</span>)</li><li>표 아래 페이지네이션(3-6)</li></ul><p><strong>모바일 — 탭 + 카드 목록</strong></p><ul><li>탭: 풀폭 균등 분할, 스타일은 PC 탭과 같음, 아래 1px <span class="mono">#eee</span></li><li>검색 영역(3-7) → 건수(56px) → 카드 목록(카드 사이 12, 3-8)</li><li>카드: 패딩은 3-8, radius 8, 그림자 <span class="mono">0 0 1px rgba(0,0,0,.2), 0 2px 16px rgba(0,0,0,.08)</span>, 줄 간격 6. 내용은 <strong>3줄로 압축</strong> — ① 상태 배지 + 분류 + 모델(16px <span class="mono">#555</span>) ② 식별자 16px Bold ③ 보조 정보 1줄. 나머지 컬럼은 상세 화면에서 보여준다</li><li>누른 카드: bg <span class="mono">#eff1fd</span> + 테두리 1px <span class="mono">#141e76</span>, 그림자 <span class="mono">0 2px 8px rgba(0,0,0,.08), 0 0 .5px rgba(0,0,0,.2)</span></li><li><strong>체크박스·일괄 처리 없음. 카드를 누르면 상세 화면</strong>으로 이동(3-1 텍스트형, 3-8 View 24/20)</li><li>페이지네이션 없음 — 스크롤로 이어서 불러온다</li><li>근거: Figma 입출고 창고 <span class="mono">PC_입고 처리&gt;입고대기_테이블 일부 고정값</span>, 모바일 <span class="mono">입고대기</span>·<span class="mono">입고처리</span></li></ul><p class="proto-ref">→ <span class="mono">list-body-compare-demo.html</span></p>' },
  s310: { title:"3-10. 카드 목록형 (PC·모바일 모두 카드 — 반응형)", html:
    '<p>한 건에 보여줄 정보와 행동(버튼·메모)이 많아 <strong>PC에서도 테이블 대신 카드</strong>를 쓰고, <strong>같은 카드를 폭에 따라 재배치</strong>한다. 기준 화면은 사업소 <strong>수급자 통합관리 목록</strong>. (9-3 상품 카드 그리드와 다름 — 1열 목록)</p><p><strong>화면 구성(위→아래)</strong>: 페이지 타이틀 → 조회 폼 → 구역 구분선("등록 수급자 관리") → 목록 헤더(타이틀 + 건수 배지, 오른쪽 버튼들) → 키워드 검색 + 상세 조건 패널 → 필터 태그 줄 → 결과 정보(검색결과 N명 · 급여 잔액 총액) → 카드 목록 → 페이지네이션</p><ul><li><strong>조회 폼</strong>(공단 조회 — 필터가 아니라 외부 조회 요청): 테두리 2px <span class="mono">#323da3</span> radius 4. 헤더 bg <span class="mono">#eff1fd</span>(아래 1px <span class="mono">#ced2f4</span>, 높이 60, 패딩 12/20) = 돋보기 + "수급자 조회" 16px Bold <span class="mono">#323da3</span>, 오른쪽 "조회 이력" 알약 버튼(bg <span class="mono">#f2fde4</span>, 테두리 <span class="mono">#43a047</span>, 높이 36). 본문 패딩 20, 입력 필드(라벨 위 + 입력) PC 한 줄 3개(가로 20, 세로 16) → 모바일 한 줄 1개. 마지막 "조회" 버튼(모바일 전체폭)</li><li><strong>상세 조건 패널</strong>: 테두리 1px <span class="mono">#bdbdbd</span> radius 4. 위쪽(bg <span class="mono">#fafafa</span>, 패딩 16/20) = 키워드 입력 + "검색", 오른쪽(모바일은 아래 전체폭) "상세 조건 펼치기/접기"(bg <span class="mono">#eee</span>). <strong>기본 접힘</strong>, 열고 닫을 때 <strong>슬라이드 애니메이션</strong>. 본문 = 섹션별(18px SemiBold) 라디오·체크박스(16px) → 초기화(외곽선)·적용(채움)</li><li><strong>필터 태그</strong>: 조건 적용 시 패널 아래 칩. bg <span class="mono">#eff1fd</span>, 14px SemiBold <span class="mono">#141e76</span>, radius 999, 높이 32, 패딩 6/12 + X. <strong>X를 누르면 그 조건만 해제하고 즉시 재조회</strong>, 호버 시 X 강조. 순서 고정: 급여 잔액 → 적용구간 → 대여종료 → 자격상실 제외. 모바일은 줄바꿈</li><li><strong>카드</strong>: 흰 배경, 테두리 1px <span class="mono">#bdbdbd</span>, radius 4, <strong>카드 사이 12</strong>, 본문 패딩 <strong>16 16 24 16</strong><ul><li>헤더(bg <span class="mono">#fafafa</span>, 아래 1px <span class="mono">#eee</span>) = 이름·L번호 + 상태 배지(이름 옆) + 최근 조회 일시(14px <span class="mono">#999</span>, 모바일 16px) + 업데이트 버튼</li><li>본문(간격 16) = 생년월일·성별·연락처(18px) → 정보 항목(라벨 16px <span class="mono">#616161</span> / 값 16px SemiBold, 급여 잔액 <span class="mono">#e53935</span>) → 대여종료 예정 박스(연한 빨강, D-N 강조) → 메모</li><li>하단 행동 영역(위 1px <span class="mono">#eee</span>, 패딩 8/16/16/16) = 버튼들</li><li><strong>PC</strong>: 왼쪽 정보 2행(등급·본인부담률 + 급여 잔액 → 유효기간 + 적용구간), 오른쪽 메모. 줄바꿈되면 적용구간이 마지막 행으로 내려와 대여종료 예정 박스와 붙어 있어야 함</li><li><strong>모바일</strong>: 정보 한 줄에 하나씩(등급·본인부담률 → 급여 잔액 → 유효기간 → 적용구간, 라벨 왼쪽·값 오른쪽 정렬) → 대여종료 예정 박스 → 메모. 버튼은 보조 2개 나란히 + 주 버튼(수급자 상세보기) 전체폭</li></ul></li><li><strong>입력·버튼 크기 PC/모바일 분리</strong>: 같은 컴포넌트라도 모바일에서 크게 — PC 높이 36~40·14px → 모바일 <strong>48·16px</strong>(예: 검색 57×40 → 60×48, 초기화·적용 80×36 → 80×48, 카드 버튼 36 → 48)</li><li>모바일 페이지네이션은 있음·없음 둘 다 가능(3-6)</li><li>768 프레임은 모바일 레이아웃이 태블릿 폭에서 늘어나는 예시일 뿐 별도 브레이크포인트가 아니다(1번)</li><li>근거: 운영 디자인 Figma <span class="mono">SzCeq0gMiwowoWyOGwqbXt</span> "260824_수급자관리 목록 필터" To-Be <span class="mono">6092:87371</span>(PC <span class="mono">6089:78653</span> / 768 <span class="mono">6092:86248</span> / 360 <span class="mono">6089:81329</span>). 퍼블 모바일 페이지는 이 디자인과 다른 설계라 근거로 쓰지 않음</li></ul><p class="proto-ref">→ <span class="mono">card-list-responsive-demo.html</span> · 퍼블·개발 전달용: <span class="mono">share-recipient-list.html</span></p>' },
  s311: { title:"3-11. 상세 화면 공통 요소", html:
    '<ul><li><strong>정보 표</strong>: PC는 <strong>2쌍/행</strong>(라벨|값|라벨|값), 모바일은 <strong>1쌍/행</strong>(3-1). 라벨 배경 유무는 화면 디자인을 따른다(주문·회수 = 배경 있음, 반품/AS = 없음). 모바일에서만 접을 수 있는 섹션(신청자 정보 등)은 4-1과 같음</li><li><strong>아코디언 섹션</strong>: PC·모바일 모두 접기·펼치기, 헤더 행 배경으로 구분(기본 회색, 강조 <span class="mono">#eff1fd</span>). <strong>제목 영역 좌우 패딩 0</strong> — 안쪽 콘텐츠 패딩과 겹쳐 40px이 되지 않게</li><li><strong>첨부 이미지</strong>: 모바일은 가로 스크롤 썸네일 <strong>100px</strong>, 글자 간격 6, 오른쪽 위 확대 아이콘 → 확대 보기</li><li><strong>목록으로 돌아가기</strong>: 본문 맨 아래 오른쪽 "○○목록" 버튼(PC·모바일 공통, 모바일 여백은 3-4). 모바일은 상단 헤더 뒤로가기도 함께 둔다</li><li><strong>모바일 공통</strong>: 뒤로가기 터치 영역 <strong>48×48</strong> / 연락처는 <strong>tel: 링크</strong> / 하단 고정 버튼은 LG 54 + 흰 그라데이션을 전 화면 동일하게(3-4) / 키보드가 올라와도 하단 고정 버튼이 입력칸을 가리지 않게</li><li>근거: 반품/AS 상세 디자인 + 7/16 디자이너 주석, 주문요청관리·회수관리 상세 Figma</li></ul>' },
  s9: { title:"9. 이로움케어 사업소 / 운영관리 화면군", html:
    '<p><strong>배경</strong>: 대대여(플러스+) 운영관리 시스템은 현재 PC가 PHP, 모바일이 별도 React 앱으로 <strong>이중 관리</strong>되고 있음 — 이 반응형 정책 문서를 만드는 근본 이유. Figma 파일 <span class="mono">H8lqlZitePnf5dTDPB5GzR</span>에 운영관리 앱 3개: <strong>이로움케어 사업소</strong>(사업소 직원용) / <strong>입출고 창고</strong>(창고 직원용) / <strong>설치파트너</strong>(설치업체용). 1~8번은 전부 소비자용 화면 기준이었고, 9번부터 운영관리 화면군.</p>'+
    '<p style="background:var(--accent-soft);border-radius:8px;padding:10px 12px;"><strong>⚠️ 중요 정정(2026-09-28)</strong>: 9-1의 셸(GNB+SideNav+Container)은 <strong>Figma에만 있는, 아직 서비스에 반영 안 된 리뉴얼 디자인</strong>이다. 실제 운영 중인 사업소 화면은 탭+이벤트배너+다중 링크의 무거운 GNB, 계정박스+장바구니위젯+공지사항까지 붙은 복잡한 SNB를 쓰는 <strong>구버전 셸</strong> — 사업소도 리뉴얼을 시도했지만 개발 반영이 안 끝난 상태. 반면 입출고 창고·설치파트너는 <strong>리뉴얼이 실제로 배포</strong>돼서 새 셸을 쓴다. → 템플릿 표준은 새 셸로 채택, 사업소 구버전은 별도 반응형 규칙화하지 않음(새 셸로 교체가 목표) — 즉 9-1의 <strong>PC 셸은 입출고 창고·설치파트너 전용</strong>(사업소 PC 제외). 단 <strong>모바일 셸은 사업소도 같은 구조</strong>(2026-09-29 재정정).</p>'+
    '<h4>콘텐츠 컨테이너 · 셸 (PC: 창고·설치파트너 / 모바일: 3개 앱 공통)</h4>'+
    '<ul>'+
    '<li>PC: GNB(56px, 브랜드색 #323da3 배경 — 햄버거+흰 로고 / 공지사항+아바타) + SideNav(240px) + 콘텐츠 <span class="mono">1200px</span>(내부 패딩 32px → 실콘텐츠 <strong>1136px</strong>) — 14회 반복 확인. 소비자용 1060px과 다른 값</li>'+
    '<li><strong>1025~1439px</strong>: SideNav 오버레이 + 콘텐츠 최소 1440 가로 스크롤(1번 참고, 사업소는 1199px 기준). <strong>모바일 홈 버튼</strong>은 3depth부터 노출(입력 페이지·액션 후 다음 depth 예외)</li>'+
    '<li><strong>PC SideNav 접기/펼치기</strong>: GNB 햄버거(전체보기)를 누르면 SideNav가 왼쪽으로 슬라이드되며 숨겨지고, 다시 누르면 나타남. 햄버거 아이콘도 숨김 상태에선 가운데 줄이 짧아지는 모양으로 애니메이션 전환</li>'+
    '<li>모바일 콘텐츠 컨테이너: 360px, 내부 패딩 20px → 실콘텐츠 <strong>320px</strong> — 1번 360px 규칙과 일치</li>'+

/* ---------------- Render ---------------- */
var state = { activeId:null, openCategory:"common-pattern" };

function toggleCategory(cat){
  state.openCategory = (state.openCategory === cat) ? null : cat;
  renderMenu();
}
function renderMenu(){
  var html = '';
  CATEGORY_ORDER.forEach(function(cat, catIdx){
    var items = PROTOS.filter(function(p){ return p.category === cat; });
    if(!items.length) return;
    var isOpen = state.openCategory === cat;
    html += '<button class="menu-group-header'+(isOpen?' open':'')+'" onclick="toggleCategory(\''+cat+'\')">'+
      '<span>'+CATEGORY_LABEL[cat]+' <span class="count">('+items.length+')</span></span>'+
      '<span class="chev">›</span></button>';
    html += '<div class="menu-group-items'+(isOpen?' open':'')+'">';
    items.forEach(function(p){
      html += '<button class="menu-item'+(state.activeId===p.id?' active':'')+'" onclick="selectProto(\''+p.id+'\')">'+
        '<span class="menu-text"><div class="menu-title">'+p.title+'</div><div class="menu-desc">'+p.desc+'</div></span>'+
        '</button>';
    });
    html += '</div>';
  });
  document.getElementById('menu').innerHTML = html;
}

function renderStage(){
  var p = PROTOS.find(function(x){ return x.id === state.activeId; });
  document.getElementById('stageTitle').textContent = p.title;
  document.getElementById('stageFile').textContent = 'prototypes/'+p.id;
  document.getElementById('stageOpen').href = 'prototypes/'+p.id;
  document.getElementById('protoFrame').src = 'prototypes/'+p.id;
}

function sectionCard(sid, isPrimary){
  var s = SECTIONS[sid];
  return '<div class="p-section'+(isPrimary?' primary':'')+'">'+
    '<div class="p-section-card" data-slug="'+secSlug(sid)+'">'+
    '<span class="p-tag'+(isPrimary?'':' secondary')+'">'+(isPrimary?'핵심 규칙':'함께 참고')+'</span>'+
    '<div class="p-card-head"><h3>'+s.title+'</h3>'+
    '<button type="button" class="card-link" onclick="copyLink(\''+secSlug(sid)+'\')" title="이 조항으로 바로 열리는 링크를 복사합니다">'+LINK_ICON+'링크</button></div>'+s.html+
    '</div></div>';
}

function renderPolicy(){
  var box = document.getElementById('policyContent');
  var p = PROTOS.find(function(x){ return x.id === state.activeId; });
  var html = sectionCard(p.primary, true);
  if(p.related && p.related.length){
    html += '<button class="related-toggle" id="relatedToggle" onclick="toggleRelated()">'+
      '<span>함께 참고할 조항 ('+p.related.length+')</span><span class="chev">›</span></button>'+
      '<div class="related-body" id="relatedBody">'+
      p.related.map(function(sid){ return sectionCard(sid, false); }).join('')+
      '</div>';
  }
  box.innerHTML = html;
}

function toggleRelated(){
  document.getElementById('relatedToggle').classList.toggle('open');
  document.getElementById('relatedBody').classList.toggle('open');
}

}
function copyLink(hash){
  var url = location.origin + location.pathname + '#' + hash;
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('링크가 복사되었어요'); } catch(e){ window.prompt('아래 링크를 복사하세요', url); }
    ta.remove();
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(function(){ showToast('링크가 복사되었어요'); }, fallback);
  } else { fallback(); }
}
function route(){
  var h = decodeURIComponent(location.hash.slice(1));
  if(!h){ closeDocModal(); goHome(true); return; }
  var p = PROTOS.find(function(x){ return protoSlug(x.id) === h; });
  if(p){ closeDocModal(); selectProto(p.id, true); return; }
  var sid = Object.keys(SECTIONS).find(function(k){ return secSlug(k) === h; });
  if(sid){ if(!state.activeId && document.getElementById('homeView').hidden) goHome(true); openDocModal(h); return; }
  goHome(true);
}
window.addEventListener('popstate', route);

/* ---------------- 검색 (조항 번호 · 본문 · 화면) — 2026-09-30 ---------------- */
var pendingTerm = null;
var SEARCH_INDEX = null;
function stripHtml(h){ var d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); }
function buildIndex(){
  SEARCH_INDEX = Object.keys(SECTIONS).map(function(k){
    return { kind:'조항', slug:secSlug(k), title:SECTIONS[k].title, text:stripHtml(SECTIONS[k].html) };
  }).concat(PROTOS.map(function(p){
    return { kind:'화면', slug:protoSlug(p.id), id:p.id, title:p.title, text:p.desc + ' ' + p.id };
  }));
}
function esc(t){ return t.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hl(t, q){ var i = t.toLowerCase().indexOf(q.toLowerCase()); if(i < 0) return esc(t); return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length)); }
function snippet(t, q){
  var i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(t.slice(0, 90)) + (t.length > 90 ? '…' : '');
  var a = Math.max(0, i - 36), b = Math.min(t.length, i + q.length + 54);
  return (a > 0 ? '…' : '') + hl(t.slice(a, b), q) + (b < t.length ? '…' : '');
}
function doSearch(q){
  if(!SEARCH_INDEX) buildIndex();
  q = q.trim(); if(!q) return [];
  var lq = q.toLowerCase();
  return SEARCH_INDEX.map(function(it){
    var score = 0, tl = it.title.toLowerCase(), xl = it.text.toLowerCase();
    if(it.kind === '조항' && it.slug === q) score += 1000;               /* "4-4" 번호 정확히 */
    else if(it.kind === '조항' && tl.indexOf(q + '.') === 0) score += 900;
    if(tl.indexOf(lq) >= 0) score += 100;
    var n = 0, from = 0; while((from = xl.indexOf(lq, from)) >= 0){ n++; from += lq.length; }
    score += Math.min(n, 20) * 5;
    return { it:it, score:score };
  }).filter(function(r){ return r.score > 0; }).sort(function(a, b){ return b.score - a.score; }).slice(0, 12);
}
var searchInput = document.getElementById('siteSearch');
var searchBox = document.getElementById('searchResults');
var searchSel = 0, searchRes = [];
function renderSearch(){
  var q = searchInput.value.trim();
  if(!q){ searchBox.hidden = true; return; }
  searchRes = doSearch(q); searchSel = 0;
  searchBox.innerHTML = searchRes.length ? searchRes.map(function(r, i){
    return '<button type="button" role="option" class="sr-item' + (i === 0 ? ' active' : '') + '" data-i="' + i + '">' +
      '<div class="sr-top"><span class="sr-kind">' + r.it.kind + '</span><span>' + hl(r.it.title, q) + '</span></div>' +
      '<div class="sr-snip">' + snippet(r.it.text, q) + '</div></button>';
  }).join('') : '<div class="sr-empty">"' + esc(q) + '"에 맞는 결과가 없어요</div>';
  searchBox.hidden = false;
}
function pickSearch(i){
  var r = searchRes[i]; if(!r) return;
  var q = searchInput.value.trim();
  searchBox.hidden = true; searchInput.blur();
  if(r.it.kind === '화면'){ closeDocModal(); selectProto(r.it.id); return; }
  pendingTerm = (q === r.it.slug) ? null : q;
  if(location.hash.slice(1) !== r.it.slug) history.pushState(null, '', '#' + r.it.slug);
  openDocModal(r.it.slug);
}
function markTerm(root, q){
  var lq = q.toLowerCase(), first = null, walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while(walker.nextNode()) if(walker.currentNode.nodeValue.toLowerCase().indexOf(lq) >= 0) nodes.push(walker.currentNode);
  nodes.forEach(function(node){
    var v = node.nodeValue, i = v.toLowerCase().indexOf(lq), frag = document.createDocumentFragment(), last = 0;
    while(i >= 0){
      frag.appendChild(document.createTextNode(v.slice(last, i)));
      var m = document.createElement('mark'); m.textContent = v.slice(i, i + q.length); frag.appendChild(m);
      if(!first) first = m;
      last = i + q.length; i = v.toLowerCase().indexOf(lq, last);
    }
    frag.appendChild(document.createTextNode(v.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
  return first;
}
searchInput.addEventListener('input', renderSearch);
searchInput.addEventListener('focus', function(){ if(searchInput.value.trim()) renderSearch(); });
searchInput.addEventListener('keydown', function(e){
  var items = searchBox.querySelectorAll('.sr-item');
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(!items.length) return; e.preventDefault();
    items[searchSel].classList.remove('active');
    searchSel = (searchSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items[searchSel].classList.add('active'); items[searchSel].scrollIntoView({block:'nearest'});
  } else if(e.key === 'Enter'){ e.preventDefault(); pickSearch(searchSel); }
  else if(e.key === 'Escape'){ searchBox.hidden = true; searchInput.blur(); }
});
searchBox.addEventListener('mousedown', function(e){ var b = e.target.closest('.sr-item'); if(b){ e.preventDefault(); pickSearch(+b.dataset.i); } });
document.addEventListener('click', function(e){ if(!e.target.closest('.search-wrap')) searchBox.hidden = true; });
document.addEventListener('keydown', function(e){
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); searchInput.focus(); searchInput.select(); }
});
if(!/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById('searchKbd').textContent = 'Ctrl K';

function selectProto(id, fromRoute){
  if(!fromRoute && location.hash.slice(1) !== protoSlug(id)) history.pushState(null, '', '#' + protoSlug(id));
  state.activeId = id;
  var p = PROTOS.find(function(x){ return x.id === id; });
  state.openCategory = p.category; /* 선택한 항목의 대카테고리를 자동으로 펼침 */
  document.getElementById('homeView').hidden = true;
  document.getElementById('bodyGrid').hidden = false;
  document.getElementById('homeGrid').innerHTML = ''; /* 썸네일 iframe 정리 */
  renderMenu(); renderStage(); renderPolicy();
}

/* ---------------- 전체 문서 모달 ---------------- */
var docModalOverlay = document.getElementById('docModalOverlay');
function openDocModal(slug){
  var body = document.getElementById('docModalBody');
  body.innerHTML = FULL_DOC_ORDER.map(function(sid){ return sectionCard(sid, false); }).join('');
  docModalOverlay.hidden = false;
  if(typeof slug === 'string'){
    var card = body.querySelector('.p-section-card[data-slug="' + slug + '"]');
    if(card){
      var first = pendingTerm ? markTerm(card, pendingTerm) : null;
      (first || card).scrollIntoView({block: first ? 'center' : 'start'});
      card.classList.add('flash'); setTimeout(function(){ card.classList.remove('flash'); }, 1600);
    }
  }
  pendingTerm = null;
}
function closeDocModal(){
  if(docModalOverlay.hidden) return;
  docModalOverlay.hidden = true;
  /* 조항 링크(#3-3)로 열린 경우 닫으면 주소를 현재 화면 기준으로 되돌림 */
  var h = decodeURIComponent(location.hash.slice(1));
  if(h && Object.keys(SECTIONS).some(function(k){ return secSlug(k) === h; })){
    history.replaceState(null, '', state.activeId ? '#' + protoSlug(state.activeId) : location.pathname);
  }
}
document.getElementById('toggleFullDoc').addEventListener('click', function(){ openDocModal(); });
document.getElementById('docModalClose').addEventListener('click', closeDocModal);
docModalOverlay.addEventListener('click', function(e){ if(e.target === docModalOverlay) closeDocModal(); });
document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && !docModalOverlay.hidden) closeDocModal(); });

/* ---------------- 홈 화면 (카테고리별 프로토타입 카드 그리드) ---------------- */
function renderHome(){
  var html = '';
  CATEGORY_ORDER.forEach(function(cat){
    var items = PROTOS.filter(function(p){ return p.category === cat; });
    if(!items.length) return;
    html += '<div class="gallery-group-label">'+CATEGORY_LABEL[cat]+' ('+items.length+')</div><div class="gallery-grid">';
    items.forEach(function(p){
      html += '<button class="gallery-card" onclick="selectProto(\''+p.id+'\')">'+
        '<div class="gallery-thumb"><iframe src="prototypes/'+p.id+'" loading="lazy" tabindex="-1"></iframe></div>'+
        '<div class="gallery-card-body">'+
        '<div class="gallery-card-title">'+p.title+'</div>'+
        '<div class="gallery-card-desc">'+p.desc+'</div>'+
        '</div></button>';
    });
    html += '</div>';
  });
  document.getElementById('homeGrid').innerHTML = html;
}
function goHome(fromRoute){
  if(!fromRoute && location.hash) history.pushState(null, '', location.pathname);
  state.activeId = null;
  document.getElementById('bodyGrid').hidden = true;
  document.getElementById('homeView').hidden = false;
  renderHome();
  renderMenu(); /* 좌측 메뉴는 홈에서도 항상 노출 — active 표시 해제 반영 */
}
document.getElementById('toggleGallery').addEventListener('click', function(){ goHome(); });
document.getElementById('homeBackBtn').addEventListener('click', function(){ goHome(); });
document.getElementById('stageCopy').addEventListener('click', function(){ if(state.activeId) copyLink(protoSlug(state.activeId)); });
document.getElementById('homeDocCard').addEventListener('click', openDocModal);

/* ---------------- 우측 패널 드래그 리사이즈 ---------------- */
(function(){
  var bodyGrid = document.getElementById('bodyGrid');
  var handle = document.getElementById('resizeHandle');
  var protoFrame = document.getElementById('protoFrame');
  var MIN_W = 300, MAX_W = 760;
  var saved;
  try{ saved = localStorage.getItem('policyPanelWidth'); }catch(e){}
  if(saved){ bodyGrid.style.setProperty('--policy-w', saved + 'px'); }

  var dragging = false, startX = 0, startW = 0;
  function currentWidth(){
    var v = getComputedStyle(bodyGrid).getPropertyValue('--policy-w').trim();
    return parseInt(v, 10) || 400;
  }
  function onMove(e){
    if(!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var delta = startX - x; // 왼쪽으로 끌면 패널이 넓어짐
    var maxAllowed = Math.min(MAX_W, Math.round(window.innerWidth * 0.6));
    var w = Math.max(MIN_W, Math.min(maxAllowed, startW + delta));
    bodyGrid.style.setProperty('--policy-w', w + 'px');
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    if(protoFrame) protoFrame.style.pointerEvents = '';
    try{ localStorage.setItem('policyPanelWidth', currentWidth()); }catch(e){}
  }
  function onDown(e){
    dragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startW = currentWidth();
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    if(protoFrame) protoFrame.style.pointerEvents = 'none';
    e.preventDefault();
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
})();

route();
</script>
<div class="copy-toast" id="copyToast" role="status" aria-live="polite"></div>
