><td>Error</td><td><span class="mono">#ffebee</span></td><td><span class="mono">#ffcdd2</span></td><td><span class="mono">#c62828</span></td></tr><tr><td>상품별 처리 중</td><td>Neutral</td><td><span class="mono">#f5f5f5</span></td><td><span class="mono">#bdbdbd</span></td><td><span class="mono">#555555</span></td></tr><tr><td>다중상태("+N개 상태")</td><td>Neutral · Transparent</td><td><span class="mono">#f5f5f5</span></td><td>없음</td><td>미확인</td></tr><tr><td>추가상품</td><td>Neutral</td><td><span class="mono">#ffffff</span></td><td><span class="mono">#bdbdbd</span></td><td>미확인</td></tr></tbody></table><ul><li>구입 개발 화면의 \'추가상품\'은 초록(주문확인중과 같은 색)으로 DS와 다르다(4-5)</li><li>세 표는 같은 색 단계를 공유한다: 파랑(시작) → 초록(확인) → 라임(완료·준비) / 주황(요청·대기) → 네이비 틴트(최종 완료) → 빨강(취소) → 회색(취소 완료)</li><li>반품·A/S 상태칩과 도메인 간 상태(반품완료·A/S완료 등)는 아직 검증 안 됨</li><li>근거: Figma "대여 - 상태값" 범례, <span class="mono">Status chip-Collect</span>(현 <span class="mono">-Return</span>) 컴포넌트</li></ul>' },
  s6: { title:"6. 코드 레벨 원칙 (반복된 실수에서 나온 규칙)", html:
    '<p>1. <strong>입력류(input·select·커스텀 필드)는 배경색·글자색을 명시한다.</strong> 지정하지 않으면 OS 다크모드에 따라 브라우저가 임의로 칠한다(select가 검은 배경으로 나온 사례)</p><p>2. <strong>아이콘은 인라인 SVG로.</strong> 이모지와 기호 문자(▾ ▲ ▼ ☰ ✕ × 등)도 쓰지 않는다</p><ul><li><span class="mono">&lt;select&gt;</span> 기본 화살표도 예외 없음 — <span class="mono">appearance:none</span> + 커스텀 SVG 화살표, 오른쪽 여백은 입력칸 왼쪽 패딩과 대칭(보통 12px)</li><li>입력칸 안에 아이콘(돋보기·달력·지우기)이 있으면 <strong>입력 글자가 아이콘 밑으로 들어가지 않게 그 폭만큼 패딩</strong>을 준다</li></ul><p>3. <strong>하단 고정 요소는 <span class="mono">env(safe-area-inset-bottom)</span> + viewport 메타 <span class="mono">viewport-fit=cover</span>.</strong> 기본 아래 여백은 3-4</p><p>4. <strong>오버레이는 항상 하나만.</strong> 새로 열리면 기존 것을 먼저 닫는다</p><p>5. <strong>화면을 복제하면 숨김 레이어·문구·옵션을 다시 확인한다.</strong> 정상 버튼이 숨겨지고 범용 버튼이 노출된 채 남거나, 다른 화면의 문구·셀렉트 옵션·시트가 그대로 남는 사례가 반복됨(예: 주문 화면에 반품 검색 시트, 셀렉트에 지역 샘플)</p><p>6. <strong>폰트는 SUIT, 크기는 14px 이상 짝수(14·16·18·20…).</strong> SUIT는 <span class="mono">https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/static/woff2/SUIT.css</span>로 로드하고 <span class="mono">font-family</span> 맨 앞에 <span class="mono">\'SUIT\'</span>. 예외는 Figma가 명시한 작은 배지류뿐(원형 숫자 배지 9px Bold, 상태 배지 12px 등). 13px 이하·홀수로 임의 조정 금지</p><p>7. <strong>크기·위치는 JS로 px을 박지 말고 CSS 비율로.</strong> 로드할 때만 계산한 px은 창 크기·기기 회전 때 어긋난다(구입/대여 토글 선택 표시 사례). 꼭 JS가 필요하면 resize 때 다시 계산한다</p><p>8. <strong>한 페이지 원칙(2번)</strong>: 모바일을 별도 페이지로 만들지 않는다. PC 페이지 안에서 1024px 이하 전환</p><p>9. <strong>반응형이어도 모바일에서는 컴포넌트 MO 변형 크기로.</strong> 입력칸·셀렉트 48 / 옵션 행 44 / 글자 16px(3-2). 적응형(별도 모바일 구조)일 때는 자연스럽게 MO 컴포넌트를 쓰지만, 같은 DOM을 재배치하는 반응형에서는 PC 크기(40·14px)가 그대로 남기 쉽다(주문요청관리·회수 상세 등에서 실제 발생)</p>' },
  s7: { title:"7. 아직 확정되지 않은 항목", html:
    '<p>확정되면 해당 절에 반영하고 이 목록에서 지운다(경위는 부록).</p><table class="policy-table"><thead><tr><th>#</th><th>항목</th><th>현재 상태</th><th>관련</th></tr></thead><tbody><tr><td>1</td><td><strong>사업소 돌봄 화면(주문요청·회수)의 모바일 상단 헤더</strong></td><td>Figma는 소비자 GNB(이로움 로고·상품 검색·판매/대여 탭). 반품/AS는 9-1 사업소 모바일 셸(브랜드색 GNB + 햄버거)로 정함 — 같은 사업소 화면이라 9-1 적용이 자연스러움</td><td>4-1~4-4, 9-1, 9-4</td></tr><tr><td>2</td><td>모바일 "품목" 칩 표기</td><td>Figma·퍼블 모두 "품목"만 표시. 3-7 규칙대로면 기본 상태는 "품목 : 전체"</td><td>3-7, 4-2</td></tr><tr><td>3</td><td>대여 품목 명칭</td><td>Figma 화면 "경사로", 가이드 메모·테이블 값 "실외경사로"로 섞여 있음</td><td>4-2</td></tr><tr><td>4</td><td>주문요청관리 PC 검색어 셀렉트 옵션</td><td>Figma에 목록 없음. 회수 관리처럼 테이블 식별 컬럼(수급자 / 요양인정번호 / 휴대폰번호 / 돌봄주문번호 / 주문번호)으로 제안</td><td>3-7, 4-2</td></tr><tr><td>5</td><td>상세 화면 모바일 "함께 요청"</td><td>Figma는 아이콘 아래 팝오버 카드, 3-5 원칙은 모바일 = 바텀시트(목록 화면은 바텀시트)</td><td>3-5, 4-3</td></tr><tr><td>6</td><td>입고처리 옵션명 PC·모바일 불일치</td><td>상품유형 "침대/휠체어/경사로" vs "전동침대/수동휠체어/경사로(실외용)", 입고경로 "설치업체/택배" vs "서명요청중/택배"</td><td>3-7</td></tr><tr><td>7</td><td>상품 변경 입력 중 화면의 입력칸 테두리</td><td>Figma는 1px <span class="mono">#333</span>, DS 포커스 상태는 2px <span class="mono">#323da3</span>(3-2). 정책·프로토타입은 DS 기준 — Figma 수정 여부 확인</td><td>3-2, 4-3</td></tr><tr><td>8</td><td>모달 버튼 영역 DS 컴포넌트(<span class="mono">Part/Modal</span>)</td><td>버튼에 최소 폭 150·최대 Fill이 없어 긴 버튼명 화면은 컴포넌트를 끊고 폭을 직접 맞춤(회수 요청 불가 안내 <span class="mono">6655:96491</span>, 버튼 233). 다른 화면에 영향이 커서 변경 보류 — 정책·코드만 규칙 적용</td><td>3-3</td></tr><tr><td>9</td><td>읽기 전용 정보 표·입력 폼 외 제3의 콘텐츠 유형</td><td>현재는 두 유형으로 전 화면 커버</td><td>3-1, 3-2</td></tr><tr><td>10</td><td>구입 주문 상세 <span class="mono">확인 필요</span> 항목</td><td>옵션이 길 때 \'수정 &gt;\' 줄바꿈, 옵션 변경 후 행 이동, 부품 0원, 주문취소 사유 나머지, 주문 후 취소 사유 말줄임, 기타 주문불가 유형, 출고완료·주문완료 결과 화면(미캡처)</td><td>4-5</td></tr></tbody></table>' },
  s38: { title:"3-8. 모바일 간격", html:
    '<p>DS "모바일 정의"의 모바일 간격 규칙. 3-1·3-2·카드 목록을 담는 <strong>컨테이너 여백</strong>이다(컴포넌트 내부 규칙은 각 절 기준).</p><table class="policy-table"><thead><tr><th>대상</th><th>패딩(상 / 좌우)</th><th>간격(gap)</th><th>비고</th></tr></thead><tbody><tr><td>카드 UI 기본</td><td><span class="mono">24px / 16px</span></td><td>—</td><td>예: 대대여 상품 카드</td></tr><tr><td>카드 UI, 상단에 상태값이 붙는 화면</td><td><span class="mono">16px 16px 24px 16px</span></td><td>—</td><td>예: 이용현황 &gt; 주문내역, 출고처리, 주문요청 카드</td></tr><tr><td>카드 목록</td><td>—</td><td>카드 사이 <strong>12px</strong></td><td>건수 영역이 있으면 건수–첫 카드 <strong>0</strong>, 없으면 <strong>20px</strong></td></tr><tr><td>View(상세) 화면</td><td><span class="mono">24px / 20px</span></td><td>4px</td><td>아코디언 섹션은 <span class="mono">8px / 20px</span>, gap 4</td></tr><tr><td>입력 화면</td><td><span class="mono">24px / 20px</span></td><td>24px</td><td>3-2 입력 폼을 담는 컨테이너</td></tr></tbody></table><ul><li>화면 좌우 여백은 <strong>20px</strong>(360 화면 → 콘텐츠 320, 9-1)</li><li>근거: DS Figma <span class="mono">64Q1Re56aiAA8Al89pqjnV</span> "모바일 정의"(<span class="mono">8576:8969</span>)</li></ul>' },
  s39: { title:"3-9. 리스트 본문 — PC 테이블 ↔ 모바일 카드 (적응형)", html:
    '<p>3-7 검색 영역 아래의 목록. PC 테이블과 모바일 카드를 둘 다 두고 1024/1025px에서 표시만 전환한다.</p><p><strong>PC — 탭 줄 + 테이블</strong></p><ul><li>탭 줄: 밑줄 탭(패딩 16/20, 16px SemiBold, 활성 <span class="mono">#1a1a1a</span> + 아래 2px <span class="mono">#333</span>, 비활성 <span class="mono">#999</span>), 줄 아래 1px <span class="mono">#616161</span>. 오른쪽에 <strong>일괄 처리 버튼</strong>(채움 36px, 14px SemiBold) — 체크한 행이 대상, 0건이면 비활성</li><li>테이블: 헤더 높이 52·bg <span class="mono">#f5f5f5</span>·아래 1px <span class="mono">#bdbdbd</span>·14px SemiBold / 행 높이 52·아래 1px <span class="mono">#eee</span>·14px Regular. 셀 안 두 줄 정보는 두 줄까지, 넘치면 말줄임</li><li>체크박스 컬럼 44px, 헤더 체크박스 = 전체 선택, <strong>선택한 행 bg <span class="mono">#eff1fd</span></strong></li><li>정렬: 날짜 컬럼 헤더에 정렬 아이콘(8×16, 기본 <span class="mono">#999</span>, 오름·내림은 해당 삼각형만 <span class="mono">#323da3</span>). 누를 때마다 기본 → 오름차순 → 내림차순</li><li>상태 배지: 높이 24, 12px Medium(Figma 명시값, 6-6 예외)</li><li><strong>컬럼 합이 콘텐츠 폭(1136px)을 넘으면 좌측 고정 + 가로 스크롤</strong>: 좌측 식별 컬럼(예: 체크박스 44 + 바코드 234 + 상품명 162 = 440px)은 고정, 나머지만 가로 스크롤. 스크롤바 높이 2px(트랙 <span class="mono">#eee</span>, 막대 <span class="mono">#333</span>). 표 아래 오른쪽에 "표를 밀어보세요." + 화살표 아이콘(14px <span class="mono">#616161</span>, 위 간격 10). 구현 방식은 자유(표 두 개 분리 또는 <span class="mono">position:sticky</span>)</li><li>표 아래 페이지네이션(3-6)</li></ul><p><strong>모바일 — 탭 + 카드 목록</strong></p><ul><li>탭: 풀폭 균등 분할, 스타일은 PC 탭과 같음, 아래 1px <span class="mono">#eee</span></li><li><strong>스크롤 시 상단</strong>: 목록을 아래로 스크롤하면 상단 GNB(56, 9-1)가 위로 숨고 <strong>탭이 화면 맨 위에 붙어 고정</strong>(<span class="mono">position:sticky; top:0</span>)된다. 위로 스크롤하면 GNB가 바로 다시 나타나고 탭은 그 아래(<span class="mono">top:56px</span>)에 붙는다. 맨 위 근처(GNB 높이 이내)에서는 항상 GNB 표시. 탭 아래 필터칩 줄이 있는 화면은 칩 줄도 탭과 함께 고정. 건수·카드는 스크롤된다</li><li><strong>스크롤바</strong>: 오른쪽 끝에 얇게(3px, <span class="mono">#bdbdbd</span>) — 콘텐츠 폭을 차지하지 않게</li><li>검색 영역(3-7) → 건수(56px) → 카드 목록(카드 사이 12, 3-8)</li><li>카드: 패딩은 3-8, radius 8, 그림자 <span class="mono">0 0 1px rgba(0,0,0,.2), 0 2px 16px rgba(0,0,0,.08)</span>, 줄 간격 6. 내용은 <strong>3줄로 압축</strong> — ① 상태 배지 + 분류 + 모델(16px <span class="mono">#555</span>) ② 식별자 16px Bold ③ 보조 정보 1줄. 나머지 컬럼은 상세 화면에서 보여준다</li><li>누른 카드: bg <span class="mono">#eff1fd</span> + 테두리 1px <span class="mono">#141e76</span>, 그림자 <span class="mono">0 2px 8px rgba(0,0,0,.08), 0 0 .5px rgba(0,0,0,.2)</span></li><li><strong>체크박스·일괄 처리 없음. 카드를 누르면 상세 화면</strong>으로 이동(3-1 읽기 전용 정보 표, 3-8 View 24/20)</li><li>목록 아래 <strong>축약형 페이지네이션</strong>(3-6) — 카드 20개마다 한 페이지</li><li>근거: Figma 입출고 창고 <span class="mono">PC_입고 처리&gt;입고대기_테이블 일부 고정값</span>, 모바일 <span class="mono">입고대기</span>·<span class="mono">입고처리</span></li></ul><p class="proto-ref">→ <span class="mono">list-body-compare-demo.html</span></p>' },
  s310: { title:"3-10. 카드 목록형 (PC·모바일 모두 카드 — 반응형)", html:
    '<p>한 건에 보여줄 정보와 행동(버튼·메모)이 많아 <strong>PC에서도 테이블 대신 카드</strong>를 쓰고, <strong>같은 카드를 폭에 따라 재배치</strong>한다. 기준 화면은 사업소 <strong>수급자 통합관리 목록</strong>. (9-3 상품 카드 그리드와 다름 — 1열 목록)</p><p><strong>화면 구성(위→아래)</strong>: 페이지 타이틀 → 조회 폼 → 구역 구분선("등록 수급자 관리") → 목록 헤더(타이틀 + 건수 배지, 오른쪽 버튼들) → 키워드 검색 + 상세 조건 패널 → 필터 태그 줄 → 결과 정보(검색결과 N명 · 급여 잔액 총액) → 카드 목록 → 페이지네이션</p><ul><li><strong>조회 폼</strong>(공단 조회 — 필터가 아니라 외부 조회 요청): 테두리 2px <span class="mono">#323da3</span> radius 4. 헤더 bg <span class="mono">#eff1fd</span>(아래 1px <span class="mono">#ced2f4</span>, 높이 60, 패딩 12/20) = 돋보기 + "수급자 조회" 16px Bold <span class="mono">#323da3</span>, 오른쪽 "조회 이력" 알약 버튼(bg <span class="mono">#f2fde4</span>, 테두리 <span class="mono">#43a047</span>, 높이 36). 본문 패딩 20, 입력 필드(라벨 위 + 입력) PC 한 줄 3개(가로 20, 세로 16) → 모바일 한 줄 1개. 마지막 "조회" 버튼(모바일 전체폭)</li><li><strong>상세 조건 패널</strong>: 테두리 1px <span class="mono">#bdbdbd</span> radius 4. 위쪽(bg <span class="mono">#fafafa</span>, 패딩 16/20) = 키워드 입력 + "검색", 오른쪽(모바일은 아래 전체폭) "상세 조건 펼치기/접기"(bg <span class="mono">#eee</span>). <strong>기본 접힘</strong>, 열고 닫을 때 <strong>슬라이드 애니메이션</strong>. 본문 = 섹션별(18px SemiBold) 라디오·체크박스(16px) → 초기화(외곽선)·적용(채움)</li><li><strong>필터 태그</strong>: 조건 적용 시 패널 아래 칩. bg <span class="mono">#eff1fd</span>, 14px SemiBold <span class="mono">#141e76</span>, radius 999, 높이 32, 패딩 6/12 + X. <strong>X를 누르면 그 조건만 해제하고 즉시 재조회</strong>, 호버 시 X 강조. 순서 고정: 급여 잔액 → 적용구간 → 대여종료 → 자격상실 제외. 모바일은 줄바꿈</li><li><strong>카드</strong>: 흰 배경, 테두리 1px <span class="mono">#bdbdbd</span>, radius 4, <strong>카드 사이 12</strong>, 본문 패딩 <strong>16 16 24 16</strong><ul><li>헤더(bg <span class="mono">#fafafa</span>, 아래 1px <span class="mono">#eee</span>) = 이름·L번호 + 상태 배지(이름 옆) + 최근 조회 일시(14px <span class="mono">#999</span>, 모바일 16px) + 업데이트 버튼</li><li>본문(간격 16) = 생년월일·성별·연락처(18px) → 정보 항목(라벨 16px <span class="mono">#616161</span> / 값 16px SemiBold, 급여 잔액 <span class="mono">#e53935</span>) → 대여종료 예정 박스(연한 빨강, D-N 강조) → 메모</li><li>하단 행동 영역(위 1px <span class="mono">#eee</span>, 패딩 8/16/16/16) = 버튼들</li><li><strong>PC</strong>: 왼쪽 정보 2행(등급·본인부담률 + 급여 잔액 → 유효기간 + 적용구간), 오른쪽 메모. 줄바꿈되면 적용구간이 마지막 행으로 내려와 대여종료 예정 박스와 붙어 있어야 함</li><li><strong>모바일</strong>: 정보 한 줄에 하나씩(등급·본인부담률 → 급여 잔액 → 유효기간 → 적용구간, 라벨 왼쪽·값 오른쪽 정렬) → 대여종료 예정 박스 → 메모. 버튼은 보조 2개 나란히 + 주 버튼(수급자 상세보기) 전체폭</li></ul></li><li><strong>입력·버튼 크기 PC/모바일 분리</strong>: 같은 컴포넌트라도 모바일에서 크게 — PC 높이 36~40·14px → 모바일 <strong>48·16px</strong>(예: 검색 57×40 → 60×48, 초기화·적용 80×36 → 80×48, 카드 버튼 36 → 48)</li></ul><div class="info-note"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor"/></svg><div><strong>추후 수정 시 새 규칙 적용</strong> — 수급자 화면은 지금 디자인(모바일에서 버튼도 48로 확장)을 그대로 둔다. 다음에 이 화면을 수정할 때는 공통 규칙(3-4)을 적용한다: 버튼은 PC 크기 그대로(SM 36 / MD 48), 하단 고정·바텀시트 하단만 LG 54, 입력칸·셀렉트만 모바일 48·16px(3-2)</div></div><ul><li>모바일 페이지네이션은 축약형(3-6)</li><li>768 프레임은 모바일 레이아웃이 태블릿 폭에서 늘어나는 예시일 뿐 별도 브레이크포인트가 아니다(1번)</li><li>근거: 운영 디자인 Figma <span class="mono">SzCeq0gMiwowoWyOGwqbXt</span> "260824_수급자관리 목록 필터" To-Be <span class="mono">6092:87371</span>(PC <span class="mono">6089:78653</span> / 768 <span class="mono">6092:86248</span> / 360 <span class="mono">6089:81329</span>). 퍼블 모바일 페이지는 이 디자인과 다른 설계라 근거로 쓰지 않음</li></ul><p class="proto-ref">→ <span class="mono">card-list-responsive-demo.html</span> · 퍼블·개발 전달용: <span class="mono">share-recipient-list.html</span></p>' },
  s311: { title:"3-11. 상세 화면 공통 요소", html:
    '<ul><li><strong>정보 표</strong>: PC는 <strong>2쌍/행</strong>(라벨|값|라벨|값), 모바일은 <strong>1쌍/행</strong>(3-1 읽기 전용 정보 표). 라벨 배경 유무는 화면 디자인을 따른다(주문·회수 = 배경 있음, 반품/AS = 없음). 모바일에서만 접을 수 있는 섹션(신청자 정보 등)은 4-1과 같음</li><li><strong>아코디언 섹션</strong>: PC·모바일 모두 접기·펼치기, 헤더 행 배경으로 구분(기본 회색, 강조 <span class="mono">#eff1fd</span>). <strong>제목 영역 좌우 패딩 0</strong> — 안쪽 콘텐츠 패딩과 겹쳐 40px이 되지 않게</li><li><strong>첨부 이미지</strong>: 모바일은 가로 스크롤 썸네일 <strong>100px</strong>, 글자 간격 6, 오른쪽 위 확대 아이콘 → 확대 보기</li><li><strong>목록으로 돌아가기</strong>: 본문 맨 아래 오른쪽 "○○목록" 버튼(PC·모바일 공통, 모바일 여백은 3-4). 모바일은 상단 헤더 뒤로가기도 함께 둔다</li><li><strong>모바일 공통</strong>: 뒤로가기 터치 영역 <strong>48×48</strong> / 연락처는 <strong>tel: 링크</strong> / 하단 고정 버튼은 LG 54 + 흰 그라데이션을 전 화면 동일하게(3-4) / 키보드가 올라와도 하단 고정 버튼이 입력칸을 가리지 않게</li><li>근거: 반품/AS 상세 디자인 + 7/16 디자이너 주석, 주문요청관리·회수관리 상세 Figma</li></ul>' },
  s312: { title:"3-12. 모바일 키보드", html:
    '<p>입력칸이 있는 바텀시트·화면에서 키보드가 올라오고 내려갈 때의 동작. 입력 값별 키보드 종류는 3-2.</p><p>1. <strong>키보드가 올라오면</strong> 바텀시트는 키보드 위에 붙고, <strong>키보드 위 남은 공간 안에서 최대 높이</strong>까지 커진다(3-5). 시트 본문만 스크롤하고 타이틀·하단 버튼은 고정. 입력칸이 가려지면 보이도록 자동 스크롤한다</p><p>2. <strong>하단 버튼</strong>(시트 버튼, 페이지 하단 고정 버튼)은 키보드 위에 붙고, 입력칸을 가리지 않는다(3-11)</p><p>3. <strong>키보드가 닫히는 때</strong>: 선택을 마쳤을 때(검색 결과·옵션 선택), 키보드의 "완료"·"검색" 키, 입력칸 바깥 빈 곳을 눌렀을 때, 시트를 닫았을 때</p><p>4. <strong>검색 결과는 입력하는 대로 자동으로</strong> 보여준다(약 0.3초 간격 갱신 — 키를 누를 때마다 부르지 않음). 오른쪽 <strong>돋보기 버튼</strong>과 키보드 <strong>"검색" 키</strong>는 키보드를 닫는다. 결과를 고르면 입력칸에 값이 들어가고 키보드가 닫히며 확인 버튼이 활성화된다</p><p>5. <strong>엔터 키로 폼을 바로 제출하지 않는다.</strong> 제출은 버튼으로만. 여러 칸 폼은 엔터 키로 다음 칸 이동(3-2)</p><ul><li>근거: Figma 상품 변경 입력 중 <span class="mono">7374:41743</span>(iOS 한글 키보드 높이 211 기준)</li></ul><p class="proto-ref">→ <span class="mono">product-change-sheet-demo.html</span></p>' },
  s9: { title:"9. 운영관리 화면군 (사업소 · 입출고 창고 · 설치파트너)", html:
    '<p>운영관리 앱 3개 — <strong>이로움케어 사업소</strong>(사업소 직원), <strong>입출고 창고</strong>(창고 직원), <strong>설치파트너</strong>(설치업체). 지금은 PC(PHP)와 모바일(별도 React 앱)이 따로 관리되는데, 이 정책의 목표는 2번의 한 페이지 원칙으로 합치는 것이다. 화면을 전부 만들지 않고 <strong>셸(뼈대) + 패턴</strong> 단위로 정리한다.</p><ul><li>기준 디자인: Figma <span class="mono">H8lqlZitePnf5dTDPB5GzR</span>("디자인_대대여 구축"), 돌봄 연동 화면은 운영 디자인 Figma <span class="mono">SzCeq0gMiwowoWyOGwqbXt</span></li><li>참고: 이로움케어 디자인시스템 웹 문서(사내 자료 — 저장소가 공개 배포라 URL은 적지 않음, 담당자에게 요청). Toast·카드 그리드 등은 Figma 단일 화면보다 이 문서 값이 정확하므로 함께 확인</li><li>사업소 <strong>PC</strong>는 아직 구버전 셸(무거운 GNB·SNB·Footer)이며 이 문서에서 반응형 규칙화하지 않는다 — 새 셸로 옮기는 대상. 창고·설치파트너는 새 셸이 이미 배포돼 있다. <strong>모바일 셸은 세 앱 공통</strong></li></ul><h4>9-1. 셸 — PC: 창고·설치파트너 / 모바일: 세 앱 공통</h4><p><strong>PC</strong></p><ul><li><strong>GNB</strong> 56px, bg <span class="mono">#323da3</span>: 왼쪽 햄버거 40×40 + 흰 로고 94×24, 오른쪽 "공지사항"(14px SemiBold 흰색) + 아바타 32</li><li><strong>SideNav</strong> 240px, bg <span class="mono">#f5f5f5</span>, 패딩 24/16: 상위 메뉴 42px(16px Bold + chevron), 하위 메뉴 40px(16px Regular + 불릿), 선택된 하위 메뉴 bg <span class="mono">#e3e5f5</span> + 글자 <span class="mono">#323da3</span>, 하단 카피라이트 12px</li><li><strong>콘텐츠</strong> 컨테이너 1200 − 패딩 32 = <strong>1136px</strong>(1번)</li><li><strong>SideNav 접기·펼치기</strong>(1440px 이상): GNB 햄버거를 누르면 SideNav가 왼쪽으로 <strong>슬라이드되며 숨고</strong> 콘텐츠가 넓어진다. 다시 누르면 나타난다. 햄버거 아이콘도 함께 바뀐다 — 펼침은 세 줄 같은 길이, 숨김은 <strong>가운데 줄만 왼쪽 기준 절반 길이</strong>(<span class="mono">scaleX(.5)</span>, 0.3s)</li><li>1025~1439px은 SideNav 오버레이 + 콘텐츠 최소 1440 가로 스크롤(1번). 사업소는 1199px 기준</li></ul><p><strong>모바일</strong></p><ul><li><strong>GNB</strong> 56px, bg <span class="mono">#323da3</span>: 왼쪽 흰 페이지 타이틀, 오른쪽 <strong>햄버거 48×48</strong> → 전체메뉴</li><li><strong>전체메뉴</strong>(전체화면 오버레이): 헤더 56px(흰 배경, "전체메뉴" 20px Bold, 오른쪽 <strong>홈·닫기</strong> 각 48×48) → 프로필(아바타 48 + 사업소명 18px SemiBold + 로그아웃 회색 채움 버튼 bg <span class="mono">#eee</span>/글자 <span class="mono">#555</span>/높이 36) → 구분선 8px <span class="mono">#f5f5f5</span> → 메뉴 목록(항목 48px, 간격 4, 16px Bold, 활성 표시 없음) → "이로움케어 메인 바로가기" 카드(bg <span class="mono">#f2fde4</span>, radius 16, 패딩 20) → 하단 카피라이트(14px <span class="mono">#999</span>, 화면 하단 고정)</li><li><strong>홈 버튼은 3depth부터</strong> 노출. 입력 페이지, 저장 등 액션이 필요한 페이지에서 다음 depth로 들어간 경우는 노출하지 않음</li><li>콘텐츠: 360 화면 → 좌우 20 → 320</li><li>Figma 화면 하단의 <span class="mono">System_navigation</span>(최근앱·홈·뒤로가기)과 위쪽 상태바는 <strong>OS 목업</strong>이다 — 구현 대상 아님</li><li>근거: Figma 입출고 창고 <span class="mono">입고대기</span>·<span class="mono">상품별재고</span>, 전체메뉴 <span class="mono">4417:89360</span>(사업소) / DS "모바일 정의" 내비게이션 규칙. 설치파트너 모바일 GNB는 같은 구조로 추정(직접 재확인 전)</li></ul><p class="proto-ref">→ <span class="mono">shell-sidenav-demo.html</span></p><h4>9-2. 기존 규칙 재사용</h4><p>대표 화면을 확인한 결과 아래는 3장 규칙 그대로 적용된다.</p><table class="policy-table"><thead><tr><th>화면</th><th>쓰는 규칙</th></tr></thead><tbody><tr><td>상세(<span class="mono">주문상세_주문완료상태_침대</span>)</td><td>읽기 전용 정보 표(3-1) + 입력 폼(3-2) + 버튼(3-4)</td></tr><tr><td>주문 신청 폼(<span class="mono">대대여 주문서 신청</span>)</td><td>입력필드형(3-2) — <span class="mono">Textfield</span>, <span class="mono">SelectField</span>, <span class="mono">Option_List</span></td></tr><tr><td>이용현황(<span class="mono">대대여 이용현황-주문내역</span>)</td><td>탭 + 세그먼트 + 목록 + 페이지네이션(3-6)</td></tr><tr><td>정산(<span class="mono">대대여 정산내역_월별</span>)</td><td>읽기 전용 정보 표(3-1) + 탭 + 검색 + 페이지네이션</td></tr><tr><td>계약서·입고처리 등 테이블 모달</td><td>3-3 테이블형(600·800)</td></tr></tbody></table><ul><li><strong>라벨 폭은 앱마다 다를 수 있다</strong>: 소비자·사업소 125px, 설치파트너 상세 160px. 공식(3-2)은 같고 라벨 상수만 다르니 해당 앱 화면에서 확인한다</li></ul><h4>9-3. 신규 패턴</h4><p><strong>① 상품 카드 그리드</strong>(<span class="mono">대대여 상품_리스트_침대</span>) — PC·모바일 모두 카드인 그리드(3-10의 1열 목록과 다름)</p><ul><li>PC: <strong>4×3(12개)</strong> 고정 그리드, 간격 세로 40 / 가로 20, 페이지네이션</li><li>모바일: <strong>2×2</strong> 그리드, 간격 세로 32 / 가로 16, 페이지네이션 없이 <strong>무한 스크롤</strong></li><li>카드: 상품명 + 해시태그 → 급여가(월)(회색 라벨) → 이용료(월)(브랜드색 라벨, 변동 가능하면 "~") → 재고·단종 배지(일시품절 빨강, 급여탈락예정 파랑, 단종예정 초록 등, 없으면 배지 없음). 상품정보·가격 최대 3줄, 상세정보 최대 5줄, 버튼 권장 2개·최대 3개</li><li>→ <span class="mono">card-grid-list-demo.html</span></li></ul><p><strong>② Toast 알림</strong> — 결과 알림(저장·취소 완료, 실패 등)</p><ul><li>쓰는 종류는 <strong>Success·Error 두 개</strong>(Default·보조 설명 줄은 쓰지 않음)<ul><li>Success: bg <span class="mono">#e8f5e9</span> / 테두리 <span class="mono">#43a047</span> / 체크 아이콘 <span class="mono">#166534</span></li><li>Error: bg <span class="mono">#ffebee</span> / 테두리 <span class="mono">#e53935</span> / 원형 X 아이콘 <span class="mono">#e53935</span></li></ul></li><li>구조: 높이 62, 패딩 8/16, radius 8, 테두리 1px, 아이콘 24 + 간격 8 + 본문 16px SemiBold <span class="mono">#1a1a1a</span>, 그림자 <span class="mono">0 2px 4px rgba(0,0,0,.12), 0 0 2px rgba(0,0,0,.12)</span>. 오른쪽 닫기(X) 24 선택 사용</li><li>위치: 화면 하단 가운데, 아래 여백 PC 48 / 모바일 28, <span class="mono">z-index:900</span>. 폭 PC <strong>520</strong> 고정 / 모바일 화면폭 <strong>80%</strong></li><li>닫기 버튼이 없으면 <strong>2초 뒤 자동으로 사라지고</strong>, 있으면 X를 누를 때까지 유지. 여러 개는 새 것이 위로 쌓임(<span class="mono">column-reverse</span>)</li><li>근거: DS <span class="mono">Toast</span>(<span class="mono">64Q1Re56aiAA8Al89pqjnV</span> <span class="mono">7987:8847</span>), 크기·위치는 DS 웹 문서</li><li>→ <span class="mono">toast-notification-demo.html</span></li></ul><p><strong>③ 월간 캘린더</strong>(<span class="mono">PC_설치업체&gt;캘린더</span>) — <strong>반응형</strong>(같은 7열 표를 폭에 따라 좁힘)</p><ul><li>PC: 콘텐츠 1136을 7등분(칸 약 162×130). 칸 = 날짜 원 32(14px SemiBold) + 일정 알약(전체폭, radius 2, 패딩 4/2) — 설치 bg <span class="mono">#e3e5f5</span>/글자 <span class="mono">#323da3</span>, 회수 bg <span class="mono">#ffebee</span>/글자 <span class="mono">#e53935</span>, 라벨 12px Medium + 건수 배지(해당 색 채움, 흰 글자). 날짜 원: 이번 달 <span class="mono">#616161</span>, 다른 달 <span class="mono">#bdbdbd</span>, 오늘 bg <span class="mono">#90ee02</span></li><li>PC와 모바일 차이<table class="policy-table"><thead><tr><th>요소</th><th>PC</th><th>모바일</th></tr></thead><tbody><tr><td>월 이동</td><td>왼쪽 정렬, 버튼 40×40, 월 20px Heavy</td><td><strong>가운데 정렬</strong>, 버튼 48×48·사이 48, 20px Bold</td></tr><tr><td>범례(설치요청 N · 회수요청 N)</td><td>월 이동과 같은 줄 오른쪽</td><td><strong>아래 줄</strong> 오른쪽(위 간격 20)</td></tr><tr><td>팀 필터 셀렉트</td><td>있음</td><td><strong>없음</strong></td></tr><tr><td>요일 줄 높이 / 칸 테두리 / 날짜 아래 간격</td><td>32 / 사방 1px <span class="mono">#f5f5f5</span> / 12</td><td>22 / <strong>아래만</strong> / 8</td></tr></tbody></table></li><li>칸을 누르면 그 날짜의 <strong>배정 리스트</strong>로 이동. 모바일 캘린더는 배정 리스트에서 들어오는 하위 화면(상단 뒤로가기 + "캘린더")</li><li>알약·배지 크기(12px, 10px)는 Figma 명시값이라 6-6 예외</li><li>근거: Figma 설치파트너 캘린더, 모바일 <span class="mono">252:13805</span></li><li>→ <span class="mono">calendar-compare-demo.html</span></li></ul><p><strong>④ 지도 + 리스트</strong>(<span class="mono">PC_설치업체&gt;배정리스트</span>, <span class="mono">지도 확대</span>)</p><ul><li>PC: 지도 위 마커(36×36), 오른쪽에 <strong>떠 있는 리스트 패널</strong>(722px, 둥근 모서리, 검색 + 테이블). 왼쪽 아래 범례(설치·회수·미배정), 왼쪽 위 확대 버튼(42×42). 콘텐츠 안 임베드(1136×600)와 SideNav 없는 전체화면(지도 확대) 두 형태</li><li>모바일: 지도가 화면을 채우고 그 위에 <strong>끌어 올리는 하단 리스트 패널</strong>(<span class="mono">bottom_List</span>, 높이 가변)</li></ul><p><strong>⑤ 사진 업로드 그리드</strong>(<span class="mono">설치일정 상세</span>): 88×88 정사각 썸네일 가로 나열, 각 오른쪽 위 X(삭제), 첫 칸은 "사진 추가", 최대 10장</p><ul><li>좌측 고정 + 가로 스크롤 테이블은 3-9 규칙으로 옮김</li></ul><h4>9-4. 반품 / A/S (사업소 돌봄 화면)</h4><ul><li><strong>기준 디자인</strong>: Figma <span class="mono">SzCeq0gMiwowoWyOGwqbXt</span> "260417_[돌봄] 반품A/S 관리"(<span class="mono">935:158</span>). 모바일은 7/16 검수 수정본(<span class="mono">3808:38297</span>)이 최신. 반품과 A/S는 구조가 같아 반품을 기준으로 보고 A/S는 차이만 확인</li><li><strong>구현 방식</strong>: 디자인은 PC·모바일을 별도 화면(적응형)으로 그렸지만, 사업소 화면이므로 <strong>한 페이지 원칙</strong>(2번)으로 만든다 — 목록은 테이블·카드를 둘 다 두고 표시 전환, 상세는 반응형</li><li><strong>모바일 상단</strong>: Figma의 소비자 GNB(로고·상품 검색·판매/대여 탭)는 쓰지 않고 <strong>9-1 모바일 셸</strong>을 쓴다</li><li><strong>확인 결과</strong>(목록·상세·팝업): 3-6·3-7·3-9·3-11·3-3 규칙과 일치. 이 디자인에서 채택한 공통 규칙 — 칩 표기 "이름 : 값"(3-7), 상세 공통 요소(3-11), 입력형 팝업의 모바일 바텀시트(3-3)<ul><li>화면별 차이(규칙 위반 아님): 모바일 검색 시트 기간 버튼 6개(3열 × 2줄), 진행상태는 버튼 대신 셀렉트</li><li>새 패턴 후보: 목록 빈 화면(일러스트 + "조회된 데이터가 없습니다.")</li><li>7/16 디자이너 주석 중 var state = { activeId:null, openCategory:"common-pattern" };

function toggleCategory(cat){
  state.openCategory = (state.openCategory === cat) ? null : cat;
  renderMenu();
}
function renderMenu(){
  var html = '';
  CATEGORY_ORDER.forEach(function(cat, catIdx){
    var items = PROTOS.filter(function(p){ return p.category === cat; });

    html += '<button class="menu-group-header'+(isOpen?' open':'')+'" onclick="toggleCategory(\''+cat+'\')">'+
      '<span>'+CATEGORY_LABEL[cat]+' <span class="count">('+items.length+')</span></span>'+
      '<span class="chev">›</span></button>';

    items.forEach(function(p){
      html += '<button class="menu-item'+(p.sub?' sub':'')+(state.activeId===p.id?' active':'')+'" onclick="selectProto(\''+p.id+'\')">'+
        '<span class="menu-text"><div class="menu-title">'+p.title+'</div><div class="menu-desc">'+p.desc+'</div></span>'+
        '</button>';

function renderStage(){

/* 조항 본문에 나오는 프로토타입 파일명(→ xxx.html) — 화면으로 확인 버튼으로 바꿈 */
var PLAY_ICON = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>';
function protoTitle(id){ var p = PROTOS.find(function(x){ return x.id === id; }); return p ? p.title : id; }
function sectionProtos(sid){
  var out = [], re = /<span class="mono">([\w-]+\.html)<\/span>/g, m;
  while((m = re.exec(SECTIONS[sid].html))){ if(PROTOS.some(function(x){ return x.id === m[1]; }) && out.indexOf(m[1]) < 0) out.push(m[1]); }
  return out;
}
function sectionCard(sid, isPrimary){
  var s = SECTIONS[sid], protos = sectionProtos(sid).filter(function(f){ return f !== state.activeId; }); /* 지금 보는 화면은 빼고 */
  var body = s.html.replace(/<span class="mono">([\w-]+\.html)<\/span>/g, function(all, f){
    if(!PROTOS.some(function(x){ return x.id === f; })) return all;
    var cur = f === state.activeId;
    return '<button type="button" class="see-chip'+(cur?' current':'')+'"'+(cur?' title="지금 보고 있는 화면"':' onclick="openProtoPop([\''+f+'\'],0)"')+'>'+PLAY_ICON+protoTitle(f)+'</button>';
  });
  var list = '['+protos.map(function(f){ return '\''+f+'\''; }).join(',')+']';
  return '<div class="p-section'+(isPrimary?' primary':'')+'">'+
    '<div class="p-section-card" data-slug="'+secSlug(sid)+'">'+
    '<span class="p-tag'+(isPrimary?'':' secondary')+'">'+(isPrimary?'핵심 규칙':'함께 참고')+'</span>'+
    '<div class="p-card-head"><h3>'+s.title+'</h3><div class="p-card-acts">'+
    (protos.length ? '<button type="button" class="see-btn" onclick="openProtoPop('+list+',0)" title="이 조항을 구현한 화면을 팝업으로 열어 직접 조작해 봅니다">'+PLAY_ICON+'화면으로 확인</button>' : '')+
    '<button type="button" class="card-link" onclick="copyLink(\''+secSlug(sid)+'\')" title="이 조항으로 바로 열리는 링크를 복사합니다">'+LINK_ICON+'링크</button></div></div>'+body+
    '</div></div>';
}

/* ---------------- 화면으로 확인 팝업 (프로토타입 iframe) — 2026-10-02 ---------------- */
var PP_WIDTHS = [360, 768, 1024, 1025, 1440];
var ppOverlay = document.getElementById('ppOverlay'), ppFrame = document.getElementById('ppFrame');
function ppFindBtn(w){
  try {
    var d = ppFrame.contentDocument; if(!d) return null;
    return d.querySelector('[data-w="'+w+'"]') || Array.prototype.find.call(d.querySelectorAll('button'), function(b){ return b.textContent.trim().replace(/px$/, '') === String(w); }) || null;
  } catch(e){ return null; }
}
function openProtoPop(list, idx){
  var f = list[idx];
  document.getElementById('ppTitle').textContent = '화면으로 확인 — ' + protoTitle(f);
  var tabs = document.getElementById('ppTabs');
  tabs.innerHTML = list.length > 1 ? list.map(function(x, i){ return '<button type="button" class="'+(i === idx ? 'on' : '')+'" data-i="'+i+'">'+protoTitle(x)+'</button>'; }).join('') : '';
  tabs.querySelectorAll('button').forEach(function(b){ b.onclick = function(){ openProtoPop(list, +b.dataset.i); }; });
  var tools = document.getElementById('ppTools'); tools.innerHTML = '';
  ppFrame.onload = function(){
    var has = PP_WIDTHS.filter(function(w){ return ppFindBtn(w); });
    tools.innerHTML = has.map(function(w){ return '<button type="button" data-w="'+w+'">'+w+'</button>'; }).join('') +
      '<a href="prototypes/'+f+'" target="_blank" rel="noopener">새 탭</a>';
    tools.querySelectorAll('button').forEach(function(b){ b.onclick = function(){
      var t = ppFindBtn(b.dataset.w); if(t) t.click();
      tools.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on', x === b); });
    }; });
  };
  ppFrame.src = 'prototypes/' + f;
  ppOverlay.hidden = false;
}
function closeProtoPop(){ if(ppOverlay.hidden) return; ppOverlay.hidden = true; ppFrame.removeAttribute('src'); }
document.getElementById('ppClose').addEventListener('click', closeProtoPop);
ppOverlay.addEventListener('click', function(e){ if(e.target === ppOverlay) closeProtoPop(); });

function renderPolicy(){

      '<div class="related-body" id="relatedBody">'+

/* ---------------- 공유 링크 (#화면이름 · #조항번호) — 2026-09-30 ---------------- */
var LINK_ICON = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
function protoSlug(id){ return id.replace(/\.html$/, ''); }
function secSlug(sid){ var m = SECTIONS[sid].title.match(/^([\d-]+)\./); return m ? m[1] : sid; }
function showToast(msg){
  var t = document.getElementById('copyToast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(function(){ t.classList.remove('show'); }, 2000);
}
function copyLink(hash){
  var url = location.origin + location.pathname + '#' + hash;
  function fallback(){
    var ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); showToast('링크가 복사되었어요'); } catch(e){ window.prompt('아래 링크를 복사하세요', url); }
    ta.remove();
  }
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(url).then(function(){ showToast('링크가 복사되었어요'); }, fallback);
  } else { fallback(); }
}
function route(){
  var h = decodeURIComponent(location.hash.slice(1));
  if(!h){ closeDocModal(); goHome(true); return; }
  var p = PROTOS.find(function(x){ return protoSlug(x.id) === h; });
  if(p){ closeDocModal(); selectProto(p.id, true); return; }
  var sid = Object.keys(SECTIONS).find(function(k){ return secSlug(k) === h; });
  if(sid){ if(!state.activeId && document.getElementById('homeView').hidden) goHome(true); openDocModal(h); return; }
  goHome(true);
}
window.addEventListener('popstate', route);

/* ---------------- 검색 (조항 번호 · 본문 · 화면) — 2026-09-30 ---------------- */
var pendingTerm = null;
var SEARCH_INDEX = null;
function stripHtml(h){ var d = document.createElement('div'); d.innerHTML = h; return d.textContent.replace(/\s+/g, ' ').trim(); }
function buildIndex(){
  SEARCH_INDEX = Object.keys(SECTIONS).map(function(k){
    return { kind:'조항', slug:secSlug(k), title:SECTIONS[k].title, text:stripHtml(SECTIONS[k].html) };
  }).concat(PROTOS.map(function(p){
    return { kind:'화면', slug:protoSlug(p.id), id:p.id, title:p.title, text:p.desc + ' ' + p.id };
  }));
}
function esc(t){ return t.replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function hl(t, q){ var i = t.toLowerCase().indexOf(q.toLowerCase()); if(i < 0) return esc(t); return esc(t.slice(0, i)) + '<mark>' + esc(t.slice(i, i + q.length)) + '</mark>' + esc(t.slice(i + q.length)); }
function snippet(t, q){
  var i = t.toLowerCase().indexOf(q.toLowerCase());
  if(i < 0) return esc(t.slice(0, 90)) + (t.length > 90 ? '…' : '');
  var a = Math.max(0, i - 36), b = Math.min(t.length, i + q.length + 54);
  return (a > 0 ? '…' : '') + hl(t.slice(a, b), q) + (b < t.length ? '…' : '');
}
function doSearch(q){
  if(!SEARCH_INDEX) buildIndex();
  q = q.trim(); if(!q) return [];
  var lq = q.toLowerCase();
  return SEARCH_INDEX.map(function(it){
    var score = 0, tl = it.title.toLowerCase(), xl = it.text.toLowerCase();
    if(it.kind === '조항' && it.slug === q) score += 1000;               /* "4-4" 번호 정확히 */
    else if(it.kind === '조항' && tl.indexOf(q + '.') === 0) score += 900;
    if(tl.indexOf(lq) >= 0) score += 100;
    var n = 0, from = 0; while((from = xl.indexOf(lq, from)) >= 0){ n++; from += lq.length; }
    score += Math.min(n, 20) * 5;
    return { it:it, score:score };
  }).filter(function(r){ return r.score > 0; }).sort(function(a, b){ return b.score - a.score; }).slice(0, 12);
}
var searchInput = document.getElementById('siteSearch');
var searchBox = document.getElementById('searchResults');
var searchSel = 0, searchRes = [];
function renderSearch(){
  var q = searchInput.value.trim();
  if(!q){ searchBox.hidden = true; return; }
  searchRes = doSearch(q); searchSel = 0;
  searchBox.innerHTML = searchRes.length ? searchRes.map(function(r, i){
    return '<button type="button" role="option" class="sr-item' + (i === 0 ? ' active' : '') + '" data-i="' + i + '">' +
      '<div class="sr-top"><span class="sr-kind">' + r.it.kind + '</span><span>' + hl(r.it.title, q) + '</span></div>' +
      '<div class="sr-snip">' + snippet(r.it.text, q) + '</div></button>';
  }).join('') : '<div class="sr-empty">"' + esc(q) + '"에 맞는 결과가 없어요</div>';
  searchBox.hidden = false;
}
function pickSearch(i){
  var r = searchRes[i]; if(!r) return;
  var q = searchInput.value.trim();
  searchBox.hidden = true; searchInput.blur();
  if(r.it.kind === '화면'){ closeDocModal(); selectProto(r.it.id); return; }
  pendingTerm = (q === r.it.slug) ? null : q;
  if(location.hash.slice(1) !== r.it.slug) history.pushState(null, '', '#' + r.it.slug);
  openDocModal(r.it.slug);
}
function markTerm(root, q){
  var lq = q.toLowerCase(), first = null, walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT), nodes = [];
  while(walker.nextNode()) if(walker.currentNode.nodeValue.toLowerCase().indexOf(lq) >= 0) nodes.push(walker.currentNode);
  nodes.forEach(function(node){
    var v = node.nodeValue, i = v.toLowerCase().indexOf(lq), frag = document.createDocumentFragment(), last = 0;
    while(i >= 0){
      frag.appendChild(document.createTextNode(v.slice(last, i)));
      var m = document.createElement('mark'); m.textContent = v.slice(i, i + q.length); frag.appendChild(m);
      if(!first) first = m;
      last = i + q.length; i = v.toLowerCase().indexOf(lq, last);
    }
    frag.appendChild(document.createTextNode(v.slice(last)));
    node.parentNode.replaceChild(frag, node);
  });
  return first;
}
searchInput.addEventListener('input', renderSearch);
searchInput.addEventListener('focus', function(){ if(searchInput.value.trim()) renderSearch(); });
searchInput.addEventListener('keydown', function(e){
  var items = searchBox.querySelectorAll('.sr-item');
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
    if(!items.length) return; e.preventDefault();
    items[searchSel].classList.remove('active');
    searchSel = (searchSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
    items[searchSel].classList.add('active'); items[searchSel].scrollIntoView({block:'nearest'});
  } else if(e.key === 'Enter'){ e.preventDefault(); pickSearch(searchSel); }
  else if(e.key === 'Escape'){ searchBox.hidden = true; searchInput.blur(); }
});
searchBox.addEventListener('mousedown', function(e){ var b = e.target.closest('.sr-item'); if(b){ e.preventDefault(); pickSearch(+b.dataset.i); } });
document.addEventListener('click', function(e){ if(!e.target.closest('.search-wrap')) searchBox.hidden = true; });
document.addEventListener('keydown', function(e){
  if((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k'){ e.preventDefault(); searchInput.focus(); searchInput.select(); }
});
if(!/Mac|iPhone|iPad/.test(navigator.platform)) document.getElementById('searchKbd').textContent = 'Ctrl K';

function selectProto(id, fromRoute){
  if(!fromRoute && location.hash.slice(1) !== protoSlug(id)) history.pushState(null, '', '#' + protoSlug(id));
  state.activeId = id;
  var p = PROTOS.find(function(x){ return x.id === id; });
  state.openCategory = p.category; /* 선택한 항목의 대카테고리를 자동으로 펼침 */
  document.getElementById('homeView').hidden = true;
  document.getElementById('bodyGrid').hidden = false;
  document.getElementById('homeGrid').innerHTML = ''; /* 썸네일 iframe 정리 */
  renderMenu(); renderStage(); renderPolicy();
}

/* ---------------- 전체 문서 모달 ---------------- */
var docModalOverlay = document.getElementById('docModalOverlay');
function openDocModal(slug){
  var body = document.getElementById('docModalBody');
  body.innerHTML = FULL_DOC_ORDER.map(function(sid){ return sectionCard(sid, false); }).join('');
  docModalOverlay.hidden = false;
  if(typeof slug === 'string'){
    var card = body.querySelector('.p-section-card[data-slug="' + slug + '"]');
    if(card){
      var first = pendingTerm ? markTerm(card, pendingTerm) : null;
      (first || card).scrollIntoView({block: first ? 'center' : 'start'});
      card.classList.add('flash'); setTimeout(function(){ card.classList.remove('flash'); }, 1600);
    }
  }
  pendingTerm = null;
}
function closeDocModal(){
  if(docModalOverlay.hidden) return;
  docModalOverlay.hidden = true;
  /* 조항 링크(#3-3)로 열린 경우 닫으면 주소를 현재 화면 기준으로 되돌림 */
  var h = decodeURIComponent(location.hash.slice(1));
  if(h && Object.keys(SECTIONS).some(function(k){ return secSlug(k) === h; })){
    history.replaceState(null, '', state.activeId ? '#' + protoSlug(state.activeId) : location.pathname);
  }
}
document.getElementById('toggleFullDoc').addEventListener('click', function(){ openDocModal(); });
document.getElementById('docModalClose').addEventListener('click', closeDocModal);
docModalOverlay.addEventListener('click', function(e){ if(e.target === docModalOverlay) closeDocModal(); });
document.addEventListener('keydown', function(e){ if(e.key !== 'Escape') return; if(!ppOverlay.hidden){ closeProtoPop(); return; } if(!docModalOverlay.hidden) closeDocModal(); });

/* ---------------- 홈 화면 (카테고리별 프로토타입 카드 그리드) ---------------- */
function renderHome(){
  var html = '';
  CATEGORY_ORDER.forEach(function(cat){
    var items = PROTOS.filter(function(p){ return p.category === cat; });
    if(!items.length) return;
    html += '<div class="gallery-group-label">'+CATEGORY_LABEL[cat]+' ('+items.length+')</div><div class="gallery-grid">';

    html += '</div>';

function goHome(fromRoute){
  if(!fromRoute && location.hash) history.pushState(null, '', location.pathname);

  document.getElementById('bodyGrid').hidden = true;
  document.getElementById('homeView').hidden = false;

document.getElementById('brandHome').addEventListener('click', function(e){ if(e.metaKey || e.ctrlKey || e.shiftKey) return; e.preventDefault(); closeDocModal(); goHome(); });
document.getElementById('homeBackBtn').addEventListener('click', function(){ goHome(); });
document.getElementById('stageCopy').addEventListener('click', function(){ if(state.activeId) copyLink(protoSlug(state.activeId)); });
document.getElementById('homeDocCard').addEventListener('click', openDocModal);

/* ---------------- 우측 패널 드래그 리사이즈 ---------------- */
(function(){
  var bodyGrid = document.getElementById('bodyGrid');
  var handle = document.getElementById('resizeHandle');
  var protoFrame = document.getElementById('protoFrame');
  var MIN_W = 300, MAX_W = 760;
  var saved;
  try{ saved = localStorage.getItem('policyPanelWidth'); }catch(e){}
  if(saved){ bodyGrid.style.setProperty('--policy-w', saved + 'px'); }

  var dragging = false, startX = 0, startW = 0;
  function currentWidth(){
    var v = getComputedStyle(bodyGrid).getPropertyValue('--policy-w').trim();
    return parseInt(v, 10) || 400;
  }
  function onMove(e){
    if(!dragging) return;
    var x = e.touches ? e.touches[0].clientX : e.clientX;
    var delta = startX - x; // 왼쪽으로 끌면 패널이 넓어짐
    var maxAllowed = Math.min(MAX_W, Math.round(window.innerWidth * 0.6));
    var w = Math.max(MIN_W, Math.min(maxAllowed, startW + delta));
    bodyGrid.style.setProperty('--policy-w', w + 'px');
  }
  function onUp(){
    if(!dragging) return;
    dragging = false;
    handle.classList.remove('dragging');
    document.body.style.userSelect = '';
    if(protoFrame) protoFrame.style.pointerEvents = '';
    try{ localStorage.setItem('policyPanelWidth', currentWidth()); }catch(e){}
  }
  function onDown(e){
    dragging = true;
    startX = e.touches ? e.touches[0].clientX : e.clientX;
    startW = currentWidth();
    handle.classList.add('dragging');
    document.body.style.userSelect = 'none';
    if(protoFrame) protoFrame.style.pointerEvents = 'none';
    e.preventDefault();
  }
  handle.addEventListener('mousedown', onDown);
  handle.addEventListener('touchstart', onDown, {passive:false});
  window.addEventListener('mousemove', onMove);
  window.addEventListener('touchmove', onMove, {passive:false});
  window.addEventListener('mouseup', onUp);
  window.addEventListener('touchend', onUp);
})();

route();
