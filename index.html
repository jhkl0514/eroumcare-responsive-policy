<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/static/woff2/SUIT.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이로움케어 반응형 정책 — 프로토타입 허브</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=7">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=7">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=5">
<style>
  :root{
    --bg:#f5f6f8; --bg-elevated:#ffffff; --bg-sunken:#eef0f3;
    --border:#e2e5ea; --border-strong:#cbd0d8;
    --text:#1c2128; --text-secondary:#5b6472; --text-tertiary:#8890999;
    --accent:#3d5afe; --accent-soft:#eef0ff; --accent-text:#2a3fd6;
    --code-bg:#f1f2f6; --code-text:#c0392b;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.06);
    --radius:10px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#15171c; --bg-elevated:#1c1f26; --bg-sunken:#12141a;
      --border:#2a2e37; --border-strong:#3a3f4b;
      --text:#e7e9ee; --text-secondary:#a2a9b6; --text-tertiary:#767d8a;
      --accent:#8ba3ff; --accent-soft:#20264a; --accent-text:#aebcff;
      --code-bg:#22252d; --code-text:#ff9d8a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'SUIT',-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Segoe UI",Roboto,sans-serif;
    font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
  }
  .app{height:100vh; display:flex; flex-direction:column;}

  /* ---------- Topbar ---------- */
  .topbar{
    height:60px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
    padding:0 20px; background:var(--bg-elevated); border-bottom:1px solid var(--border);
    box-shadow:var(--shadow); z-index:5;
  }
  .brand{display:flex; align-items:center; gap:10px; color:inherit; text-decoration:none; border-radius:8px; padding:4px 8px 4px 4px; margin-left:-4px;}
  .brand:hover{background:var(--bg-sunken);}
  .brand .logo{flex:0 0 auto; display:block;}
  .brand h1{font-size:15px; font-weight:700; margin:0; letter-spacing:-.01em;}
  .brand .sub{font-size:12px; color:var(--text-secondary); margin-left:8px; font-weight:400;}
  .top-actions{display:flex; align-items:center; gap:8px;}
  /* ---------- 검색 (2026-09-30) ---------- */
  .search-wrap{position:relative;}
  .search-box{display:flex; align-items:center; gap:8px; width:340px; height:36px; padding:0 10px; border:1px solid var(--border);
    border-radius:8px; background:var(--bg-sunken); color:var(--text-tertiary);}
  .search-box:focus-within{border-color:var(--accent); background:var(--bg-elevated);}
  .search-box input{flex:1 1 auto; min-width:0; border:0; outline:0; background:transparent; color:var(--text); font:inherit; font-size:13px;}
  .search-box kbd{font:inherit; font-size:11px; color:var(--text-tertiary); border:1px solid var(--border); border-radius:4px; padding:1px 5px;}
  .search-results{position:absolute; top:42px; right:0; width:460px; max-height:70vh; overflow-y:auto; background:var(--bg-elevated);
    border:1px solid var(--border); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.18); padding:6px; z-index:50;}
  .search-results[hidden]{display:none;}
  .sr-item{display:block; width:100%; text-align:left; font:inherit; color:var(--text); background:none; border:0; border-radius:8px; padding:9px 10px; cursor:pointer;}
  .sr-item.active, .sr-item:hover{background:var(--accent-soft);}
  .sr-top{display:flex; align-items:center; gap:8px; font-size:13px; font-weight:700;}
  .sr-kind{flex:0 0 auto; font-size:11px; font-weight:700; color:var(--accent-text); background:var(--accent-soft); border-radius:4px; padding:1px 6px;}
  .sr-item.active .sr-kind, .sr-item:hover .sr-kind{background:var(--bg-elevated);}
  .sr-snip{font-size:12px; color:var(--text-secondary); margin-top:3px; line-height:1.5;}
  .sr-empty{font-size:13px; color:var(--text-tertiary); padding:14px 10px;}
  mark{background:#ffe58a; color:#1a1a1a; border-radius:2px; padding:0 1px;}  /* 다크 모드에서도 읽히게 글자색 고정 */
  .mono mark, code mark{color:#1a1a1a;}
  @media (max-width: 980px){ .search-box{width:200px;} .search-results{width:min(460px, calc(100vw - 32px));} }
  .doc-link{
    font-size:12.5px; color:var(--text-secondary); text-decoration:none; padding:7px 12px;
    border:1px solid var(--border); border-radius:8px; background:var(--bg-sunken);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:inherit;
  }
  .doc-link:hover{border-color:var(--border-strong); color:var(--text);}

  /* ---------- Shell: 좌측 메뉴(항상 노출) + 메인 영역(홈/상세 전환) ---------- */
  .shell{flex:1 1 auto; display:flex; min-height:0;}
  .main-area{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; min-height:0;}

  /* ---------- Body grid (상세 화면: 스테이지 + 정책 패널) ---------- */
  .body{flex:1 1 auto; display:grid; --policy-w:400px; grid-template-columns:1fr 6px var(--policy-w); grid-template-rows:minmax(0,1fr); min-height:0;}
  .body[hidden]{ display:none; }

  /* 우측 정책 패널 리사이즈 핸들 */
  .resize-handle{
    cursor:col-resize; background:transparent; position:relative; z-index:4;
  }
  .resize-handle::after{
    content:""; position:absolute; top:0; bottom:0; left:2px; width:2px; background:var(--border);
  }
  .resize-handle:hover::after, .resize-handle.dragging::after{ background:var(--accent); }
  .resize-handle.dragging{ background:color-mix(in srgb, var(--accent) 8%, transparent); }

  /* ---------- Left menu (항상 노출 — 홈/상세 화면 공통) ---------- */
  .sidebar-menu{
    width:220px; flex:0 0 220px;
    border-right:1px solid var(--border); background:var(--bg-elevated);
    overflow-y:auto; padding:14px 10px;
  }
  .menu-group-header{
    display:flex; align-items:center; justify-content:space-between; width:100%;
    font-size:13.5px; font-weight:800; color:var(--text); padding:9px 8px; margin-top:10px;
    background:none; border:none; cursor:pointer; font-family:inherit; border-radius:6px; text-align:left;
  }
  .menu-group-header:first-child{margin-top:0;}
  .menu-group-header:hover{background:var(--bg-sunken);}
  .menu-group-header .count{color:var(--text-tertiary); font-weight:600; font-size:12px;}
  .menu-group-header .chev{color:var(--text-tertiary); transition:transform .15s; flex:0 0 auto;}
  .menu-group-header.open .chev{transform:rotate(90deg);}
  .menu-group-items{display:none;}
  .menu-group-items.open{display:block;}
  .menu-item{
    display:flex; gap:10px; align-items:flex-start; width:100%; text-align:left;
    padding:10px 10px; border-radius:8px; border:1px solid transparent; background:none;
    cursor:pointer; margin-bottom:4px; font-family:inherit;
  }
  .menu-item:hover{background:var(--bg-sunken);}
  .menu-item.sub{padding-left:24px;}
  .menu-item.active{background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 35%, transparent);}
  .menu-text .menu-title{font-size:13px; font-weight:600; color:var(--text); margin-bottom:2px;}
  .menu-item.active .menu-text .menu-title{color:var(--accent-text);}
  .menu-text .menu-desc{font-size:11.5px; color:var(--text-secondary); line-height:1.4;}

  /* ---------- Center stage ---------- */
  .stage{display:flex; flex-direction:column; min-width:0; background:var(--bg-sunken);}
  .stage-header{
    flex:0 0 auto; padding:12px 18px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border); background:var(--bg-elevated);
  }
  .stage-header .file-title{font-size:13px; font-weight:700;}
  .stage-header .file-name{font-size:11.5px; color:var(--text-tertiary); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; margin-top:2px;}
  .stage-header .open-new{
    font-size:12px; color:var(--accent-text); text-decoration:none; padding:6px 10px;
    border:1px solid var(--border); border-radius:7px; background:var(--bg-sunken); white-space:nowrap;
  }
  .stage-header .open-new:hover{border-color:var(--border-strong);}
  .stage-actions{display:flex; align-items:center; gap:8px;}
  .copy-link{display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:12px; font-weight:600; color:#fff; background:var(--accent);
    border:1px solid var(--accent); border-radius:7px; padding:6px 10px; cursor:pointer; white-space:nowrap;}
  .copy-link:hover{filter:brightness(1.08);}
  .p-card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:8px;}
  .p-card-head h3{margin-top:0;}
  .card-link{flex:0 0 auto; display:inline-flex; align-items:center; gap:4px; font:inherit; font-size:12px; color:var(--text-tertiary);
    background:none; border:1px solid var(--border); border-radius:6px; padding:3px 8px; cursor:pointer; white-space:nowrap;}
  .card-link:hover{color:var(--accent-text); border-color:var(--accent);}
  .p-section-card.flash{outline:2px solid var(--accent); outline-offset:2px; transition:outline-color .6s;}
  .copy-toast{position:fixed; left:50%; bottom:32px; transform:translateX(-50%); background:#1a1a1a; color:#fff; font-size:13px;
    padding:10px 16px; border-radius:8px; box-shadow:0 4px 16px rgba(0,0,0,.2); opacity:0; pointer-events:none; transition:opacity .2s; z-index:2000; max-width:calc(100% - 32px);}
  .copy-toast.show{opacity:1;}
  .proto-frame{flex:1 1 auto; width:100%; border:0; background:#fff;}

  /* ---------- Right policy panel ---------- */
  .policy-panel{
    border-left:1px solid var(--border); background:var(--bg-elevated);
    display:flex; flex-direction:column; min-width:0;
  }
  .policy-header{
    flex:0 0 auto; padding:14px 18px 12px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .policy-header h2{font-size:14.5px; margin:0; font-weight:700;}
  .toggle-btn{
    font-size:12.5px; color:var(--text-secondary); background:var(--bg-sunken); border:1px solid var(--border);
    border-radius:7px; padding:6px 10px; cursor:pointer; font-family:inherit;
  }
  .toggle-btn:hover{border-color:var(--border-strong); color:var(--text);}
  .toggle-btn.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  .policy-content{flex:1 1 auto; overflow-y:auto; padding:18px 20px 40px;}

  .p-section{margin-bottom:24px;}
  .p-section.primary .p-section-card{border-color:color-mix(in srgb, var(--accent) 45%, var(--border)); box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 12%, transparent);}
  .p-section-card{background:var(--bg-elevated); border:1px solid var(--border); border-radius:var(--radius); padding:16px 17px; box-shadow:var(--shadow);}
  .proto-ref{font-size:12.5px; color:var(--text-tertiary); margin-top:10px;}
  .info-note{display:flex; gap:10px; align-items:flex-start; margin:12px 0; padding:12px 14px; border-radius:8px; background:#eef4ff; border:1px solid #c9d8ff; color:#1e40af; font-size:13.5px; line-height:1.6;}
  .info-note svg{flex:0 0 auto; margin-top:1px;}
  .info-note div{color:#1a2b5e;}
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .info-note{background:#1d2740; border-color:#33456e; color:#9db7ff;} :root:not([data-theme="light"]) .info-note div{color:#d6e0ff;} }
  .p-tag{display:inline-block; font-size:11.5px; font-weight:700; letter-spacing:.03em; color:var(--accent-text); background:var(--accent-soft); padding:3px 8px; border-radius:5px; margin-bottom:9px;}
  .p-tag.secondary{color:var(--text-secondary); background:var(--bg-sunken);}
  .p-section h3{font-size:15.5px; margin:0 0 9px; font-weight:700; letter-spacing:-.01em;}
  .p-section p{margin:0 0 9px; color:var(--text); font-size:14.5px; line-height:1.65;}
  .p-section p:last-child{margin-bottom:0;}
  .p-section ul, .p-section ol{margin:0 0 9px; padding-left:20px; font-size:14.5px; line-height:1.65;}
  .p-section li{margin-bottom:6px;}
  .p-section li:last-child{margin-bottom:0;}
  .mono, code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:.9em; background:var(--code-bg); color:var(--code-text); padding:1px 5px; border-radius:4px;}
  .policy-table{width:100%; border-collapse:collapse; margin:0 0 11px; font-size:13.5px;}
  .policy-table th, .policy-table td{border:1px solid var(--border); padding:7px 9px; text-align:left; vertical-align:top;}
  .policy-table th{background:var(--bg-sunken); font-weight:700; color:var(--text-secondary); font-size:12.5px;}
  .related-toggle{
    width:100%; text-align:left; background:var(--bg-sunken); border:1px solid var(--border); border-radius:8px;
    padding:10px 13px; font-size:13.5px; font-weight:600; color:var(--text-secondary); cursor:pointer; font-family:inherit;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:9px;
  }
  .related-toggle:hover{color:var(--text); border-color:var(--border-strong);}
  .related-toggle .chev{transition:transform .15s ease;}
  .related-toggle.open .chev{transform:rotate(90deg);}
  .related-body{display:none;}
  .related-body.open{display:block;}
  .checklist{list-style:none; padding-left:0;}
  .checklist li{padding-left:22px; position:relative;}
  .checklist li::before{content:"☐"; position:absolute; left:0; color:var(--text-tertiary);}
  .checklist li.done{color:var(--text-secondary);}
  .checklist li.done::before{content:"☑"; color:var(--accent);}
  .checklist li.done .strike{text-decoration:line-through; color:var(--text-tertiary);}


  /* ---------- 조항 카드: 화면으로 확인(프로토타입 팝업) — 2026-10-02 ---------- */
  .see-btn{flex:0 0 auto; display:inline-flex; align-items:center; gap:4px; font:inherit; font-size:12px; font-weight:600; color:#fff; background:var(--accent);
    border:1px solid var(--accent); border-radius:6px; padding:3px 9px; cursor:pointer; white-space:nowrap;}
  .see-btn:hover{filter:brightness(1.08);}
  .p-card-acts{display:flex; gap:6px; flex:0 0 auto;}
  .see-chip{display:inline-flex; align-items:center; gap:4px; font:inherit; font-size:12px; font-weight:600; color:var(--accent-text); background:var(--accent-soft);
    border:1px solid color-mix(in srgb, var(--accent) 35%, transparent); border-radius:999px; padding:2px 9px; margin:2px 0; cursor:pointer; white-space:nowrap; vertical-align:middle;}
  .see-chip:hover{border-color:var(--accent);}
  .see-chip.current{opacity:.6; cursor:default;}
  .pp-overlay{position:fixed; inset:0; background:rgba(16,20,28,.55); z-index:60; display:flex; align-items:center; justify-content:center; padding:3vh 20px;}
  .pp-overlay[hidden]{display:none;}
  .pp{background:var(--bg-elevated); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.3); width:min(1480px,100%); height:100%; display:flex; flex-direction:column; overflow:hidden;}
  .pp-head{flex:0 0 auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:12px 14px 12px 20px; border-bottom:1px solid var(--border);}
  .pp-head h2{font-size:16px; margin:0; font-weight:700; flex:1 1 auto; min-width:0;}
  .pp-tabs,.pp-tools{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
  .pp-tabs button{font:inherit; font-size:12.5px; font-weight:600; border:1px solid var(--border); background:var(--bg-sunken); color:var(--text); border-radius:999px; padding:5px 12px; cursor:pointer;}
  .pp-tabs button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .pp-tools button,.pp-tools a{font:inherit; font-size:12px; font-weight:600; border:1px solid var(--border); background:var(--bg-elevated); color:var(--text); border-radius:6px; padding:5px 9px; cursor:pointer; text-decoration:none;}
  .pp-tools button.on{border-color:var(--accent); color:var(--accent-text); background:var(--accent-soft);}
  .pp-frame{flex:1 1 auto; border:0; width:100%; background:#fff;}
  @media (max-width: 980px){ .pp-overlay{padding:0;} .pp{border-radius:0;} }

  /* ---------- 전체 문서 보기: 좁은 사이드 패널 대신 넓은 오버레이 모달 ---------- */
  .doc-modal-overlay{
    position:fixed; inset:0; background:rgba(16,20,28,.5); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:5vh 20px;
  }
  .doc-modal-overlay[hidden]{ display:none; }
  .doc-modal{
    background:var(--bg-elevated); border-radius:14px; box-shadow:0 20px 60px rgba(0,0,0,.3);
    width:min(920px, 100%); height:100%; max-height:90vh; display:flex; flex-direction:column; overflow:hidden;
  }
  .doc-modal-header{
    flex:0 0 auto; padding:18px 24px; border-bottom:1px solid var(--border);
    display:flex; align-items:center; justify-content:space-between;
  }
  .doc-modal-header h2{font-size:17px; margin:0; font-weight:700;}
  .doc-modal-close{
    width:32px; height:32px; border-radius:8px; border:1px solid var(--border); background:var(--bg-sunken);
    color:var(--text-secondary); cursor:pointer; display:flex; align-items:center; justify-content:center; flex:0 0 auto;
  }
  .doc-modal-close:hover{border-color:var(--border-strong); color:var(--text);}
  .doc-modal-body{flex:1 1 auto; overflow-y:auto; padding:24px 28px 48px;}
  .doc-modal-body .p-section p, .doc-modal-body .p-section ul, .doc-modal-body .p-section ol{font-size:15.5px;}
  .doc-modal-body .p-section h3{font-size:17px;}

  /* ---------- 홈 화면: 프로토타입을 카테고리별 썸네일 카드로 한눈에 ---------- */
  #homeView{flex:1 1 auto; overflow-y:auto; padding:32px 28px 60px;}
  #homeView[hidden]{ display:none; }
  .home-inner{max-width:1200px; margin:0 auto;}
  .home-intro{margin-bottom:24px;}
  .home-intro h2{font-size:20px; margin:0 0 6px; font-weight:800;}
  .home-intro p{font-size:14px; color:var(--text-secondary); margin:0; line-height:1.6;}
  .home-doc-card{
    display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:12px;
    padding:18px 20px; margin-bottom:32px; cursor:pointer; font:inherit; color:inherit;
    transition:border-color .15s, box-shadow .15s;
  }
  .home-doc-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .home-doc-card .icon{font-size:26px; flex:0 0 auto;}
  .home-doc-card .title{font-size:15.5px; font-weight:700; margin-bottom:2px;}
  .home-doc-card .desc{font-size:13px; color:var(--text-secondary);}
  .home-doc-card .arrow{margin-left:auto; font-size:18px; color:var(--text-tertiary); flex:0 0 auto;}

  .gallery-group-label{font-size:23px; font-weight:800; color:var(--text); letter-spacing:-.01em;
    margin:36px 0 16px; padding-bottom:10px; border-bottom:2px solid var(--border);}
  .gallery-group-label:first-child{margin-top:0;}
  .gallery-grid{display:flex; flex-wrap:wrap; gap:16px;}
  .gallery-card{width:280px; border:1px solid var(--border); border-radius:10px; overflow:hidden;
    background:var(--bg-elevated); cursor:pointer; text-align:left; transition:border-color .15s, box-shadow .15s;
    padding:0; margin:0; font:inherit; display:block;}
  .gallery-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .gallery-thumb{width:280px; height:175px; overflow:hidden; position:relative; background:#fff; pointer-events:none;
    border-bottom:1px solid var(--border);}
  .gallery-thumb iframe{width:1280px; height:800px; border:0; transform:scale(0.21875); transform-origin:top left;}
  .gallery-thumb-placeholder{width:100%; height:100%; display:flex; align-items:center; justify-content:center;
    color:var(--text-tertiary); font-size:13px;}
  .gallery-card-body{padding:12px 14px;}
  .gallery-card-title{font-size:14.5px; font-weight:700; color:var(--text); margin-bottom:4px;}
  .gallery-card-desc{font-size:12.5px; color:var(--text-secondary); line-height:1.5;}

  /* ---------- 상세 화면 상단 홈 버튼 ---------- */
  .home-back{
    font-size:12.5px; color:var(--text-secondary); text-decoration:none; padding:7px 12px;
    border:1px solid var(--border); border-radius:8px; background:var(--bg-sunken);
    display:inline-flex; align-items:center; gap:6px; white-space:nowrap; font-family:inherit;
    cursor:pointer; flex:0 0 auto;
  }
  .home-back:hover{border-color:var(--border-strong); color:var(--text);}

  /* ---------- Responsive: stack on narrow viewports ---------- */
  @media (max-width: 980px){
    .shell{flex-direction:column;}
    .sidebar-menu{

  s1: { title:"1. 브레이크포인트 (모든 컴포넌트가 이 값을 인용)", html:
    '<table class="policy-table"><thead><tr><th>값</th><th>역할</th></tr></thead><tbody><tr><td><strong>1024px</strong></td><td>PC ↔ 모바일 전환(유일한 1차 분기). <strong>1024px 이하 = 모바일, 1025px 이상 = PC</strong></td></tr><tr><td><strong>360px</strong></td><td>모바일 최소 지원폭. 콘텐츠 분기에는 쓰지 않음(모달도 360 분기 없음, 3-3)</td></tr><tr><td><strong>1199px / 1439px</strong></td><td>PC 안에서 <strong>앱별 사이드바를 숨기는 2차 기준</strong> — 사업소 1199px 이하, 대대여 1439px 이하</td></tr></tbody></table><ul><li><strong>CSS</strong>: 모바일 <span class="mono">max-width:1024px</span>, PC <span class="mono">min-width:1024.02px</span>. <span class="mono">1024/1025</span>로 쓰면 확대·축소로 폭이 1024.5px 같은 소수가 될 때 어느 쪽에도 속하지 않는 틈이 생기므로 소수로 맞물린다</li><li>정확히 1024px(아이패드 가로 포함)은 <strong>모바일</strong>이다</li><li><strong>폭 기준이지 입력장치 기준이 아니다.</strong> 터치 노트북·가로 태블릿도 폭이 1025 이상이면 PC 레이아웃. 대신 hover에만 의존하는 동작은 만들지 않고 클릭으로도 100% 동작하게 한다</li><li>이 외의 값(480·640·768 등)은 브레이크포인트로 쓰지 않는다. 768 같은 태블릿 프레임은 모바일 레이아웃이 넓은 폭에서 어떻게 보이는지 보여주는 예시일 뿐이다</li></ul><p><strong>PC 콘텐츠 폭(앱별 고정값 — 브레이크포인트 아님)</strong></p><table class="policy-table"><thead><tr><th>앱</th><th>콘텐츠 폭</th><th>비고</th></tr></thead><tbody><tr><td>이로움케어(소비자·사업소)</td><td><strong>1060px</strong> 고정, 전 화면 공통</td><td>1920 캔버스 → Content Wrapper 1400(좌측 aside 302 포함) → contents 1060</td></tr><tr><td>대대여(입출고 창고·설치파트너)</td><td>컨테이너 1200 − 패딩 32×2 = <strong>1136px</strong></td><td>9-1</td></tr></tbody></table><p>정해 두지 않으면 초광폭 모니터에서 무한정 늘어나므로 반드시 상한을 둔다.</p><p><strong>앱별 PC 셸 축소 구간</strong> — PC(1025px 이상) 안에서 사이드바를 숨기는 기준은 앱마다 다르다. 모바일 전환(1024px 이하)은 두 앱 같다.</p><table class="policy-table"><thead><tr><th>앱</th><th>사이드바 표시</th><th>사이드바 숨김</th><th>모바일</th></tr></thead><tbody><tr><td>이로움케어 사업소</td><td>1200px 이상</td><td><strong>1199px 이하</strong> 왼쪽 SNB 숨김</td><td>1024px 이하</td></tr><tr><td>대대여(입출고 창고·설치파트너)</td><td>1440px 이상</td><td><strong>1439px 이하</strong> SideNav 숨김</td><td>1024px 이하</td></tr></tbody></table><ul><li><strong>사업소 1025~1199px</strong>: SNB 숨김(<span class="mono">.snb{display:none}</span>), 콘텐츠 1060px</li><li><strong>대대여 1025~1439px</strong>: SideNav는 화면 밖으로 숨고 <strong>햄버거로 콘텐츠 위에 겹쳐 열린다(오버레이)</strong>. 콘텐츠와 GNB는 <strong>최소 폭 1440px 유지 + 가로 스크롤</strong>(1440 = SideNav 240 + 콘텐츠 영역 1200)</li><li><strong>대대여 1440px 이상</strong>: SideNav 항상 표시, GNB 햄버거로 접고 펼침(9-1)</li><li>근거: DS "모바일 정의" 해상도 주석("모바일 기준: 1024px 이하"), 퍼블 CSS <span class="mono">max-width:1199px</span>·<span class="mono">max-width:1439px</span>. DS 주석 "1024~1023 축소 및 스크롤"은 1024~1439의 오기로 봄</li></ul><p class="proto-ref">→ <span class="mono">breakpoint-map.html</span></p>' },
  s2: { title:"2. 레이아웃 전략 — 반응형 vs 적응형", html:
    '<table class="policy-table"><thead><tr><th>구분</th><th>정의</th><th>적용</th></tr></thead><tbody><tr><td><strong>반응형</strong></td><td>같은 DOM을 CSS로 재배치. 화면 하나로 전 구간 대응</td><td>상세 화면(3-11), 모달(3-3), 카드 목록형(3-10), 월간 캘린더(9-3)</td></tr><tr><td><strong>적응형</strong></td><td>PC와 모바일 구조가 다름(테이블 vs 카드). <strong>두 구조를 한 페이지에 모두 두고</strong> 1024/1025px에서 표시만 전환</td><td>테이블 리스트(3-9)와 그 검색 영역(3-7)</td></tr></tbody></table><ul><li>판단 기준: 정보 밀도나 조작 방식이 PC·모바일에서 본질적으로 다르면 적응형, 같은 정보를 배치만 바꿔 보여줄 수 있으면 반응형</li><li><strong>어느 쪽이든 한 페이지(한 URL)다.</strong> 모바일을 별도 페이지·별도 앱으로 만들지 않는다<ul><li><strong>목록</strong>: 모바일 <strong>전용 구조</strong>(카드 등)를 따로 만든다. PC 테이블과 모바일 카드를 한 페이지에 둘 다 넣고 1024px 이하에서 표시만 바꾼다(테이블을 CSS만으로 카드처럼 바꾸지 않는다)</li><li><strong>상세</strong>: <strong>PC 구조 하나</strong>를 반응형으로 재배치한다(모바일용 구조를 따로 만들지 않는다)</li></ul></li><li>전환 대상: 대대여 모바일(현재 별도 React 앱)과 현재 퍼블의 별도 모바일 페이지(<span class="mono">*_mobile.html</span>)는 이 방식으로 합친다 — PC·모바일 이중 관리를 없애는 것이 이 정책의 목적</li></ul>' },
  s30: { title:"3-0. 용어와 컴포넌트 크기 기준 (PC / 모바일)", html:
    '<p><strong>한 줄 원칙: 1024px 이하에서 크기가 바뀌는 것은 입력칸·셀렉트·옵션 행뿐이다.</strong> 나머지(버튼·칩·탭·체크박스)는 PC·모바일 구분 없이 <strong>쓰는 자리에 맞는 크기</strong>를 고른다. 공통 CSS의 미디어쿼리 하나로 관리하고 페이지별 예외를 두지 않는다.</p><p><strong>용어</strong> — 컴포넌트는 DS 이름으로 부른다</p><table class="policy-table"><thead><tr><th>용어</th><th>뜻</th><th>규칙</th></tr></thead><tbody><tr><td>읽기 전용 정보 표</td><td>라벨-값을 나열하는 표(입력 없음)</td><td>3-1</td></tr><tr><td>입력 폼 배치</td><td>라벨 + 입력칸을 한 줄·두 줄로 맞추는 배치 규칙</td><td>3-2</td></tr><tr><td>입력칸 <span class="mono">Textfield</span></td><td>글자를 입력하는 칸(라벨·도움말 포함 가능)</td><td>3-2</td></tr><tr><td>셀렉트 <span class="mono">SelectField</span></td><td>누르면 옵션 목록이 열리는 칸</td><td>3-2, 3-7</td></tr><tr><td>옵션 패널 <span class="mono">OptionGroup</span> / 옵션 행 <span class="mono">SelectOption</span></td><td>셀렉트·검색 결과 목록과 그 한 줄</td><td>3-3, 3-7</td></tr><tr><td>긴 글 <span class="mono">TextAreaField</span></td><td>여러 줄 입력(사유·메모)</td><td>3-2</td></tr><tr><td>모달 / 바텀시트 / 옵션 시트</td><td>팝업 형태</td><td>3-3</td></tr></tbody></table><p><strong>크기 기준표</strong></p><table class="policy-table"><thead><tr><th>구분</th><th>컴포넌트</th><th>PC (1025px 이상)</th><th>모바일 (1024px 이하)</th><th>바뀌나</th></tr></thead><tbody><tr><td>입력류</td><td>입력칸 <span class="mono">Textfield</span>, 셀렉트 <span class="mono">SelectField</span></td><td>높이 40, 패딩 8/12, 14px</td><td>높이 <strong>48</strong>, 패딩 12, <strong>16px</strong></td><td><strong>바뀜</strong></td></tr><tr><td>입력류</td><td>옵션 행 <span class="mono">SelectOption</span></td><td>높이 36, 패딩 8/8/8/12, 14px</td><td>높이 <strong>44</strong>, 패딩 10/8/10/12, <strong>16px</strong></td><td><strong>바뀜</strong></td></tr><tr><td>입력류</td><td>긴 글 <span class="mono">TextAreaField</span></td><td>16px</td><td>16px</td><td>그대로</td></tr><tr><td>버튼</td><td>SM / MD</td><td>36 / 48</td><td>36 / 48</td><td>그대로 (3-4)</td></tr><tr><td>버튼</td><td>LG</td><td>—</td><td><strong>54</strong></td><td>하단 고정·바텀시트 하단 버튼만</td></tr><tr><td>선택</td><td>체크박스 / 라디오</td><td>20×20</td><td>20×20</td><td>그대로 — 모바일은 <strong>줄 전체를 누를 수 있게</strong>, 줄 높이 44 이상</td></tr><tr><td>선택</td><td>토글</td><td>48×24</td><td>48×24</td><td>그대로</td></tr><tr><td>칩</td><td>필터칩 <span class="mono">Filter Chips</span>(알약)</td><td>XL 40·16px / SM 32·14px</td><td>같음</td><td>그대로 — 자리별로 고름(모바일 필터칩 줄은 SM 32, 3-7)</td></tr><tr><td>칩</td><td>선택칩 <span class="mono">Option Chips_Line</span>(모서리 4)</td><td>XL 44·18px / SM 32·14px</td><td>같음</td><td>그대로</td></tr><tr><td>탭</td><td><span class="mono">Tab</span></td><td>Underline 56 / Outlined 48 / Round 40</td><td>같음</td><td>그대로 — 모양(Type)별로 고름</td></tr><tr><td>팝업</td><td>모달</td><td>480 · 600 · 800</td><td><span class="mono">min(크기, 100% - 40px)</span></td><td>폭만 (3-3)</td></tr><tr><td>팝업</td><td>모달 버튼</td><td>높이 48, 폭 150 고정</td><td>같음 — 모달이 좁으면 줄어듦</td><td>그대로 (3-3)</td></tr></tbody></table><p><strong>입력칸 상태와 표시</strong></p><table class="policy-table"><thead><tr><th>상태·표시</th><th>언제</th><th>모양</th></tr></thead><tbody><tr><td>비활성 <span class="mono">Disabled</span></td><td>지금은 쓸 수 없는 칸(조건이 안 맞음)</td><td>배경 <span class="mono">#eee</span>, 테두리 <span class="mono">#bdbdbd</span>, 글자 흐리게</td></tr><tr><td>읽기전용 <span class="mono">ReadOnly</span></td><td>값은 보이지만 직접 고치지 않는 칸(우편번호·기본주소처럼 버튼으로 채움)</td><td>배경 <span class="mono">#eee</span>, 테두리 <span class="mono">#bdbdbd</span>, 글자는 그대로 진하게</td></tr><tr><td>필수</td><td>반드시 입력해야 하는 칸</td><td>라벨 뒤 빨간 <span class="mono">*</span></td></tr><tr><td>도움말 <span class="mono">Help message</span></td><td>입력 규칙 안내가 필요할 때만(예: "- 없이 숫자만", "마감 시각 기준…")</td><td>입력칸 아래 한 줄, 정보 아이콘 + 회색 글자. 필요 없으면 넣지 않음</td></tr><tr><td>에러</td><td>입력 값이 틀렸을 때</td><td>테두리 2px <span class="mono">#e53935</span> + 입력칸 아래 빨간 문구(에러 아이콘)</td></tr></tbody></table><ul><li>근거: DS <span class="mono">64Q1Re56aiAA8Al89pqjnV</span> — Textfield <span class="mono">7837:8282</span>, SelectField <span class="mono">53:698</span>, SelectOption <span class="mono">6570:11270</span>, chips <span class="mono">7723:6790</span>, Tab <span class="mono">7988:12496</span>, checkbox·Radio·Toggle 컴포넌트</li></ul>' },
  s31: { title:"3-1. 읽기 전용 정보 표", html:
    '<p>주문 정보, 회수 신청 정보처럼 라벨-값을 나열하는 표.</p><ul><li>라벨 셀: <span class="mono">max-width:128px; min-width:80px</span>, 배경 <span class="mono">#f5f5f5</span></li><li>값 셀: <span class="mono">min-width:160px</span></li><li><strong>flex-shrink만 쓰고 wrap은 쓰지 않는다.</strong> 라벨은 128→80, 값은 자기 min-width까지 줄어든다. 240px(80+160)까지 좌우 2열이 유지되므로 세로 스택으로 바꾸는 분기는 필요 없다</li><li>배경 없는 버전(조회형): 라벨 125px, 배경 없음</li></ul><p class="proto-ref">→ <span class="mono">order-detail-mobile.html</span>, <span class="mono">rental-return-detail-prototype.html</span></p>' },
  s32: { title:"3-2. 입력 폼 배치와 입력칸", html:
    '<p>배송정보 수정, 회수지 주소 수정 같은 입력 폼.</p><ul><li>라벨: <strong>125px 고정</strong>, <span class="mono">flex-shrink:0</span></li><li>콘텐츠: <span class="mono">flex:1 0 0</span>, 최소폭은 모드에 따라 다름<ul><li>수정 모드 <span class="mono">min-width:280px</span> → 줄바꿈 지점 = 125 + gap 4 + 280 = <strong>409px</strong></li><li>조회 모드 <span class="mono">min-width:180px</span> → 줄바꿈 지점 = 125 + gap 8 + 180 = <strong>313px</strong></li></ul></li><li>줄바꿈 지점은 브레이크포인트가 아니라 <strong>공식의 결과</strong>다. 라벨 폭이나 최소폭이 바뀌면 같이 바뀌므로 숫자가 아니라 공식을 기준으로 삼는다</li><li>flex-wrap 컨테이너라 미디어쿼리 없이 동작</li><li>PC(1025px 이상)에서 입력 콘텐츠 영역은 <span class="mono">max-width:480px</span>에서 멈춘다</li><li><strong>반응형이어도 입력류 컴포넌트는 PC·모바일 변형을 바꿔 쓴다.</strong> DS 입력류는 <span class="mono">Device=PC</span> / <span class="mono">Device=MO</span> 변형이 따로 있고, <strong>1024px 이하에서는 MO 변형</strong>(CSS 미디어쿼리로 크기 전환)을 쓴다. 같은 DOM을 재배치하는 반응형 화면이라고 PC 크기를 그대로 두지 않는다<table class="policy-table"><thead><tr><th>컴포넌트</th><th>모바일(MO, 1024px 이하)</th><th>PC(1025px 이상)</th></tr></thead><tbody><tr><td><span class="mono">Textfield</span> 입력칸</td><td>높이 <strong>48</strong>, 패딩 12, 글자 <strong>16px</strong></td><td>높이 40, 패딩 8/12, 글자 14px</td></tr><tr><td><span class="mono">SelectField</span> 셀렉트</td><td>높이 <strong>48</strong>, 패딩 12, 글자 <strong>16px</strong></td><td>높이 40, 패딩 8/12, 글자 14px</td></tr><tr><td><span class="mono">SelectOption</span> 옵션 행</td><td>높이 <strong>44</strong>, 패딩 10/8/10/12, 글자 <strong>16px</strong></td><td>높이 36, 패딩 8/8/8/12, 글자 14px</td></tr><tr><td><span class="mono">TextAreaField</span> 긴 글</td><td>글자 16px(PC·MO 같음)</td><td>같음</td></tr></tbody></table></li></ul><p>버튼은 이 원칙에서 빠진다 — 버튼은 PC 크기 그대로, 하단 고정·바텀시트 하단만 LG 54(3-4)</p><ul><li><strong>예외 없음 — 모달 안 입력류도 1024px 이하에서는 MO 크기</strong>다. 코드는 미디어쿼리 하나로 페이지·모달·바텀시트의 입력칸·셀렉트·옵션 행을 모두 MO로 바꾼다("모달 안만 PC 유지" 같은 예외를 두면 개발이 위치를 구분해야 해서 경우의 수가 늘어난다). <strong>디자인은 모달을 PC 하나로 관리</strong>하고 "모바일(1024px 이하)에서는 입력류 MO 크기 자동 적용" 메모만 단다. 모바일 모달 안 셀렉트는 선택만 하는 팝업(예: 회수 요청하기)에만 생기므로 실제 경우도 적다</li></ul></li><li><strong>입력칸 상태</strong>(DS <span class="mono">Textfield</span>): 높이 PC 40 / 모바일 48, radius 4<table class="policy-table"><thead><tr><th>상태</th><th>테두리</th><th>배경</th></tr></thead><tbody><tr><td>기본(값 없음)</td><td>1px PC <span class="mono">#616161</span> / 모바일 <span class="mono">#bdbdbd</span></td><td>흰색</td></tr><tr><td>값 입력됨</td><td>1px <span class="mono">#333</span></td><td>흰색</td></tr><tr><td>포커스</td><td><strong>2px <span class="mono">#323da3</span></strong></td><td>흰색</td></tr><tr><td>에러</td><td>2px <span class="mono">#e53935</span></td><td>흰색</td></tr><tr><td>비활성·읽기전용</td><td>1px <span class="mono">#bdbdbd</span></td><td><span class="mono">#eee</span></td></tr></tbody></table><p>버튼으로만 채우는 칸(우편번호·기본주소 등)은 <strong>읽기전용</strong> 스타일</p><ul><li><strong>입력칸 안 정렬</strong>: 입력칸·셀렉트·날짜 칸 안의 글자와 아이콘(달력·화살표·돋보기)은 <strong>세로 가운데 정렬</strong>(<span class="mono">display:flex; align-items:center</span>). 크기는 <strong>높이</strong>(PC 40 / 모바일 48)로 정하고 위아래 패딩은 두지 않는다(좌우만 12) — 위아래 패딩으로 높이를 맞추면 글꼴·줄 높이에 따라 글자가 위나 아래로 쏠린다</li><li><strong>지우기(X) 버튼</strong>: 텍스트 입력칸은 <strong>값이 없으면 X 없음, 값이 있으면 X 노출</strong>. 읽기전용·비활성 칸, 날짜·셀렉트 칸(오른쪽에 달력·화살표 아이콘이 있는 칸)에는 X 없음. X를 누르면 값만 지우고 포커스는 그 칸에 유지(모바일 키보드 유지). 아이콘 24, 모바일 터치 영역 40×40 이상. 입력 글자가 X 밑으로 들어가지 않게 오른쪽 패딩을 X 폭만큼 확보. 입력칸 오른쪽에 돋보기 등 다른 아이콘이 있을 때도 같은 원칙<ul><li><strong>예외 — 검색 입력칸은 X를 두지 않는다.</strong> 오른쪽 돋보기는 장식이 아니라 <strong>검색을 실행하는 버튼</strong>이라 오른쪽에 고정하고, 그 자리를 X와 나눠 쓰지 않는다(DS의 왼쪽 아이콘 Leading Icon은 표시용이라 돋보기 버튼을 옮기는 용도로 쓰지 않음). 대신 <strong>입력칸을 다시 누르면 글자 전체를 선택</strong>해서 바로 새 검색어를 칠 수 있게 한다. <span class="mono">type="search"</span>는 브라우저가 기본 "×"를 자동으로 붙이므로 CSS(<span class="mono">::-webkit-search-cancel-button{display:none}</span>)로 숨긴다</li></ul></li><li><strong>입력 값 종류와 모바일 키보드</strong><table class="policy-table"><thead><tr><th>입력 값</th><th>키보드</th><th>엔터 키</th></tr></thead><tbody><tr><td>일반 글자(이름·상세주소)</td><td>기본</td><td>다음 칸이 있으면 "다음"(<span class="mono">enterkeyhint="next"</span>), 마지막이면 "완료"(<span class="mono">"done"</span>)</td></tr><tr><td>숫자(휴대폰·전화·우편번호)</td><td>숫자 키패드(<span class="mono">inputmode="tel"</span>·<span class="mono">"numeric"</span>)</td><td>같은 규칙</td></tr><tr><td>검색어</td><td>기본 + "검색" 키(<span class="mono">enterkeyhint="search"</span>)</td><td>키보드 닫힘(결과는 입력하는 대로 이미 표시, 돋보기 버튼과 같음)</td></tr><tr><td>긴 글(사유·메모)</td><td>기본, 줄바꿈 허용</td><td>줄바꿈. 글자 수 표시(예: 0/200자)</td></tr><tr><td>날짜·셀렉트</td><td>키보드 없음 → 달력 시트·옵션 시트(3-7)</td><td>—</td></tr></tbody></table><ul><li>모바일 입력 글자는 <strong>16px 이상</strong> — 16px보다 작으면 iOS가 입력칸을 누를 때 화면을 확대한다</li></ul></li><li>근거: Figma <span class="mono">배송조회_입력폼</span> 409px(<span class="mono">6591:177940</span>), <span class="mono">배송조회</span> 313px(<span class="mono">6591:173787</span>), 340px 줄바꿈 상태(<span class="mono">6591:160253</span>) / DS <span class="mono">Textfield</span> 컴포넌트(X 옵션은 아직 없음 — 컴포넌트에 추가 필요)</li></ul><p class="proto-ref">→ <span class="mono">form-breakpoint-demo.html</span></p>' },
  s33: { title:"3-3. 모달", html:
    '<p><strong>팝업 형태 정의</strong></p><table class="policy-table"><thead><tr><th>형태</th><th>정의</th></tr></thead><tbody><tr><td><strong>모달</strong></td><td>화면 가운데 뜨는 팝업. 짧은 안내·확인·선택용. PC는 모든 팝업이 모달</td></tr><tr><td><strong>바텀시트</strong></td><td>화면 아래에서 올라오는 패널(3-5). 모바일에서 <strong>글자 입력이 있거나</strong> 선택지가 길 때</td></tr><tr><td><strong>옵션 시트</strong></td><td>바텀시트 안 셀렉트를 누르면 원래 시트 <strong>대신</strong> 열리는 선택 목록(아래)</td></tr><tr><td><strong>전체 화면</strong></td><td>입력 항목이 많아 바텀시트 최대 높이를 넘는 폼은 팝업이 아니라 새 화면으로</td></tr></tbody></table><p><strong>모달 크기</strong>는 "테이블(행/열 데이터) 포함 여부"로 정한다 — 요소 개수가 아님. 안내·확인·입력·검색 모달 <strong>480</strong>, 테이블 포함형 <strong>600 / 800</strong>(입고처리 600, 계약서·소독필증 800).</p><p><strong>모바일(1024px 이하)에서 어떤 형태로 여는가 — 입력 영역이 있으면 바텀시트</strong></p><table class="policy-table"><thead><tr><th>팝업 내용</th><th>모바일 형태</th><th>예</th></tr></thead><tbody><tr><td>안내·확인(글자만)</td><td>모달</td><td>주문 불가 안내, 주문하기 확인, 메모 삭제</td></tr><tr><td>선택만(셀렉트·체크박스·라디오·버튼)</td><td>모달. 선택지가 많아 길어지면 바텀시트</td><td>회수 요청하기</td></tr><tr><td><strong>글자 입력</strong>(텍스트·숫자·검색·주소·사유)</td><td><strong>바텀시트</strong></td><td>회수지 주소 수정, 회수접수 취소, <strong>상품 변경</strong></td></tr><tr><td>테이블</td><td>모달(가로 스크롤)</td><td>대여 이력 조회</td></tr></tbody></table><ul><li>기준은 <strong>키보드</strong>다. 키보드 동작은 3-12</li><li><strong>왜 입력 팝업은 바텀시트인가</strong></li></ul><p>1. <strong>화면 높이가 반으로 준다</strong> — 폰(360×800)에서 키보드가 약 260~300px을 차지해 남는 높이가 절반 남짓이다. 가운데 정렬 모달은 위아래로 밀리면서 입력칸·버튼이 키보드 뒤로 가려진다(회수지 주소 수정·상품 변경에서 실제 발생)</p><p>2. <strong>바텀시트는 키보드 위에 붙는다</strong> — 아래에서 올라오는 구조라 키보드 위 남은 공간 안에서 늘어나고, 타이틀·입력칸·버튼이 한 화면에 남는다. 내용이 길면 본문만 스크롤한다(3-5)</p><p>3. <strong>손이 닿는 위치</strong> — 입력칸·버튼이 화면 아래쪽에 모여 한 손으로 입력하고 누르기 쉽다</p><p>4. <strong>기기·브라우저 차이에 강하다</strong> — 키보드가 열릴 때 iOS·안드로이드·인앱 브라우저마다 화면 높이 계산이 달라 가운데 모달은 위치가 제각각 틀어지지만, 아래 고정 시트는 기준이 하나라 덜 흔들린다</p><p>5. <strong>모바일 관례·DS 정의와 같다</strong> — DS "모바일 정의"와 반품/AS·회수 디자인도 모바일 입력은 바텀시트로 그렸다</p><ul><li><strong>모달 폭 규칙은 한 줄이다</strong>: 모든 모달 <span class="mono">width:min(모달 크기, 100% - 40px)</span>. 화면이 넉넉하면 원래 크기(480·600·800), <strong>화면이 모달보다 좁아지면 좌우 마진 20을 남기고 꽉 찬다(Full)</strong>. 모달 크기를 바꾸는 미디어쿼리는 두지 않는다<table class="policy-table"><thead><tr><th>화면 폭</th><th>480 모달</th><th>600 모달</th><th>800 모달</th></tr></thead><tbody><tr><td>1025 이상(PC)</td><td>480</td><td>600</td><td>800</td></tr><tr><td>768(태블릿)</td><td>480</td><td>600</td><td>728</td></tr><tr><td>390</td><td>350</td><td>350</td><td>350</td></tr><tr><td>360</td><td>320</td><td>320</td><td>320</td></tr></tbody></table></li><li>340이라는 별도 크기는 없다. Figma의 340 모달 프레임은 480 모달이 폰 폭에서 줄어든 모습(좌우 마진은 20 적용)으로 본다</li><li><strong>바텀시트 안의 요소</strong><ul><li>입력 폼은 모바일 크기(입력 48, 버튼 54)</li><li><strong>셀렉트</strong>(목록이 정해진 선택): 누르면 <strong>옵션 시트</strong>(선택 행 틴트 + 체크, 하단 "선택완료")가 원래 시트 <strong>대신</strong> 열리고, 선택완료·닫기 시 원래 시트로 돌아간다(3-7 날짜 선택 시트와 같은 흐름)</li><li><strong>검색 선택</strong>(검색어로 결과를 찾아 고르는 선택, 예: 상품 변경): 시트를 바꾸지 않고 <strong>한 시트 안에서</strong> 검색 → 선택 → 확인. 입력칸 아래에 <strong>결과 패널</strong>(DS <span class="mono">OptionGroup</span> — 테두리 1px <span class="mono">#333</span>, radius 4, 패딩 8, 행은 <span class="mono">SelectOption</span> MO — 높이 44·패딩 10/8/10/12·16px·간격 6, 누르는 순간 틴트 <span class="mono">#eff1fd</span>, 품절은 회색·선택 불가)이 <strong>입력하는 대로 자동으로</strong> 나타난다(약 0.3초 간격 갱신). 오른쪽 돋보기 버튼과 키보드 "검색" 키는 키보드를 닫아 결과를 넓게 보게 한다. 결과를 누르면 입력칸에 그 값이 들어가고 <strong>패널과 키보드가 닫히며</strong> 확인 버튼이 활성화된다. 검색어를 고치면 결과가 다시 바뀌고 선택이 풀리며 확인 버튼이 다시 비활성. 결과가 없으면 패널에 "검색 결과가 없습니다." 시트를 바꾸지 않는 이유: 시트가 바뀌면 키보드가 닫히고, 검색어를 고치려면 앞 시트로 돌아가야 한다</li></ul></li><li><strong>버튼 높이</strong>: 모달 버튼은 <strong>MD 48</strong>(PC·모바일 같음, 3-4). 바텀시트 하단 버튼만 LG 54</li><li><strong>버튼 폭</strong>: 모든 모달 버튼 <strong>150px 고정</strong>, gap 12px, 가운데 정렬(2개면 150+12+150=312px). <strong>버튼 1개도 150 고정</strong>. PC·모바일 같고 미디어쿼리 없음<ul><li><strong>모달이 좁으면 줄어든다</strong>: 모달 안쪽 폭이 버튼 합보다 좁으면 버튼이 같은 비율로 줄어든다(<span class="mono">flex:0 1 150px</span>). 예: 360 화면 → 모달 320 − 패딩 20×2 = 280 → 버튼 2개 각 134</li><li><strong>버튼명이 150에 안 들어갈 때</strong><ul><li><strong>버튼 1개</strong>: 글자만큼 늘어난다(버튼 안쪽 좌우 패딩 20 유지). 모달 안쪽 폭까지만 늘어나 그 이상이면 Full. 예: 회수 요청 불가 안내 "대여 회수 관리 바로가기"</li><li><strong>버튼 2개</strong>: 늘리지 않는다 — 버튼명을 짧게 쓴다(360 화면에서 버튼이 134까지 줄어 글자 약 6자). 긴 이름이 꼭 필요하면 버튼 1개로 구성</li></ul></li><li><strong>DS 컴포넌트는 그대로 둔다</strong>: 버튼 영역 <span class="mono">Part/Modal</span>에 최소 150·최대 Fill을 넣는 변경은 영향 범위가 커서 보류(7번). 긴 버튼명 화면은 디자인에서 버튼 폭을 직접 맞추고, 개발은 위 규칙대로 CSS로 처리한다</li><li><strong>바텀시트 하단 버튼은 그대로 Full</strong>(LG 54, 폭을 나눠 가짐, 3-4·3-5)</li></ul></li><li>모달은 딤 배경 위 <strong>정중앙</strong>. 내용이 넘치면 모달에 <span class="mono">max-height</span>를 주고 내부 스크롤</li><li>오버레이(모달·드롭다운·달력·바텀시트)는 <strong>하나만</strong> — 새로 열리면 기존 것이 닫힌다</li><li>근거: 테이블형 lg-600 <span class="mono">모달-입고처리_디폴트</span>(600×908)·<span class="mono">모달_정상여부 확인</span>, xl-800 <span class="mono">PC_대대여 계약서 모달_디폴트</span>·<span class="mono">Modal_xl_800_소독필증 발급</span>(9번) / 회수접수 취소 바텀시트 <span class="mono">7317:76226</span> / 상품 변경 바텀시트 빈 상태 <span class="mono">7374:41582</span>·입력 중 <span class="mono">7374:41743</span>·선택 완료 <span class="mono">7389:41975</span></li></ul><p class="proto-ref">→ <span class="mono">modal-types-gallery.html</span>, <span class="mono">product-change-sheet-demo.html</span></p>' },
  s34: { title:"3-4. 액션 버튼 배치", html:
    '<ul><li><strong>PC</strong>: 페이지 타이틀 오른쪽, <strong>Hug 사이즈</strong>(<span class="mono">flex:0 0 auto</span>) — 전체폭 분할 금지</li><li><strong>모바일</strong>: 화면 하단 <strong>고정(sticky)</strong> + 흰색 그라데이션 페이드, 버튼은 폭을 나눠 가짐(Full), 높이 <strong>LG 54</strong><ul><li><strong>예외 — 주문요청관리 상세(4-3·4-5)의 주문취소/주문하기는 모바일에서 타이틀 아래 한 줄, 폭을 나눠 가짐, MD 48</strong>(하단 고정 아님). 다른 상세 화면에 적용할지는 따로 정한다</li></ul></li><li><strong>버튼 크기 — PC 크기를 그대로 따른다(공통, 미디어쿼리 없음)</strong><ul><li>버튼은 DS 크기 SM 36 / MD 48을 <strong>PC·모바일 같은 값</strong>으로 쓴다. 모바일이라고 버튼을 키우지 않는다(입력칸이 48로 커져도 버튼은 그대로)</li><li><strong>예외는 하나 — 하단 고정 버튼과 바텀시트 하단 버튼은 LG 54</strong></li><li>입력칸 옆 버튼(우편번호 등)은 SM 36 그대로 두고 <strong>입력칸 높이의 가운데에 세로 정렬</strong>(<span class="mono">align-items:center</span>) — PC(입력 40)·모바일(입력 48) 모두 같은 방식</li><li>화면 폭에 따라 크기가 바뀌는 것은 입력류(3-2)뿐이다. 페이지별 예외를 두지 않아 공통 CSS 한 곳에서 관리한다(퍼블 요청)</li></ul></li><li><strong>모바일 하단 고정 버튼 영역 여백</strong>: 위 32 / 좌우 20 / <strong>아래 20 + safe-area</strong><ul><li><span class="mono">padding:32px 20px calc(20px + env(safe-area-inset-bottom))</span></li><li>viewport 메타에 <span class="mono">viewport-fit=cover</span> 필수(없으면 <span class="mono">env()</span> 값이 0)</li><li>아래 20이 필요한 이유: 안드로이드·인앱 브라우저는 safe-area가 0이라 버튼이 브라우저 하단 툴바에 붙는다</li><li>바텀시트·검색 시트 하단 버튼은 <strong>위·아래 32</strong> 그대로. 페이지 하단 버튼만 20인 이유는 스크롤 중인 본문을 계속 가리기 때문(32면 본문 가림 118px, 홈 표시줄 기기 152px)</li></ul></li><li><strong>모바일 본문 맨 아래 일반 버튼</strong>(주문목록·회수목록 등, 고정 아님): 영역 여백 <strong>위 48 / 아래 20</strong></li><li>근거: Figma 주문요청관리 대여 상세 신규배정 모바일 <span class="mono">6534:185304</span>(<span class="mono">buttonArea</span> 32/20/20/20), 주문완료 <span class="mono">6523:27942</span></li></ul><p class="proto-ref">→ <span class="mono">order-detail-mobile.html</span>, <span class="mono">action-button-placement-demo.html</span></p>' },
  s35: { title:"3-5. 팝오버 / 바텀시트", html:
    '<p>같은 안내 정보가 PC에서는 트리거에 붙는 <strong>팝오버</strong>, 모바일(1024px 이하)에서는 <strong>바텀시트</strong>로 열린다. 안의 구성(타이틀·리스트·안내)은 PC·모바일 같고 담는 그릇만 바뀐다.</p><table class="policy-table"><thead><tr><th></th><th>PC (1025px 이상)</th><th>모바일 (1024px 이하)</th></tr></thead><tbody><tr><td>형태</td><td>트리거 바로 아래 <strong>4px</strong>에 붙는 팝오버, 트리거 왼쪽 정렬. 화면 밖으로 넘치면 반대쪽으로</td><td>바텀시트</td></tr><tr><td>여는 법</td><td><strong>정보 팝오버</strong>(타이틀 + 닫기, 예: 도서산간비 안내): <strong>클릭</strong>&lt;br&gt;<strong>짧은 아이콘 안내</strong>(한두 줄): 호버 200ms 뒤 열림 / 벗어나고 300ms 뒤 닫힘, 다른 아이콘으로 옮기면 즉시 교체. 클릭으로도 동작</td><td>탭(툴팁도 탭 → 바텀시트)</td></tr><tr><td>닫는 법</td><td>닫기(X), 바깥 클릭, ESC</td><td>닫기(X), 하단 "확인", 딤 탭</td></tr><tr><td>폭</td><td>정보 팝오버 <strong>340</strong>, 짧은 안내 260</td><td>화면 폭</td></tr></tbody></table><ul><li><strong>트리거</strong>: 글자 + 정보 아이콘 24(글자 14px <span class="mono">#555</span>). 호버에만 의존하지 않는다(1번 — 폭 기준이지 입력장치 기준이 아님)</li><li><strong>PC 팝오버 그릇</strong>: 폭 340, 패딩 24/20, radius <strong>16</strong>, 흰 배경, 테두리 1px <span class="mono">#bdbdbd</span>, 그림자 <span class="mono">0 8px 24px rgba(0,0,0,.2), 0 0 4px rgba(0,0,0,.12)</span></li><li><strong>안의 구성 — 타이틀이 있는 리스트형</strong>(PC·모바일 같은 값)<table class="policy-table"><thead><tr><th>요소</th><th>규칙</th></tr></thead><tbody><tr><td>타이틀 줄</td><td>높이 32. 타이틀 20px Bold <span class="mono">#1a1a1a</span> 왼쪽, 닫기 아이콘 32(<span class="mono">#333</span>) 오른쪽, <strong>세로 가운데 정렬</strong>, 사이 12</td></tr><tr><td>타이틀–리스트 간격</td><td>PC 팝오버 <strong>12</strong> / 모바일 바텀시트 <strong>16</strong></td></tr><tr><td>리스트 박스</td><td>배경 <span class="mono">#f5f5f5</span>, radius 4, 패딩 8/12. 행 높이 32(위아래 4). <strong>항목 이름 왼쪽</strong>(16px Regular <span class="mono">#555</span>, 남는 폭 차지) / <strong>값 오른쪽</strong>(16px Bold <span class="mono">#1a1a1a</span>), 사이 4, 세로 가운데</td></tr><tr><td>보조 설명</td><td>항목 이름 바로 아래 한 줄, 14px <span class="mono">#999</span>(그 행만 높이 52)</td></tr><tr><td>※ 안내</td><td>리스트 박스 아래, 위아래 8, 줄 간격 4, 14px <span class="mono">#555</span></td></tr><tr><td>하단 버튼</td><td>모바일 바텀시트만 "확인" LG 54(18px SemiBold), 영역 위아래 32. PC 팝오버는 버튼 없음</td></tr></tbody></table></li><li>달력·셀렉트 드롭다운: 모바일은 트리거와 같은 좌우 폭(<span class="mono">left:0;right:0</span>), PC만 고정폭(예: 달력 320px)</li><li><strong>바텀시트 공통 스펙</strong><ul><li>상단 모서리 반경 <strong>40px</strong>, 드래그 핸들 없음(타이틀 + X 닫기로 시작)</li><li>타이틀 위 여백 <strong>32px</strong> = 바깥 래퍼 12 + 안쪽 콘텐츠 래퍼 20 — 이중 래퍼 구조를 그대로 구현. 좌우 20</li><li>높이는 고정 px 없이 화면 비율로 최대 높이를 두고, 넘치면 <strong>콘텐츠 영역만 스크롤</strong>(타이틀·하단 버튼 고정)</li><li>하단 버튼 영역 위·아래 32</li></ul></li><li>오버레이는 하나만 — 새로 열리면 기존 것이 닫힌다(3-3)</li><li>근거: Figma <span class="mono">팝오버_도서산간비</span>(상품 상세 &gt; 배송 <span class="mono">7359:36899</span>, 주문신청 <span class="mono">7445:45682</span>), <span class="mono">바텀시트_도서산간비</span>(<span class="mono">7445:47717</span>) / DS "바텀시트 스크롤 정의"(<span class="mono">8990:16490</span>)의 232/442px·"380" 메모는 쓰지 않음 / DS "모바일 툴팁" 주석. Figma 트리거 글자 13px은 6-6에 맞춰 14px로</li></ul><p class="proto-ref">→ <span class="mono">popover-bottomsheet-compare-demo.html</span>, <span class="mono">order-detail-mobile.html</span>, <span class="mono">order-list-adaptive.html</span>, <span class="mono">rental-return-list.html</span></p>' },
  s36: { title:"3-6. 페이지네이션 — 기본형 / 축약형", html:
    '<p><strong>형태는 둘이다.</strong> PC 페이지 목록은 번호를 보여 주는 <strong>기본형·조합형(32)</strong>, 모바일 목록과 모든 팝업 안 목록은 <strong>축약형(48)</strong>.</p><table class="policy-table"><thead><tr><th>형태</th><th>쓰는 곳</th><th>모양</th></tr></thead><tbody><tr><td><strong>기본형·조합형</strong></td><td>PC 페이지 목록(1025px 이상)</td><td>‹ 번호 ›. 조합형은 3분할(<span class="mono">justify-content:space-between</span>) — 왼쪽 "전체 N/M" · 가운데 번호 · 오른쪽 "N개씩"</td></tr><tr><td><strong>축약형</strong></td><td>모바일 페이지 목록(1024px 이하) + 모달·바텀시트 안 목록(PC·모바일 모두)</td><td>‹ 현재 / 전체 ›</td></tr></tbody></table><p><strong>기본형·조합형(PC)</strong></p><ul><li>칸 <strong>32×32, radius 4</strong>(원형·알약 아님), 칸 사이 4. 화살표는 테두리 없는 아이콘 버튼(아이콘 24)</li><li>번호 14px — 현재 페이지 <span class="mono">#eff1fd</span> + <span class="mono">#141e76</span> <strong>SemiBold</strong>(브랜드색으로 채우지 않음), 나머지 <strong>Regular</strong> <span class="mono">#1a1a1a</span>. 호버 <span class="mono">#eff1fd</span></li><li><strong>노출 규칙</strong>: 7페이지 이하는 전부. 8페이지부터 말줄임(…) — 현재가 앞쪽이면 <span class="mono">1 2 3 4 5 … 끝</span>, 가운데면 <span class="mono">1 … 앞 현재 뒤 … 끝</span>, 뒤쪽이면 <span class="mono">1 … 끝-4 ~ 끝</span>. 첫·끝 번호는 항상 표시</li><li>결과가 없어도 영역은 항상 보이고 "전체 0/0"만 표시. 데이터가 1건이라도 있으면 번호 "1" 표시</li></ul><p><strong>축약형(모바일 목록 · 팝업 안)</strong></p><ul><li>화살표 영역 <strong>48×48</strong>, 아이콘 <strong>32</strong> — 화면 폭과 관계없이 <strong>하나</strong>(버튼 크기는 기기별로 바꾸지 않는다, 3-0·3-4). PC 모달 안도 48</li><li>가운데 "현재 / 전체"는 <strong>표시용 글자</strong>(누를 수 없음, 버튼·호버 없음). <strong>18px</strong> — 현재 <span class="mono">#1a1a1a</span> <strong>SemiBold</strong>, "/"·전체 <span class="mono">#999</span> Regular, 사이 8, 좌우 8</li><li>크기를 최대로 둔 이유: 목록 맨 아래 혼자 떨어진 요소라 <strong>누르기 쉽고 잘 보여야</strong> 한다. 48은 모바일 뒤로가기(3-11)와 같은 터치 크기</li><li>모바일 목록: 카드 <strong>20개</strong>마다 한 페이지, 마지막 카드 아래 위·아래 여백 <strong>32</strong></li><li>팝업 안: 목록 아래 영역(bg <span class="mono">#fafafa</span>, radius 4, 위아래 16)</li><li><strong>0건이면 숨김</strong>(빈 화면 안내만). 1페이지뿐이면 ‹ 1 / 1 › 화살표 둘 다 비활성</li><li><strong>모바일 눌림 효과</strong>: 화살표를 누르는 순간만(<span class="mono">:active</span>) 배경 <span class="mono">#eff1fd</span>(radius 4, DS <span class="mono">part/Pagination Control</span> Hover:Active 상태), 손을 떼면 사라진다. hover 효과 없음, 비활성 화살표는 효과 없음. 브라우저 기본 탭 하이라이트는 끈다(<span class="mono">-webkit-tap-highlight-color: transparent</span>)</li></ul><p><strong>공통</strong></p><ul><li>첫 페이지 ‹ · 마지막 페이지 › 는 <strong>비활성</strong> — 아이콘 <span class="mono">#bdbdbd</span>, 호버·클릭 없음(<span class="mono">disabled</span>/<span class="mono">aria-disabled</span>). 숨기지 않아 위치가 흔들리지 않는다</li><li>페이지를 넘기면 목록 맨 위로(모바일은 고정된 탭 바로 아래, 3-9). 주소에 <span class="mono">?page=</span>를 남겨 상세에서 돌아와도 같은 페이지·같은 위치</li><li>왜 모바일은 축약형인가: 모바일 업무는 최신 건 확인·필터로 좁히기·상세 다녀오기가 대부분이라 멀리 건너뛸 일이 적고, 번호형은 360 화면에서 칸이 좁아 잘못 누르기 쉽다. 축약형은 계산이 없고(이전·다음 + 현재/전체) 팝업 안과 같은 부품이라 관리가 단순하다. 페이지 이동이 꼭 필요한 화면이 생기면 "현재 / 전체"를 눌러 페이지를 고르는 옵션 시트(3-3)를 더한다</li><li>무한 스크롤은 쓰지 않는다(PHP 한 페이지 구조에서 따로 불러오는 API·뒤로 가기 위치 복원이 필요해짐). 예외: 상품 카드 그리드(9-3)</li><li>근거: DS <span class="mono">Pagination</span>(<span class="mono">64Q1Re56aiAA8Al89pqjnV</span> <span class="mono">8462:8629</span> — Default·Combination·<strong>Compact</strong>), <span class="mono">part/Pagination Control</span> Disabled, 모바일 시안(운영 디자인 <span class="mono">6442:44606</span>) / DS 웹 문서 코드의 활성색 <span class="mono">#e3e5f5</span>·번호 SemiBold는 Figma에 맞춰 수정 필요</li></ul><p class="proto-ref">→ <span class="mono">pagination-compare-demo.html</span>, <span class="mono">order-list-adaptive.html</span>, <span class="mono">rental-return-list.html</span></p>' },
  s37: { title:"3-7. 검색 영역 (리스트 화면 전용 — 적응형)", html:
    '<p>PC 검색 패널과 모바일 필터칩 + 바텀시트를 <strong>둘 다 두고 1024/1025px에서 표시만 전환</strong>한다(2번 적응형). 사업소처럼 <strong>PC 페이지 안에 모바일 구조를 함께 넣고</strong> 1024px 이하에서 전환하는 방식이며, 모바일을 별도 페이지로 만들지 않는다.</p><p><strong>PC — 검색 패널</strong></p><ul><li>패널: bg <span class="mono">#fafafa</span>, 테두리 1px <span class="mono">#bdbdbd</span>, radius 4, 패딩 16</li><li>행: 높이 44(패딩 12/0), 아래 구분선 1px <span class="mono">#eee</span>. 2열 배치(각 50%), 옵션이 많으면 한 행 전체폭</li><li>라벨: <strong>120px 고정</strong>, 14px SemiBold <span class="mono">#1a1a1a</span> (3-2 입력필드 라벨 125px와 다른 값)</li><li><strong>날짜 행</strong>(첫 행, 높이 64): 라벨 + [날짜 기준 셀렉트 160] + [시작일 160 <span class="mono">~</span> 종료일 160, 달력 아이콘 24, <span class="mono">yyyy-mm-dd</span>] + [기간 세그먼트], 요소 간격 12. 입력류 테두리 <span class="mono">#333</span>, 패딩 8/12<ul><li><strong>세그먼트</strong>: 테두리 <span class="mono">#616161</span>, 패딩 4, radius 4, 칸 68×32. 선택 칸 bg <span class="mono">#e0e0e0</span> + SemiBold <span class="mono">#1a1a1a</span>(양옆 구분선 숨김), 미선택 Regular <span class="mono">#616161</span> + 칸 사이 1×12 구분선 <span class="mono">#eee</span></li><li><strong>구성은 화면마다 다르다</strong>(통일하지 않음, 화면별 Figma를 따름)<table class="policy-table"><thead><tr><th>화면</th><th>기간 버튼</th></tr></thead><tbody><tr><td>입출고 창고</td><td>오늘 / 어제 / 일주일 / 지난달 / 3개월</td></tr><tr><td>주문요청관리(4-2)</td><td>3개월 / 일주일 / 이번달 / 지난달 / 1년</td></tr><tr><td>회수 관리(4-4)·반품/AS</td><td>일주일 / 1개월 / 3개월 / 6개월 / 1년</td></tr></tbody></table></li><li><strong>기본값이 있는 화면은 처음부터 선택된 상태</strong>로 보이고 날짜 칸도 그 기간으로 채운다</li><li>세그먼트를 누르면 날짜 자동 입력, 날짜를 직접 고치거나 달력에서 고르면 세그먼트 선택 해제</li></ul></li><li><strong>체크박스 옵션</strong>(복수 선택): 기본은 "전체"만 체크. 다른 항목을 누르면 "전체" 해제, "전체"를 누르면 그 행 전체 체크(다시 누르면 전체 해제), 개별 항목이 모두 체크되면 "전체"도 자동 체크. 항목 간격 16, 체크박스 20×20 radius 4(미선택 테두리 <span class="mono">#616161</span>, 선택 <span class="mono">#323da3</span> 채움 + 흰 체크 16), 체크박스–글자 8, 14px</li><li><strong>셀렉트·달력은 DS 컴포넌트</strong>(네이티브 <span class="mono">&lt;select&gt;</span>·<span class="mono">&lt;input type=date&gt;</span> 금지, 6-2)<ul><li>셀렉트(SelectField 160×40, 테두리 <span class="mono">#333</span>): 열리면 <strong>2px <span class="mono">#323da3</span></strong> + 화살표 180° 회전. 옵션 패널 = 아래 8px, 테두리 <span class="mono">#616161</span>, radius 4, 패딩 8, 최대 높이 210 스크롤, 항목 패딩 9/8·간격 4, 호버·선택 bg <span class="mono">#eff1fd</span>, 선택 항목 <span class="mono">#323da3</span> Bold + 오른쪽 체크 24</li><li>달력(DS <span class="mono">calendar_Default</span>): 날짜 칸 아래 팝오버. 헤더 이전/다음 40×40 + "M월" 18px Heavy, 요일 줄 bg <span class="mono">#f5f5f5</span> 12px Medium, 날짜 칸 높이 40·원 32, 14px SemiBold <span class="mono">#555</span>, 이전/다음 달 <span class="mono">#bdbdbd</span>, 호버 <span class="mono">#f2fde4</span>, 오늘·선택 <span class="mono">#90ee02</span></li></ul></li><li><strong>검색어 행</strong>(높이 64): 셀렉트 160×40 + 입력 264×40(테두리 <span class="mono">#616161</span>), 간격 8, 좌우 패딩 12, placeholder <span class="mono">#bdbdbd</span>. 셀렉트 옵션은 <strong>그 화면 테이블의 식별 컬럼 이름</strong>을 쓴다(예: 회수 관리 = 수급자 / 요양인정번호 / 연락처 / 돌봄 회수 신청번호 / 원 주문번호, 입출고 창고 = 전체 / 바코드 / 상품명 / 사업소명)</li><li>하단 버튼: 가운데 정렬, 위 패딩 16, 간격 10 — 초기화(외곽선) + 검색(채움) <strong>각 130×36</strong>, 14px SemiBold</li><li><strong>접기 버튼</strong>(오른쪽 위): bg <span class="mono">#eee</span>, 높이 36, 패딩 8/16, radius 4, 14px SemiBold <span class="mono">#555</span> + 채움 삼각형 16<ul><li>펼친 상태 "접기 ▲", 접힌 상태 "상세 ▼"</li><li>접으면 첫 행(날짜)과 검색·초기화 버튼만 남는다</li><li><strong>기본은 펼침</strong>(입고처리·주문요청관리·회수 관리 등). 예외: 수급자 목록(3-10)의 상세 조건 패널은 접힘</li></ul></li></ul><p><strong>모바일 — 필터칩 + 적용 태그 + 바텀시트</strong></p><ul><li>① <strong>필터칩 줄</strong>(높이 56): bg <span class="mono">#fafafa</span>, 아래 구분선 <span class="mono">#eee</span>, 패딩 12/0/12/20, 칩 간격 6, 가로 스크롤<ul><li>칩: 높이 <strong>32</strong>, radius 999, 패딩 4/12/4/16, 14px + chevron-down 20</li><li><strong>표기: 기본값("전체")일 때 "이름 : 값"</strong>(예: "상태 : 전체"), <strong>값을 고르면 값만</strong>(예: "반품접수 확인")</li><li>기본값 칩: 흰 배경 + 테두리 <span class="mono">#e0e0e0</span> + Regular / 값 선택 칩: bg <span class="mono">#f5f5f5</span> + 테두리 <span class="mono">#999</span> + SemiBold</li><li>오른쪽 끝에 <strong>"검색" 칩 고정</strong>(필터 아이콘 24 + 글자), 그 앞 28px 페이드</li></ul></li><li>② <strong>적용 태그 줄</strong>(높이 48, 적용된 조건이 있을 때만): 태그 = bg <span class="mono">#eff1fd</span> 알약(radius 999, 높이 32, 14px SemiBold <span class="mono">#141e76</span>, 패딩 4/4/4/8) + X 20, 간격 4, 가로 스크롤. X로 개별 해제. 오른쪽 끝 "초기화"(reset 아이콘 24 + 14px) 고정</li><li>③ <strong>건수</strong>(높이 56): 16px Regular <span class="mono">#616161</span>, 왼쪽 패딩 20. 오른쪽에 정렬 셀렉트를 둘 수 있음</li><li>칩 탭 → <strong>단일 선택 시트</strong>: 3-5 바텀시트 + 타이틀 20px Bold + 닫기 32. 옵션 행 패딩 10/8/10/12, 간격 6, radius 4, 16px. <strong>현재 값(기본 "전체")이 처음부터 선택 표시</strong> — 선택 행만 틴트 <span class="mono">#eff1fd</span> + 글자 <span class="mono">#141e76</span> + 체크. 하단 "선택완료"(풀폭, 높이 54, 18px SemiBold)</li><li>"검색" 칩 탭 → <strong>검색 시트</strong><ul><li>섹션(타이틀 18px SemiBold, 섹션 간격 24, 타이틀–옵션 12)마다 <strong>버튼 그리드</strong>: 옵션 4개면 2열, 3개면 3열, 간격 8. 버튼 패딩 12/16, radius 4, 미선택 테두리 <span class="mono">#bdbdbd</span> + 16px Regular <span class="mono">#616161</span>, 선택 테두리 <span class="mono">#333</span> + SemiBold <span class="mono">#333</span></li><li><strong>날짜 섹션</strong>: 기간 버튼 + 시작일 <span class="mono">~</span> 종료일(테두리 <span class="mono">#bdbdbd</span>, 패딩 12, 16px, 달력 아이콘). <strong>"직접선택"일 때만 날짜 칸 활성</strong>(그 외엔 글자 <span class="mono">#bdbdbd</span>), 기본 기간이 있으면 처음부터 선택 상태. 날짜 칸을 누르면 <strong>달력 바텀시트</strong>("yyyy-MM" 헤더, 하단 "선택완료")가 검색 시트 <strong>대신</strong> 열리고, 선택완료·닫기 시 검색 시트로 돌아온다. 기간 버튼 구성은 DS 모바일 정의(일주일 / 이번달 / 3개월 / 직접선택) 또는 화면별 Figma를 따른다</li><li>마지막에 "상세검색" 입력(테두리 <span class="mono">#bdbdbd</span>, 패딩 12). 안내 문구에는 그 화면의 검색 대상을 쓴다(예: "수급자명, 회수번호, 요양인정번호 검색")</li><li>하단 고정 버튼(위·아래 32, 흰 그라데이션): 초기화 <strong>120px</strong>(bg <span class="mono">#eee</span> / 글자 <span class="mono">#555</span>) + 검색(나머지 폭, 브랜드색), 높이 54</li><li>콘텐츠만 스크롤, 타이틀·하단 버튼 고정(3-5)</li></ul></li><li><strong>모바일 필터는 모두 단일 선택</strong>(PC 체크박스 복수 선택과 다름). 시트 그림자 <span class="mono">0 8px 24px rgba(0,0,0,.2), 0 0 4px rgba(0,0,0,.12)</span>, 오버레이는 하나만</li><li>화면별 옵션 값(참고): 입고처리 회수 상태 = 회수요청 / 회수준비중 / 회수완료 / 입고완료. 입고처리 Figma는 상품유형·입고경로 옵션명이 PC·모바일에서 다르게 그려져 있어 확인 필요(7번)</li><li>근거: Figma 입출고 창고 <span class="mono">입고처리</span>·<span class="mono">입고대기</span>·<span class="mono">입고대기_검색</span>·<span class="mono">입고대기_상품유형</span>, 날짜 행 <span class="mono">9865:63366</span> / DS 모바일 검색 필터 <span class="mono">8608:13146</span>, 달력 시트 <span class="mono">8607:12083</span>, <span class="mono">calendar_Default</span> <span class="mono">6240:8714</span></li></ul><p class="proto-ref">→ <span class="mono">search-filter-compare-demo.html</span></p>' },
  s41: { title:"4-1. 대여 회수 상세보기", html:
    '<p><strong>상태별 표시</strong></p><table class="policy-table"><thead><tr><th>상태</th><th>상단 버튼(PC 오른쪽 위 / 모바일 하단 고정)</th><th>회수번호</th><th>신청자 정보</th></tr></thead><tbody><tr><td>회수접수</td><td>회수 접수 확인</td><td><span class="mono">-</span></td><td>이름 마스킹, 요양인정번호·연락처·회수지주소 <span class="mono">-</span></td></tr><tr><td>회수확인중</td><td>회수접수 취소 + <strong>이로움에 회수 요청</strong></td><td><span class="mono">-</span></td><td>전체 노출, 회수지 수정 가능</td></tr><tr><td>회수요청</td><td><strong>회수요청 취소</strong></td><td>번호 노출</td><td>전체 노출, 회수지 수정 가능</td></tr><tr><td>회수준비중 · 회수완료</td><td>없음</td><td>번호 노출</td><td>전체 노출</td></tr><tr><td>회수취소</td><td>없음</td><td><span class="mono">-</span> (회수요청 전 취소라 미발급)</td><td>전체 노출</td></tr><tr><td>회수취소완료</td><td>없음</td><td>번호 노출</td><td>전체 노출</td></tr></tbody></table><ul><li><strong>회수번호는 회수요청 시점에 발급</strong>된다. 목록(4-4)의 "돌봄 회수 신청번호"(<span class="mono">COL…</span>, 모든 상태 노출)와 다른 번호</li><li>버튼이 없는 상태에서는 비활성 버튼이나 툴팁도 노출하지 않는다</li><li>회수요청 취소는 <strong>사유를 받지 않는다</strong>(접수 취소와 다름)</li><li>회수취소 상태는 상품 정보 영역(상품명 아래)에 "회수접수 취소 사유 : …"를 배경 없는 한 줄로 표시</li><li>본문 맨 아래 "회수목록" 버튼(3-4, 3-11)</li></ul><p><strong>정보 영역</strong></p><ul><li>회수 신청 정보: 회수 신청일시 / 돌봄 회수 신청번호 / 이로움 원 주문번호(링크) / 회수번호</li><li>신청자 정보: 수급자 이름 / 요양인정번호 / 보호자 이름 / 상담받을 연락처 / 회수지주소. PC는 2쌍/행(3-11), 회수지주소는 한 줄 전체</li><li><strong>회수지주소</strong>: PC는 주소 오른쪽 같은 줄 끝에 <strong>"회수지 수정"</strong> 버튼(회색 채움, bg <span class="mono">#eee</span> / 글자 <span class="mono">#555</span>), 모바일은 주소 아래에 버튼</li><li>모바일에서는 회수 신청 정보·신청자 정보를 접고 펼칠 수 있다(PC는 항상 펼침)</li><li>회수사유: 읽기 전용 박스, 모바일은 박스 안에서 스크롤</li><li>메모: 사업소 내부용 입력(최대 1000자). <strong>입력하면 [메모등록] 활성</strong>, 등록된 메모마다 삭제 버튼</li></ul><p><strong>팝업</strong>(크기·버튼·바텀시트 규칙은 3-3)</p><table class="policy-table"><thead><tr><th>팝업</th><th>내용</th><th>모바일</th></tr></thead><tbody><tr><td>회수 요청하기 → 회수 요청 확인</td><td>2단계. 회수 사유 셀렉트(사망 / 병원·요양원 입소 / 이사 / 그 외, 기본 문구 "사유를 선택해 주세요") + 전체 동의·하위 동의 연동. 동의 전에는 확인 비활성</td><td>모달(선택만)</td></tr><tr><td>회수접수 취소</td><td>취소 사유 셀렉트. "기타(직접 입력)"를 고르면 상세 사유 입력(최대 200자) + "입력된 사유는 돌봄앱 사용자에게 노출됩니다" 안내. 버튼 취소 / 저장</td><td><strong>바텀시트</strong>, 셀렉트는 옵션 시트</td></tr><tr><td>회수지 주소 수정</td><td>우편번호·기본 주소는 <strong>읽기전용</strong>(우편번호 버튼으로만 채움), 상세 주소 입력. 버튼 취소 / 수정</td><td><strong>바텀시트</strong></td></tr><tr><td>회수요청 취소</td><td>사유 없이 확인</td><td>모달</td></tr><tr><td>메모 삭제</td><td>삭제 확인</td><td>모달</td></tr><tr><td>회수 요청 불가 안내</td><td>서비스 불가 지역 등 — 브라우저 <span class="mono">alert()</span> 대신 이 팝업</td><td>모달</td></tr><tr><td>이로움돌봄 주문건 회수 안내</td><td>닫기 / 계속 진행</td><td>모달</td></tr></tbody></table><ul><li>결과 알림은 Toast(9-3): 회수접수 취소 완료, 회수지 주소 저장, 메모 저장 성공·실패</li><li>근거: Figma "260907 돌봄 대대여 사업소 연동" &gt; 이로움돌봄 회수 관리(<span class="mono">6613:190424</span>) — 회수접수 <span class="mono">6534:177679</span>, 회수확인중 <span class="mono">6543:76520</span>, 회수요청 <span class="mono">6543:79003</span>, 모달 <span class="mono">6613:194023</span>, 모바일 회수접수 취소 <span class="mono">7317:76226</span></li></ul><p class="proto-ref">→ <span class="mono">rental-return-detail-prototype.html</span></p>' },
  s42: { title:"4-2. 주문요청관리 리스트", html:
    '<p>적응형(PC 테이블 / 모바일 카드, 3-7·3-9). <strong>구입 주문 / 대여 주문</strong> 두 유형을 오간다.</p><p><strong>PC</strong></p><ul><li><strong>꺽쇠 탭</strong>: 활성 탭만 좌·우·위 2px 테두리, 아래 테두리 없음. 탭 그룹 전체가 아래 2px 선 하나를 공유</li><li>검색 패널(3-7): <strong>기본 펼침</strong> — 주문일자(날짜 2개 + 기간 3개월[기본] / 일주일 / 이번달 / 지난달 / 1년), 품목(대여만, 라디오 전체 / 전동침대 / 수동휠체어 / 경사로 — "경사로"·"실외경사로" 명칭 확인 중, 7번), 주문상태, 검색어</li><li>테이블 컬럼: NO / 품목(대여만) / 수급자 / 요양인정번호 / 휴대폰번호 / 돌봄주문번호 / 주문번호 / 주문상태 / 주문일시. 행 호버 bg <span class="mono">#eff1fd</span>, 행 클릭 → 주문요청관리 상세</li><li><strong>주문번호</strong>: 주문완료 / 출고준비중 / 출고완료 / 배송완료 / 취소요청 / 취소완료에서만 노출(밑줄 링크 → 대대여 이용현황 상세, 행 클릭과 목적지가 다름). 신규배정 / 주문확인중 / 주문취소는 <span class="mono">-</span></li></ul><p><strong>모바일</strong></p><ul><li>페이지 제목 20px Bold</li><li><strong>구입/대여 토글</strong>: 풀폭 세그먼트 — 트랙 높이 52(bg <span class="mono">#eee</span>, 안쪽 여백 4), 선택 버튼 높이 44·bg <span class="mono">#323da3</span>·16px Bold. 타이틀 아래·필터칩 위에 두고 필터칩 줄과 같은 bg <span class="mono">#fafafa</span>, 사이 구분선 없음. 선택 표시는 CSS 비율(<span class="mono">calc(50% - 4px)</span> + <span class="mono">translateX</span>)로 — 창 크기가 바뀌어도 어긋나지 않게</li><li>필터칩: 품목(대여만) / 상태 / 검색</li><li>카드: 헤더 = 상태칩 + 신청일시, 본문 = 수급자명(마스킹) + L번호 / 품목 / 상품정보. 패딩 16 16 24 16(3-8)</li><li><strong>터치 영역 3개</strong>: 카드 전체 → 상세, 주문번호 → 이용현황, 함께 요청 → 바텀시트. 목적지가 다르므로 <span class="mono">stopPropagation()</span> 필수</li><li>바텀시트 4종<ul><li>검색: 주문 요청일(일주일 / 이번달 / 지난달, 3개월[기본] / 1년 / 직접선택 — 2줄) + 날짜(직접선택일 때만 활성) + 품목 + 주문 진행상태 + 상세검색("수급자명, 주문번호, 요양인정번호 검색")</li><li>품목 선택, 주문상태 선택(전체 + 9개 상태) — 선택 행 틴트 + 체크(3-7)</li><li>함께 요청(아래)</li></ul></li><li>페이지네이션: 축약형(3-6)</li></ul><p><strong>함께 요청(묶음 주문)</strong></p><ul><li>같은 수급자 + 같은 시간대 주문서는 한 묶음. 묶음 행(카드) 배경을 <span class="mono">#eff1fd</span> → <span class="mono">#e8f5e9</span> 교차로 칠해 묶음 경계를 구분(PC 행·모바일 카드 같은 로직)</li><li>표시: 주문서번호 오른쪽 link-2 아이콘(24, 히트 영역 28×28) + 숫자 배지(<strong>본인 제외</strong> 건수, 원형 min-width 14, bg <span class="mono">#323da3</span>, 흰 9px Bold). 단일 품목 건은 표시 안 함. 품목으로 검색·필터한 경우 배지는 보이되 배경 강조는 안 함</li><li>PC: 아이콘 호버 → 팝오버(3-5 지연 규칙). 모바일: "함께 요청 N건" 알약 → 바텀시트("동일 시간대에 요청된 묶음 주문 건", 항목마다 상품명 + 상태칩 + <span class="mono">&gt;</span>, 하단 "확인" 단일 버튼)</li><li>목록에는 <strong>현재 보고 있는 상품을 뺀 나머지</strong>만. 항목을 누르면 그 상품의 주문요청관리 상세로 이동</li><li>근거: Figma 주문요청 관리_대여 리스트(<span class="mono">6410:19835</span>) — PC <span class="mono">6340:14255</span>, 모바일 <span class="mono">6408:15421</span>, 가이드 <span class="mono">6410:19836</span>·<span class="mono">6447:11039</span></li><li><strong>구입 탭</strong>: 구입 주문 행을 누르면 상세는 4-5(주문요청관리 상세 — 구입)</li></ul><div class="info-note"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M12 11v6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="7.5" r="1.2" fill="currentColor"/></svg><div>현행 구입 리스트(개발 화면, 2026-10-07)가 이 조항과 다른 점: 구입/대여 탭 없음(2026.08 대대여 연동에서 추가 예정), 타이틀 \'주문요청 관리\' + [사용방법 확인하기], 브레드크럼 \'돌봄앱 운영관리 &gt; 주문요청 관리\', 컬럼명 \'주문서번호\'(이 조항은 돌봄주문번호), 품목 없음, 주문상태 셀렉트 옆 안내 "선택된 상태값이 포함된 모든 주문건이 검색됩니다." (4-5)</div></div><p class="proto-ref">→ <span class="mono">order-list-adaptive.html</span></p>' },
  s43: { title:"4-3. 주문요청관리 상세 — 대여", html:
    '<p>반응형 한 페이지(PC 콘텐츠 1060px). 구성: 주문정보 → 주문상품(+ 설치옵션, 배송희망일, 총 대여 금액) → 배송정보 → 본문 맨 아래 "주문목록".</p><p><strong>상태별 표시</strong></p><table class="policy-table"><thead><tr><th>상태</th><th>상단 버튼</th><th>주문번호</th><th>총 대여 금액</th><th>배송희망일</th><th>배송정보 변경</th></tr></thead><tbody><tr><td>신규배정</td><td>주문취소 + <strong>주문정보확인</strong></td><td><span class="mono">-</span></td><td>없음</td><td>없음</td><td>없음</td></tr><tr><td>주문확인중</td><td>주문취소 + <strong>주문하기</strong></td><td><span class="mono">-</span></td><td>요양정보 조회 후</td><td><strong>편집</strong></td><td>가능</td></tr><tr><td>주문완료</td><td>없음</td><td>노출</td><td>있음</td><td>읽기전용*</td><td>가능</td></tr><tr><td>출고준비중 · 출고완료 · 배송완료 · 취소요청</td><td>없음</td><td>노출</td><td>있음</td><td>읽기전용</td><td>없음</td></tr><tr><td>주문취소</td><td>없음</td><td><span class="mono">-</span></td><td>없음</td><td>없음</td><td>없음</td></tr><tr><td>취소완료</td><td>없음</td><td>노출</td><td>없음</td><td>없음</td><td>없음</td></tr></tbody></table><p>\\* 주문완료 이후 배송희망일은 잠기지만, "배송정보 변경하기"로 들어가면 폼 안에서 함께 수정할 수 있다</p><ul><li>상단 버튼 위 <strong>안내 말풍선</strong>: 신규배정 "\'주문정보 확인\' 버튼을 눌러야 정보를 확인할 수 있습니다.", 주문확인중 "\'요양정보\'를 조회해야 주문이 가능합니다." 모바일은 타이틀 아래 버튼 줄 위(3-4 예외)</li><li>신규배정은 수급자·보호자 이름·연락처 마스킹, 요양인정번호 <span class="mono">-</span>. 주문확인중부터 전체 노출 + 요양인정번호 옆 <strong>"조회"</strong> 버튼(요양정보 조회)</li><li>주문확인중: 대여 안내 띠("대여 주문은 품목별 1개, 수량 1개 단위로 진행됩니다."), <strong>상품변경</strong> 버튼, 설치옵션 선택(셀렉트 + 선택 항목 X 삭제), 본인부담금. 주문완료 이후 설치옵션·상품은 읽기전용 목록</li><li>주문번호 옆 일시는 돌봄주문번호와 같은 <span class="mono">(yyyy-mm-dd hh:mm)</span> 형식</li><li>주문취소 상태는 "주문 취소 사유 : …" 한 줄 표시</li><li><strong>주문완료 결과 화면</strong>(주문하기 직후): 완료 안내 박스(체크 아이콘 + "주문이 완료되었습니다." + "\'상품준비중\' 상태로 진행됩니다.") + 주문상품 요약 + 본문 맨 아래 "주문 요청 상세" / "주문목록"</li><li><strong>배송정보 변경 폼</strong>: 이름* / 주소*(우편번호·기본주소 읽기전용 + 상세주소) / 전화번호 / 휴대폰번호* / 배송희망일(마감 안내 "내일부터 최대 14일 후까지, 오후 1시 마감") / 배송요청사항(셀렉트 + 직접 입력 "한글 20자, 영문 40자 이내"). 헤더 버튼 취소하기 / 저장하기. 모바일은 화면 폭에 맞게(3-2), 텍스트 칸에는 지우기 버튼(3-2)</li><li><strong>함께 요청</strong>: 돌봄주문번호 옆 아이콘. PC는 호버 팝오버, 모바일은 <strong>아이콘 아래 팝오버 카드</strong>(목록 화면의 바텀시트와 다름 — Figma 기준)</li></ul><p><strong>팝업</strong>(3-3)</p><table class="policy-table"><thead><tr><th>팝업</th><th>내용</th><th>모바일</th></tr></thead><tbody><tr><td>주문하기</td><td>"주문 완료 후에는 수량과 옵션을 변경할 수 없습니다…" 버튼 <strong>취소 / 주문하기</strong></td><td>모달</td></tr><tr><td>주문 불가 안내</td><td>요양정보 미조회, 급여 잔액 부족, 삭제된 주문 등 5종. 버튼 "확인"</td><td>모달</td></tr><tr><td>상품변경</td><td>라벨 "상품명", 검색 입력(MO 48, 돋보기, X 없음) + 결과 패널(SelectOption MO 44)에서 선택(3-3 검색 선택). 버튼 취소하기 / 상품 변경(선택 전 비활성)</td><td><strong>바텀시트</strong>(PC는 480 모달)</td></tr></tbody></table><ul><li>근거: Figma To-Be 주문요청 관리_대여(<span class="mono">6340:14254</span>) — 신규배정 <span class="mono">6481:16653</span>, 주문확인중 <span class="mono">6482:128078</span>·모바일 <span class="mono">6522:25439</span>, 주문완료 결과 <span class="mono">6523:27780</span>, 주문완료 <span class="mono">6591:179012</span>, 출고·배송·취소 섹션, 주문하기 모달 <span class="mono">6815:39967</span>, 주문불가 <span class="mono">6830:55874</span> 등</li></ul><p class="proto-ref">→ <span class="mono">order-detail-mobile.html</span></p>' },
  s44: { title:"4-4. 대여 회수 관리 리스트", html:
    '<p>적응형(PC 테이블 / 모바일 카드, 3-7·3-9). 대여 전용이라 구입/대여 토글은 없다.</p><p><strong>PC</strong></p><ul><li>검색 패널(3-7): <strong>기본 펼침</strong> — 회수 신청일(날짜 2개 + 기간 일주일 / 1개월 / 3개월[기본] / 6개월 / 1년), 회수 진행상태(전체 + 7개 상태), 검색어(수급자 / 요양인정번호 / 연락처 / 돌봄 회수 신청번호 / 원 주문번호)</li><li>테이블 컬럼: NO / 수급자 / 요양인정번호 / 연락처 / 돌봄 회수 신청번호 / 원 주문번호(밑줄 링크) / 회수상태 / 회수 신청일</li><li>PC에서도 수급자·요양인정번호·연락처 <strong>마스킹</strong>(홍\\*동, L123456\\*\\*\\*\\*, 010-\\*\\*\\*\\*-1234)</li><li>돌봄 회수 신청번호(<span class="mono">COL…</span>)는 <strong>모든 상태에서 노출</strong></li><li>결과 없음: 테이블 헤더 + "검색 조건에 맞는 회수 요청 내역이 없습니다."</li></ul><p><strong>모바일</strong></p><ul><li>필터칩: 기간(기본 3개월) / 상태(기본 "상태 : 전체") / 검색. "3개월" 칩을 누르면 날짜 검색 시트</li><li>카드: 헤더 = 상태칩 + 회수 신청일시, 본문 = 수급자명(마스킹) + L번호 / "돌봄주문 : RET-…". 함께 요청 없음</li><li>바텀시트: 검색(회수 신청일 버튼 2줄 + 날짜 + 회수 진행상태 + 상세검색 "수급자명, 회수번호, 요양인정번호 검색"), <strong>회수 진행상태 선택</strong>(전체 + 7개 상태)</li><li>페이지네이션: 축약형(3-6)</li><li>근거: Figma PC_이로움돌봄 회수 관리 - 리스트 — PC <span class="mono">6534:177232</span>, 모바일 <span class="mono">6542:28738</span>, 검색 시트 <span class="mono">6542:70590</span>, 상태 시트 <span class="mono">6542:28973</span></li></ul><p class="proto-ref">→ <span class="mono">rental-return-list.html</span></p>' },
  s45: { title:"4-5. 주문요청관리 상세 — 구입", html:
    '<p>반응형 한 페이지(PC 콘텐츠 1060px). 기준 화면은 <strong>개발 화면 캡처(2026-10-07, staging 주문 상세)</strong>이고, 퍼블 302와 다른 부분은 아래 9에 따로 적는다. 히스토리·문제 분석은 참고 문서(정책 아님) → <span class="mono">purchase-order-analysis.html</span></p><p><strong>0. 상태 라벨</strong> — 이 조항의 항목에는 아래 라벨 중 하나가 붙는다. 라벨이 없는 항목은 넣지 않는다</p><table class="policy-table"><thead><tr><th>라벨</th><th>의미</th><th>반영</th></tr></thead><tbody><tr><td><span class="mono">현행</span></td><td>개발 화면(2026-10-07)에 있는 그대로. 정책으로 확정된 것은 아님</td><td>사실 기록</td></tr><tr><td><span class="mono">확정</span></td><td>결정 기록(D 번호)으로 확정된 규칙</td><td>반영</td></tr><tr><td><span class="mono">정책 적용안</span></td><td>기존 확정 정책(3장·4-3)을 구입 주문에 적용한 안</td><td>적용 전 검토용</td></tr><tr><td><span class="mono">확인 필요</span></td><td>동작 의도 또는 미캡처 화면 — 개발·기획 확인 대기</td><td>표시만</td></tr><tr><td><span class="mono">진행 중</span></td><td>2026.10 운영 건(IS-1276)에서 바뀔 항목</td><td>내용 반영 금지 — 링크만</td></tr></tbody></table><p><strong>1. 화면 구성 (PC)</strong> <span class="mono">현행</span></p><table class="policy-table"><thead><tr><th>순서</th><th>영역</th><th>내용</th></tr></thead><tbody><tr><td>1</td><td>페이지 타이틀</td><td>주문 상세보기 + 브레드크럼 <strong>돌봄앱 운영관리 &gt; 주문요청 관리 &gt; 주문 상세보기</strong></td></tr><tr><td>2</td><td>상단 버튼</td><td>페이지 타이틀 아래 우측(상태별 — 아래 표)</td></tr><tr><td>3</td><td>주문정보 표</td><td>돌봄주문번호 · 주문정보확인 · 주문번호 · 주문상태(상태칩) — 2열 × 2행</td></tr><tr><td>4</td><td>수급자 정보 표</td><td>수급자(이름, 성별, 나이) · 요양인정번호 + [조회] · 연락처 · 보호자(이름, 연락처 / 관계)</td></tr><tr><td>5</td><td>안내 문구</td><td>※ 보호자(수급자)의 주문요청 시점과 이로움에 주문 시점 사이에 수급자의 계약 조건이 변경될 수 있습니다. <strong>주문 전, 반드시 요양정보를 다시 확인하시기 바랍니다.</strong>(밑줄)</td></tr><tr><td>6</td><td>주문상품</td><td>상품 행 목록(+ 주문확인중: [상품추가 +])</td></tr><tr><td>7</td><td>합계</td><td>총 판매 금액(급여가(정가) / 본인부담금(%)) — 주문확인중부터</td></tr><tr><td>8</td><td>배송정보</td><td>이름 · 주소 · 휴대폰번호 · 배송요청사항(+ 주문확인중: [변경하기])</td></tr><tr><td>9</td><td>하단</td><td>[주문목록]</td></tr></tbody></table><p><strong>상태별 차이</strong> <span class="mono">현행</span></p><table class="policy-table"><thead><tr><th>영역</th><th>주문접수(주문정보 확인 전)</th><th>주문확인중(주문정보 확인 후)</th></tr></thead><tbody><tr><td>상단 버튼</td><td>[주문취소] [주문정보확인] + 말풍선 "주문정보 확인 버튼을 눌러야 정보를 확인할 수 있습니다."</td><td>[주문취소] [주문하기] + 요양정보 조회 전 말풍선 "요양정보를 조회해야 주문이 가능합니다."</td></tr><tr><td>주문상태 칩</td><td>주문접수</td><td>주문확인중</td></tr><tr><td>수급자 정보</td><td>마스킹(김*환, 010-****-5678, 이*희) · 성별/나이·요양인정번호 \'-\' · [조회] 없음</td><td>이름·연락처·보호자 노출 · [조회]. 요양정보 조회 전에는 성별·나이·요양인정번호 \'-\', 조회 후 노출</td></tr><tr><td>상품 행</td><td>상태칩 · 상품명 · 판매 · 수량 N개 · 급여가(정가)만</td><td>아래 2의 행 구성 전체</td></tr><tr><td>상품추가 · 합계</td><td>없음</td><td>있음</td></tr><tr><td>배송정보</td><td>마스킹 · [변경하기] 없음</td><td>[변경하기]</td></tr></tbody></table><p><strong>주문하기 이후(상품준비 → 출고완료 → 배송완료)</strong> <span class="mono">현행</span></p><ul><li>주문상태 칩: 상품준비 · 출고완료 · 배송완료(색은 5장 구입 주문 상태). 상품 행에도 같은 칩</li><li>주문번호: 링크 + 주문일시 노출</li><li>상단 버튼 없음 · 스텝퍼·[삭제]·[상품추가]·배송정보 [변경하기] 없음 → 조회 전용</li><li>상품 행: 상태칩 · 상품명 · 옵션 · 판매 · 수량 N개 · 급여가/본인부담금</li><li><strong>최종 상품만 표시</strong> — 최초 요청 대비 변경 이력 없음</li></ul><p><strong>진행 조건</strong> <span class="mono">현행</span></p><ul><li>주문접수 → [주문정보확인]을 누르면 마스킹 해제 + 주문확인중으로 바뀐다</li><li>주문확인중 → 요양인정번호 [조회] 필수(요양정보조회 모달 → 공인인증서 비밀번호 입력). 조회 전 [주문하기]를 누르면 주문불가 모달</li></ul><p><strong>주문취소</strong> <span class="mono">현행</span> (Figma <span class="mono">12032:10031</span>)</p><ul><li>주문 전 취소(주문번호 \'- -\')와 주문 후 취소(주문번호 링크 + 주문일시) 두 경우. 주문상태 칩과 상품 행 칩 모두 \'주문취소\'</li><li>취소 후에도 수급자·보호자·배송정보는 마스킹(주문접수와 같음), 요양인정번호 \'- -\'</li><li>상품 행: 칩 · 상품명 · 옵션 · 판매 · 수량 N개 · 급여가(정가)만. 합계도 급여가(정가)만(본인부담금 없음)</li><li>상단 버튼 없음, 하단 [주문목록]</li><li><span class="mono">확인 필요</span> 주문 후 취소는 칩 옆에 취소 사유가 한 줄 말줄임(예: "관리자 상세화면에서 강제로 취소를 …") — 전체 사유를 어디서 보는지</li></ul><p><strong>2. 주문상품 행</strong> <span class="mono">현행</span> (주문확인중)</p><ul><li>행 구성: <span class="mono">이미지</span> · <span class="mono">상태칩</span> · <span class="mono">상품명</span> · <span class="mono">옵션 | 수정 &gt;</span> · <span class="mono">유형(판매)</span> · <span class="mono">수량 스텝퍼 + [변경]</span> · <span class="mono">급여가(정가) / 본인부담금(%)</span> · <span class="mono">[삭제]</span><table class="policy-table"><thead><tr><th>행 상태</th><th>표시</th><th>라벨</th></tr></thead><tbody><tr><td>기본</td><td>상태칩 \'주문확인중\'(초록)</td><td><span class="mono">현행</span></td></tr><tr><td>추가 상품</td><td>상태칩 \'추가상품\'(초록, 주문확인중과 같은 색 — DS는 회색 Neutral, 5장)</td><td><span class="mono">현행</span></td></tr><tr><td>삭제</td><td>[삭제] → 상품 삭제 확인 모달 → <strong>행 즉시 제거</strong>(삭제 상태 표시 없음, 복원 없음)</td><td><span class="mono">현행</span></td></tr></tbody></table></li><li><strong>저장 방식</strong> <span class="mono">현행</span>: 옵션 변경·수량 [변경]·상품 추가·삭제는 <strong>누를 때마다 즉시 서버에 저장</strong>된다. [주문하기] 전에 목록으로 나갔다 다시 들어와도 변경 내역이 남는다. 되돌리기·초기화 수단 없음. 옵션 변경은 데이터상 \'기존 옵션 삭제 + 새 옵션 추가\'로 처리된다(아래 "상품 삭제 사유 목록 동작")</li><li><strong>수량</strong> <span class="mono">현행</span>: 행 안 스텝퍼로 조정한 뒤 [변경]을 눌러야 적용. 최소 1 — 1일 때 [-] 비활성. 대여 상품은 수량 1 고정</li><li><strong>옵션</strong> <span class="mono">현행</span><ul><li>표기: <span class="mono">옵션1/옵션2/옵션3</span> — 구분자 \'/\' 앞뒤 공백 없음(예: 회색/M(260~280mm)/free)</li><li>옵션 항목 최대 3개(2026.03 상품 옵션 관리 개선). 옵션이 없는 상품은 옵션 줄 미노출</li><li><span class="mono">확인 필요</span> 옵션이 길면 <span class="mono">| 수정 &gt;</span>이 다음 줄로 내려감(구분선 \'|\'가 줄 앞에 남음 — 표시 오류)</li><li><span class="mono">확인 필요</span> [수정 &gt;] → 옵션 수정 모달 → 저장하면 <strong>해당 행이 목록 맨 아래로 이동</strong>(의도 여부)</li></ul></li></ul><p><strong>3. 상품 추가</strong> <span class="mono">현행</span></p><ul><li>[상품추가 +] → 상품 추가 모달(상품 검색 + 옵션 셀렉트)<table class="policy-table"><thead><tr><th>상품 구분</th><th>노출</th></tr></thead><tbody><tr><td>급여상품(판매)</td><td>노출</td></tr><tr><td>급여상품(대여)</td><td>노출</td></tr><tr><td>비급여상품</td><td>비노출</td></tr><tr><td>장애인보장구</td><td>비노출</td></tr><tr><td>부품</td><td>노출</td></tr><tr><td>대대여</td><td>비노출</td></tr></tbody></table></li><li>품절·일시품절: 노출하되 선택 불가</li><li>모달 1회에 상품 1개(재선택하면 상품 변경). <strong>같은 상품을 다른 옵션으로 여러 번 추가 가능</strong></li><li>추가된 상품은 목록 맨 아래, \'추가상품\' 칩</li><li><span class="mono">확인 필요</span> 부품 상품: 유형(\'판매\') 미표시, 급여가 0원 표시</li><li>알림: 상품 미선택 "상품을 선택해주세요." / 옵션 미선택 "옵션을 선택해주세요."</li></ul><p><strong>4. 모달</strong> <span class="mono">현행</span></p><table class="policy-table"><thead><tr><th>모달</th><th>내용</th><th>버튼</th></tr></thead><tbody><tr><td>옵션 수정</td><td>상품 이미지·상품명 + 옵션 항목별 셀렉트. <strong>모든 셀렉트가 \'선택하세요\' 빈 상태로 열림</strong></td><td>[취소] [확인] — 옵션 선택 전 [확인] 비활성</td></tr><tr><td>상품 추가</td><td>상품 검색 + 옵션 항목별 셀렉트</td><td>[취소] [상품 추가]</td></tr><tr><td>상품 삭제</td><td>상품명(옵션 포함) + "해당 상품을 정말 삭제하시겠습니까?"</td><td>[취소] [확인]</td></tr><tr><td>상품 삭제 사유</td><td>[주문하기] 때 삭제 상품이 있으면 노출. 삭제 상품 목록 + 상세 사유(placeholder "주문상품을 삭제한 사유를 입력해 주세요.", <strong>0/20자</strong>) + "※ 수급자에게 안내되는 문구이니 신중하게 적어주세요."</td><td>[취소] [저장]</td></tr><tr><td>주문취소</td><td>취소 사유 셀렉트(아래 5) + 상세 사유</td><td>[취소] [저장]</td></tr><tr><td>주문하기 확인</td><td>"주문 완료 후에는 수량이나 옵션을 바꿀 수 없으니, 다시 한번 확인해 주세요." + "총 <strong>N</strong> 건의 상품을 주문하시겠습니까?"(N 강조)</td><td>[취소] [확인]</td></tr><tr><td>주문불가(요양정보 미조회)</td><td>"요양정보를 조회하여 본인부담율 및 주문가능 품목 등을 확인 후 주문해 주세요." (Figma <span class="mono">12030:9930</span> 원본 문구 그대로)</td><td>[확인]</td></tr><tr><td>주문불가(기타 유형)</td><td><span class="mono">확인 필요</span> — 미캡처(퍼블 기준 문구는 아래 9)</td><td></td></tr><tr><td>요양정보조회</td><td>상담받을 연락처 · 수급자 성명 · 생년월일 · 인정유효기간 시작일 · 인정등급 + [조회] → 위에 겹쳐 \'공인인증서 비밀번호\' 모달(비밀번호 입력 + [취소] [확인]) → 같은 모달 아래 결과 펼침: "{이름} ({생년}년생/{성별})님의 요양정보", 조회기준일, [이미지 저장] [인쇄], 정보 카드(장기요양 인정번호·생년월일·등급/본인부담률·유효기간·적용구간·급여잔액), 판매 급여 품목·대여 급여 품목 표(2단, 급여불가 행 강조). 모달을 닫으면 수급자 정보가 채워지고 말풍선이 사라짐 (Figma <span class="mono">12030:9930</span>)</td><td></td></tr></tbody></table><ul><li><strong>상품 삭제 사유 목록 동작</strong> <span class="mono">현행</span>: 삭제 사유 목록에 아래가 모두 포함된다 — 최초 주문에서 삭제한 상품, <strong>옵션을 바꾼 상품의 원래 옵션</strong>(예: LP-011 베이지/XXL(110) → 연베이지/L(100)으로 바꾸면 \'베이지/XXL(110)\'이 삭제 목록에 표시), <strong>추가했다가 삭제한 상품</strong>. 2026.10 운영 건(IS-1276)의 개선 사유와 같은 문제 — <span class="mono">진행 중</span></li></ul><p><strong>5. 주문취소 사유</strong></p><ul><li><span class="mono">확정</span> <strong>D-02</strong> 구입 주문과 대여 주문의 취소 사유는 별도로 관리한다</li><li><span class="mono">현행</span> 구입 주문 취소 사유: 수급자 단순변심 / 수급자 계약 불가 상태 / 수급자 연락 불가 / 수량 또는 옵션 변경 / 대대여로 진행 / (이하 <span class="mono">확인 필요</span> — 목록 스크롤 아래 미캡처)</li></ul><p><strong>6. 표기 규칙</strong></p><ul><li><span class="mono">확정</span> <strong>D-01</strong> 상품 유형 표기: 구입 상품 = <strong>\'구입\'</strong>, 대여 상품 = <strong>\'대여\'</strong>. 현행 \'판매\' 표기는 2026.10 운영 건에서 \'구입\'으로 바뀐다(<span class="mono">진행 중</span>). 2026.08 대대여 연동 기획의 \'판매\' 표기도 \'구입\'으로 대체</li><li><span class="mono">정책 적용안</span> 화면 정책을 적용한 화면(프로토타입 ②)은 <strong>모든 단계에서 상품 유형을 \'구입\'</strong>으로 쓴다(D-01). 합계 이름 \'총 판매 금액\'은 미결이라 현행 그대로 둔다. 현행 화면(①, 개발 화면)은 \'판매\' 그대로</li></ul><p><strong>7. 모바일(1024px 이하)</strong></p><ul><li><span class="mono">현행</span> 개발 자체 대응. 사이트 정책 미적용 상태(퍼블 302 모바일로 확인)</li><li><span class="mono">정책 적용안</span> 기존 정책(3장, 4-3 대여 상세)을 구입 주문에 적용할 때 바뀌는 부분<table class="policy-table"><thead><tr><th>영역</th><th>현행(개발 대응)</th><th>정책 적용안</th><th>근거</th></tr></thead><tbody><tr><td>주문정보·수급자 정보 표</td><td>라벨/값 상하 스택, 행마다 회색 라벨 바</td><td>라벨(80~128) + 값 1쌍/행(PC는 2쌍/행)</td><td>3-1, 3-11</td></tr><tr><td>섹션 접기/펼치기</td><td>없음</td><td>주문정보·수급자 정보 타이틀 오른쪽 화살표(모바일만)</td><td>3-11, 4-1</td></tr><tr><td>주문취소/주문하기 버튼</td><td>주문정보 타이틀 오른쪽</td><td>페이지 타이틀 아래 한 줄, 폭 나눔, MD 48(4-3과 같음)</td><td>3-4 예외</td></tr><tr><td>상태칩</td><td>긴 칩 내부 줄바꿈</td><td>칩 한 줄 유지(nowrap), 색은 5장 구입 주문 상태</td><td>5</td></tr><tr><td>상품 행</td><td>이미지·정보·수량·금액·버튼 세로 나열, 버튼 좌측 단독</td><td>4-3 상품 카드 구조(border-top 구분선)</td><td>4-3</td></tr><tr><td>모달</td><td>md 모달</td><td>상품 추가·상품 삭제 사유·주문취소 → 바텀시트, 옵션 수정·상품 삭제·주문하기 확인·주문불가 → 모달</td><td>3-3</td></tr></tbody></table></li></ul><p><strong>8. 리스트</strong> <span class="mono">현행</span> — 4-2와 다른 점은 4-2 메모에 적는다</p><p><strong>9. 퍼블(302)과 개발 화면 차이</strong> <span class="mono">확인 필요</span> — 퍼블에만 있고 개발 화면에는 없는 항목. <strong>퍼블을 기준 화면으로 쓰지 않는다</strong></p><table class="policy-table"><thead><tr><th>항목</th><th>퍼블</th><th>개발(현행)</th></tr></thead><tbody><tr><td>브레드크럼</td><td>사업소 운영관리 &gt; 수급자 주문요청관리</td><td>돌봄앱 운영관리 &gt; 주문요청 관리</td></tr><tr><td>옵션 불일치 경고 바</td><td>있음(확인하기 → 확인완료)</td><td>없음</td></tr><tr><td>삭제 후 행</td><td>\'주문취소(사업소)\' 칩 + dim + [되돌리기]</td><td>행 즉시 제거</td></tr><tr><td>상품 삭제 사유 글자 수</td><td>200자</td><td>20자</td></tr><tr><td>주문취소 모달</td><td>수급자 행 + 사유 5종(단순변심/계약 불가/연락 불가/대대여/기타)</td><td>사유 목록에 \'수량 또는 옵션 변경\' 포함</td></tr><tr><td>옵션 표기</td><td>옵션1 / 옵션2(공백)</td><td>옵션1/옵션2(공백 없음)</td></tr><tr><td>주문불가 문구</td><td>① 장기요양급여 잔액 부족 ② 본인부담률 변경 ③ 인정유효기간·적용기간 경과 ④ 요양정보 조회 후 주문 ⑤ 주문 불가 상품 목록</td><td>미캡처</td></tr></tbody></table><p><strong>10. 진행 중 — 2026.10 운영 건</strong> <span class="mono">진행 중</span></p><ul><li>주문요청관리 UI 개선(IS-1276 / OECS-1951) — 내용은 이 조항에 넣지 않는다. 확정되면 해당 항목을 <span class="mono">확정</span>으로 옮긴다. 진행 상황은 Confluence 02 질문·결정 기록</li><li>개선안(기획 확인 중)은 프로토타입에서만 확인 → <span class="mono">order-detail-purchase.html</span> [③ + 기획 개선안]</li><li>UX 제안(U)은 프로토타입에서 확인 → <span class="mono">order-detail-purchase.html</span></li></ul><p class="proto-ref">→ <span class="mono">order-detail-purchase.html</span>, <span class="mono">purchase-order-analysis.html</span></p>' },
  s5: { title:"5. DS 시맨틱 컬러 / 상태칩", html:
    '<p>상태칩은 <strong>도메인마다 별도 Figma 컴포넌트</strong>를 쓴다 — <span class="mono">Status chip-Order</span>(구매), <span class="mono">Status chip-Rental</span>(대여), <span class="mono">Status chip-Return</span>(회수, 구 <span class="mono">-Collect</span>), <span class="mono">Status chip-AS</span>. 구분자는 하이픈. 구매와 대여는 같은 라벨(배송완료·취소요청 등)이 있어도 다른 컴포넌트이므로 화면 도메인에 맞는 것을 쓴다.</p><ul><li>공통 크기: 높이 32, radius 999(알약), 패딩 4/12, gap 4, SUIT SemiBold 14px / 줄 높이 20. 테이블 안 배지는 높이 24·12px Medium(3-9)</li></ul><p><strong>대여 주문 상태(9종)</strong></p><table class="policy-table"><thead><tr><th>상태</th><th>배경</th><th>테두리</th><th>글자</th></tr></thead><tbody><tr><td>신규배정</td><td><span class="mono">#eff6ff</span></td><td><span class="mono">#dbeafe</span></td><td><span class="mono">#1e40af</span></td></tr><tr><td>주문확인중</td><td><span class="mono">#e8f5e9</span></td><td><span class="mono">#c8e6c9</span></td><td><span class="mono">#166534</span></td></tr><tr><td>주문완료 · 출고완료</td><td><span class="mono">#f2fde4</span></td><td><span class="mono">#c6f68d</span></td><td><span class="mono">#09af00</span></td></tr><tr><td>출고준비중 · 취소요청</td><td><span class="mono">#fff8e1</span></td><td><span class="mono">#ffb300</span></td><td><span class="mono">#ff8f00</span></td></tr><tr><td>배송완료</td><td><span class="mono">#e3e5f5</span></td><td><span class="mono">#ced2f4</span></td><td><span class="mono">#141e76</span></td></tr><tr><td>주문취소</td><td><span class="mono">#ffebee</span></td><td><span class="mono">#ffcdd2</span></td><td><span class="mono">#c62828</span></td></tr><tr><td>취소완료</td><td><span class="mono">#f5f5f5</span></td><td><span class="mono">#bdbdbd</span></td><td><span class="mono">#555555</span></td></tr></tbody></table><p><strong>회수 상태(7종)</strong></p><table class="policy-table"><thead><tr><th>상태</th><th>배경</th><th>테두리</th><th>글자</th></tr></thead><tbody><tr><td>회수접수</td><td><span class="mono">#eff6ff</span></td><td><span class="mono">#dbeafe</span></td><td><span class="mono">#1e40af</span></td></tr><tr><td>회수확인중</td><td><span class="mono">#e8f5e9</span></td><td><span class="mono">#c8e6c9</span></td><td><span class="mono">#166534</span></td></tr><tr><td>회수요청</td><td><span class="mono">#fff8e1</span></td><td><span class="mono">#ffb300</span></td><td><span class="mono">#ff8f00</span></td></tr><tr><td>회수준비중</td><td><span class="mono">#f2fde4</span></td><td><span class="mono">#c6f68d</span></td><td><span class="mono">#09af00</span></td></tr><tr><td>회수완료</td><td><span class="mono">#e3e5f5</span></td><td><span class="mono">#ced2f4</span></td><td><span class="mono">#141e76</span></td></tr><tr><td>회수취소</td><td><span class="mono">#ffebee</span></td><td><span class="mono">#ffcdd2</span></td><td><span class="mono">#c62828</span></td></tr><tr><td>회수취소완료</td><td><span class="mono">#f5f5f5</span></td><td><span class="mono">#bdbdbd</span></td><td><span class="mono">#555555</span></td></tr></tbody></table><p><strong>구입 주문 상태(<span class="mono">Status chip-Order</span>, 13종)</strong> — DS 기록. 배경·테두리는 DS 값, 글자색은 같은 Status를 쓰는 위 표의 값</p><table class="policy-table"><thead><tr><th>상태</th><th>DS Status</th><th>배경</th><th>테두리</th><th>글자</th></tr></thead><tbody><tr><td>주문접수</td><td>Info</td><td><span class="mono">#eff6ff</span></td><td><span class="mono">#dbeafe</span></td><td><span class="mono">#1e40af</span></td></tr><tr><td>주문확인중</td><td>Success</td><td><span class="mono">#e8f5e9</span></td><td><span class="mono">#c8e6c9</span></td><td><span class="mono">#166534</span></td></tr><tr><td>상품준비 · 취소요청</td><td>Caution</td><td><span class="mono">#fff8e1</span></td><td><span class="mono">#ffb300</span></td><td><span class="mono">#ff8f00</span></td></tr><tr><td>출고중 · 출고완료</td><td>BrandSub</td><td><span class="mono">#f2fde4</span></td><td><span class="mono">#c6f68d</span></td><td><span class="mono">#09af00</span></td></tr><tr><td>배송완료</td><td>Default</td><td><span class="mono">#e3e5f5</span></td><td><span class="mono">#ced2f4</span></td><td><span class="mono">#141e76</span></td></tr><tr><td>주문취소(사업소·관리자·수급자)</td
