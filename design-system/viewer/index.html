4px;background:#eef0f3}.width-fill{height:100%;border-radius:3px;background:#6570be}.width-row code{font-size:12px}

.developer-only{display:none!important}.developer-mode .developer-only{display:block!important}.developer-mode [data-dev-classes]{display:flex!important;flex-wrap:wrap;gap:5px;margin-top:8px}.class-tag{padding:2px 6px;border-radius:3px;background:#f0f1f3;color:#555;font:11px ui-monospace,monospace}.code-panel{display:none;margin-top:26px;padding:16px;border:1px solid #dfe3e8;border-radius:7px;background:#fff}.developer-mode .code-panel{display:block}.code-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.code-panel h2{margin:0;font-size:15px}.code-panel pre{max-height:420px;overflow:auto;margin:0;padding:14px;border-radius:5px;background:#20242b;color:#f4f5f7;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.empty-state{padding:40px 20px;border:1px dashed #d7dce2;border-radius:7px;background:#fff;text-align:center}.empty-state strong{display:block;margin-bottom:5px}.empty-state span{color:var(--ds-color-text-secondary)}
@media(max-width:1024px){.layout{grid-template-columns:minmax(0,1fr)}.sidebar{position:fixed;z-index:35;inset:68px auto 0 0;width:min(280px,84vw);height:auto;transform:translateX(-105%);transition:transform .2s ease;box-shadow:8px 0 24px rgba(20,30,50,.1)}.sidebar.is-open{transform:translateX(0)}.mobile-nav{display:inline-flex}.workspace{padding:18px}.doc-panel{width:min(430px,92vw);max-width:none}.doc-resize{display:none}.doc-shade.is-visible,.nav-shade.is-visible{position:fixed;z-index:29;inset:68px 0 0;background:rgba(17,24,39,.32);display:block}.nav-shade.is-visible{z-index:34}.brand{min-width:0}.page-heading h1{font-size:22px}}
@media(max-width:600px){.app-header{min-height:60px;gap:9px;padding:8px 12px}.layout{min-height:calc(100vh - 60px)}.brand strong{font-size:16px}.brand span{display:none}.top-actions{gap:5px}.icon-button,.text-button{min-height:34px}.top-actions .text-button{padding:0 8px;font-size:12px}.workspace{padding:14px 12px 32px}.page-heading{gap:10px;margin-bottom:16px}.page-heading h1{font-size:20px;line-height:28px}.page-heading p{font-size:12px}.stage-shell{padding:10px}.stage-toolbar{gap:5px}.stage-toolbar .mode-button{padding:0 9px}.sample-section{margin-bottom:20px;padding-bottom:18px}.section-heading h2{font-size:16px}.section-heading p{font-size:12px}.sample-stage{padding:12px}.size-compare,.do-grid{grid-template-columns:1fr}.doc-panel{inset-block-start:60px;width:100vw}.doc-shade.is-visible,.nav-shade.is-visible{inset-block-start:60px}.sidebar{inset-block-start:60px}.semantic-grid{grid-template-columns:1fr}.type-table{min-width:560px}.type-table-wrap{overflow:auto}.width-row{grid-template-columns:74px minmax(0,1fr) 62px}.code-panel pre{font-size:11px}}

<body>
<header class="app-header">
  <button class="icon-button mobile-nav" id="nav-toggle" aria-label="메뉴 열기" title="메뉴 열기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  <div class="brand"><strong>이로움케어 디자인 시스템</strong><span>형태와 상태를 먼저 확인하고, 필요할 때 구현 정보를 펼쳐보세요.</span></div>
  <div class="top-actions">
    <button class="text-button" id="dev-toggle" aria-pressed="false">개발자 보기</button>
    <button class="text-button" id="doc-toggle" aria-pressed="false">설명문서</button>
  </div>
</header>
<div class="layout">
  <nav class="sidebar" id="sidebar" aria-label="디자인 시스템 메뉴"></nav>
  <main class="workspace">
    <div class="page-heading"><div><h1 id="page-title">디자인 시스템</h1><p id="page-desc">디자인 원칙과 실제 컴포넌트를 확인합니다.</p></div></div>
    <div class="stage-toolbar"><strong id="stage-label">미리보기 폭</strong><button class="mode-button" data-width="1024" aria-pressed="true">1024</button><button class="mode-button" data-width="360" aria-pressed="false">360</button></div>
    <div class="stage-shell"><div class="preview-frame" id="preview-frame" data-width="1024"><div id="content" aria-live="polite"></div></div></div>
    <section class="code-panel" id="code-panel"><div class="code-panel-head"><h2>구현 마크업</h2><button class="text-button" id="copy-code">복사</button></div><pre><code id="code-output"></code></pre></section>
  </main>
</div>
<div class="doc-shade" id="doc-shade"></div><div class="nav-shade" id="nav-shade"></div>
<aside class="doc-panel" id="doc-panel" aria-label="설명문서 패널" aria-hidden="true"><div class="doc-resize" id="doc-resize" aria-hidden="true"></div><div class="doc-head"><strong id="doc-title">설명문서</strong><button class="icon-button" id="doc-close" aria-label="설명문서 닫기"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div><div class="doc-body"><div class="markdown" id="markdown">문서를 불러오는 중입니다.</div><div class="figma-links" id="figma-links"></div></div></aside>
<script>
const DS = new URL('../', location.href);
const groups = [];
let navData = [];
let selected = null;
let developerMode = false;
let sourceMarkup = '';
const content = document.getElementById('content');
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const urlFor = path => new URL(path, DS).href;
const normalizeNode = id => String(id).replace(':','-');

async function loadJson(path){const response=await fetch(urlFor(path),{cache:'no-cache'});if(!response.ok)throw new Error(`${path}: ${response.status}`);return response.json()}
function flatten(items){return items.flatMap(group=>group.items.map(item=>({...item,group:group.group,key:item.file.split('#')[0]})))}
function buildNav(){
  const host=document.getElementById('sidebar');
  host.innerHTML=navData.map((group,index)=>`<details class="nav-group" ${index<2||group.items.some(item=>item.file===selected?.file)?'open':''}><summary>${esc(group.group)}</summary><div class="nav-items">${group.items.map(item=>`<button class="nav-item ${item.status==='todo'?'is-todo':''}" data-file="${esc(item.file)}" ${item.status==='todo'?'data-todo="true"':''} ${item.file===selected?.file?'aria-current="page"':''}><span>${esc(item.title)}</span>${item.status==='todo'?'<span class="todo-label">준비 중</span>':''}</button>`).join('')}</div></details>`).join('');
  host.querySelectorAll('.nav-item').forEach(button=>button.addEventListener('click',()=>{const next=flatten(navData).find(item=>item.file===button.dataset.file);if(next){selectItem(next);closeNav()}}));
}
function selectItem(item){selected=item;history.replaceState(null,'',`#${encodeURIComponent(item.file)}`);buildNav();document.getElementById('page-title').textContent=item.title;document.getElementById('stage-label').textContent=item.group==='Foundation'?'파운데이션 미리보기 폭':'컴포넌트 견본 미리보기 폭';document.getElementById('page-desc').textContent=item.group==='Foundation'?'토큰의 실제 값을 시각적 기준으로 비교합니다.':item.status==='todo'?'문서와 Figma 출처를 확인할 수 있습니다. 견본은 준비 중입니다.':'구조·상태·크기와 화면 사용 예를 살펴봅니다.';document.getElementById('doc-title').textContent=`${item.title} · 설명문서`;renderSelected();loadDocument()}
function setDeveloperMode(on){developerMode=on;document.body.classList.toggle('developer-mode',on);document.getElementById('dev-toggle').setAttribute('aria-pressed',String(on));document.getElementById('dev-toggle').textContent=on?'개발자 보기 켬':'개발자 보기';if(on)decorateDeveloperInfo();updateCode()}
function resolveCssValue(value,vars){let resolved=value;for(let i=0;i<8;i++){const match=resolved.match(/var\((--[\w-]+)(?:,\s*([^()]*))?\)/);if(!match)break;resolved=resolved.replace(match[0],vars.get(match[1])||match[2]||'');}return resolved.trim()}
async function getTokens(){const [tokens,css]=await Promise.all([loadJson('tokens.json'),fetch(urlFor('css/tokens.css'),{cache:'no-cache'}).then(r=>r.text())]);const vars=new Map([...css.matchAll(/(--ds-[\w-]+)\s*:\s*([^;]+);/g)].map(m=>[m[1],m[2].trim()]));return {tokens:tokens.map(item=>({...item,value:vars.get(item.token)||item.value,resolved:resolveCssValue(vars.get(item.token)||item.value,vars)})),vars}}
function tokenCard(item,style=''){const val=item.resolved||item.value;return `<article class="token-card"><div class="token-top"><span class="swatch" ${style==='color'?`style="background:${esc(val)}"`:''}></span><div><strong>${esc(item.name)}</strong><div class="token-value">${esc(val)}</div></div></div><div class="token-name">${esc(item.token)}</div><div class="token-use">${esc(item.usage)}</div></article>`}
function renderColor(tokens){const colors=tokens.filter(t=>t.group==='브랜드'||t.group==='회색');return `<section class="sample-section"><div class="section-heading"><span class="section-number">1</span><div><h2>컬러 팔레트</h2><p>색상 이름과 HEX, 화면에서의 역할을 함께 확인합니다.</p></div></div><div class="foundation-grid">${colors.map(t=>tokenCard(t,'color')).join('')}</div></section>`}
function renderSemantic(tokens){const rows=tokens.filter(t=>t.group==='상태색 (배경·선·글자 세트)');const roles=['info','success','warning','danger','brand','neutral','primary','secondary','tertiary','disabled'];const sets=roles.map(role=>{const parts=rows.filter(t=>t.token.includes(`-${role}-`)||t.token.endsWith(`-${role}`));if(!parts.length)return '';return `<article class="semantic-set"><h3>${esc(role==='info'?'정보':role==='success'?'성공':role==='warning'?'주의':role==='danger'?'오류':role==='brand'?'브랜드':role==='neutral'?'중립':role==='primary'?'기본':role==='secondary'?'보조':role==='tertiary'?'강조':'비활성')}</h3><div class="semantic-cells">${['bg','border','text'].map(type=>{const item=parts.find(p=>p.token.includes(`-${type}-`));return `<div class="semantic-cell"><span class="swatch" ${item?`style="background:${esc(item.resolved)}"`:''}></span><small>${type==='bg'?'배경':type==='border'?'선':'글자'}</small>${item?`<small>${esc(item.resolved)}</small>`:''}</div>`}).join('')}</div><p class="sample-caption">상태 예시 <span class="ds-chip ds-chip--${role==='warning'?'caution':role==='brand'?'brand-sub':role==='info'?'info':role==='success'?'success':role==='danger'?'danger':'neutral'}">${esc(role==='info'?'안내':role==='success'?'확인완료':role==='warning'?'확인필요':role==='danger'?'오류':role==='brand'?'진행중':'기본')}</span></p></article>`}).join('');return `<section class="sample-section"><div class="section-heading"><span class="section-number">2</span><div><h2>상태색</h2><p>상태별 배경·선·글자 색 조합입니다.</p></div></div><div class="semantic-grid">${sets}</div></section>`}
function renderTypography(tokens){const styles=[...new Set(tokens.filter(t=>t.token.includes('-size')).map(t=>t.token.replace(/-size$/,'')))];return `<section class="sample-section"><div class="section-heading"><span class="section-number">3</span><div><h2>글자</h2><p>글자 단계별 크기와 행간, 자간을 견본으로 확인합니다.</p></div></div><div class="type-table-wrap"><table class="type-table"><thead><tr><th>스타일</th><th>견본</th><th>크기</th><th>행간</th><th>자간</th></tr></thead><tbody>${styles.map(base=>{const find=suffix=>tokens.find(t=>t.token===`${base}-${suffix}`);const size=find('size'),line=find('line-height'),spacing=find('letter-spacing');return `<tr><td class="token-name">${esc(base.replace('--ds-font-',''))}</td><td><span class="type-spec" style="font-size:${esc(size?.resolved)};line-height:${esc(line?.resolved)};letter-spacing:${esc(spacing?.resolved)}">가나다 Aa 123</span></td><td>${esc(size?.resolved||'')}</td><td>${esc(line?.resolved||'')}</td><td>${esc(spacing?.resolved||'')}</td></tr>`}).join('')}</tbody></table></div>${tokens.filter(t=>t.token==='--ds-font-family-suit').map(t=>`<p class="sample-caption">글꼴: ${esc(t.value)} · ${esc(t.usage)}</p>`).join('')}</section>`}
function renderBars(title,description,tokens,group,kind){return `<section class="sample-section"><div class="section-heading"><span class="section-number">${kind==='space'?4:5}</span><div><h2>${title}</h2><p>${description}</p></div></div>${kind==='space'?`<div class="measure-list">${tokens.map(t=>`<div class="measure-row"><span>${esc(t.name.replace('간격 ',''))}</span><span class="measure-bar" style="width:max(2px,${esc(t.resolved)})"></span><code>${esc(t.resolved)}</code></div>`).join('')}</div>`:`<div class="radius-grid">${tokens.map(t=>`<article class="shape-card"><span class="shape-box" style="border-radius:${esc(t.resolved)}"></span><strong>${esc(t.name)}</strong><code>${esc(t.resolved)}</code></article>`).join('')}</div>`}</section>`}
function renderShadows(tokens){return `<section class="sample-section"><div class="section-heading"><span class="section-number">6</span><div><h2>그림자</h2><p>표면을 분리하는 깊이 단계입니다.</p></div></div><div class="shadow-grid">${tokens.map(t=>`<article class="shape-card"><span class="shadow-box" style="box-shadow:${esc(t.value)}"></span><strong>${esc(t.name)}</strong><code>${esc(t.value)}</code></article>`).join('')}</div></section>`}
function renderWidths(tokens,group,title,desc,number){return `<section class="sample-section"><div class="section-heading"><span class="section-number">${number}</span><div><h2>${title}</h2><p>${desc}</p></div></div><div class="width-chart">${tokens.map(t=>`<div class="width-row"><span>${esc(t.name)}</span><span class="width-track"><span class="width-fill" style="display:block;width:${Math.min(parseInt(t.resolved,10)/8,100)}%"></span></span><code>${esc(t.resolved)}</code></div>`).join('')}</div></section>`}
async function renderFoundations(){const {tokens}=await getTokens();return renderColor(tokens)+renderSemantic(tokens)+renderTypography(tokens)+renderBars('간격','일관된 밀도와 요소 간 리듬을 만듭니다.',tokens.filter(t=>t.group==='간격'),'간격','space')+renderBars('모서리','컴포넌트의 형태와 강조 수준에 맞춰 사용합니다.',tokens.filter(t=>t.group==='모서리'),'모서리','radius')+renderShadows(tokens.filter(t=>t.group==='그림자'))+`<section class="sample-section"><div class="section-heading"><span class="section-number">7</span><div><h2>테두리·아이콘</h2><p>선의 굵기와 아이콘의 기본 표시 크기입니다.</p></div></div><div class="foundation-grid">${tokens.filter(t=>['테두리','아이콘'].includes(t.group)).map(t=>tokenCard(t)).join('')}</div></section>`+renderWidths(tokens.filter(t=>t.group==='화면 폭'),'화면 폭','화면 폭','뷰포트 전환 기준을 표시합니다.',8)+renderWidths(tokens.filter(t=>t.group==='모달 폭'),'모달 폭','모달 폭','모달 크기별 최대 폭입니다.',9)}
function sectionType(section){const type=section.dataset.section||'';return type}
function sampleCard(section,index){const title=section.dataset.title||section.dataset.section||`견본 ${index+1}`;const desc=section.dataset.desc||'';const type=sectionType(section);return `<section class="sample-section" data-view-section="${esc(type)}"><div class="section-heading"><span class="section-number">${index+1}</span><div><h2>${esc(title)}</h2><p>${esc(desc)}</p></div></div><div class="section-body">${section.innerHTML}</div><div data-dev-classes hidden></div></section>`}
async function renderSample(item){if(item.status==='todo'||!item.sample)return '<div class="empty-state"><strong>견본 준비 중</strong><span>문서와 Figma 출처를 먼저 확인할 수 있습니다.</span></div>';const response=await fetch(urlFor(item.sample),{cache:'no-cache'});if(!response.ok)throw new Error(`${item.sample}: ${response.status}`);sourceMarkup=await response.text();const doc=new DOMParser().parseFromString(`<main>${sourceMarkup}</main>`,'text/html');const sections=[...doc.querySelectorAll('section[data-section]')];if(!sections.length)return '<div class="empty-state"><strong>견본 준비 중</strong><span>새 견본 형식으로 구성 중입니다.</span></div>';return sections.map(sampleCard).join('')}
async function renderSelected(){if(!selected)return;content.innerHTML='<div class="empty-state"><strong>불러오는 중</strong></div>';try{if(selected.group==='Foundation'){content.innerHTML=await renderFoundations();sourceMarkup='tokens.json';}else content.innerHTML=await renderSample(selected);if(developerMode)decorateDeveloperInfo();updateCode()}catch(error){content.innerHTML=`<div class="empty-state"><strong>화면을 불러오지 못했습니다</strong><span>${esc(error.message)}</span></div>`}}
function decorateDeveloperInfo(){content.querySelectorAll('[data-dev-classes]').forEach(host=>{const section=host.closest('.sample-section');const classes=[...new Set([...section.querySelectorAll('[class]')].flatMap(el=>[...el.classList]))];host.innerHTML=classes.map(name=>`<span class="class-tag">.${esc(name)}</span>`).join('');host.hidden=false})}
function updateCode(){if(!developerMode)return;const code=selected?.group==='Foundation'?'tokens.json\n/* 값의 원본은 design-system/css/tokens.css 입니다. */':sourceMarkup;document.getElementById('code-output').textContent=code||''}
function markdownHref(href){if(/^(https?:|mailto:|#)/.test(href))return href;const base=urlFor(selected.file.split('#')[0]);return new URL(href,base).href}
function renderFigmaLinks(){const host=document.getElementById('figma-links');const figma=selected?.figma||{};const groups=[['DS',figma.ds],['프레임워크',figma.framework]];host.innerHTML=groups.map(([label,data])=>data?.nodes?.length?`<div><h3>${label}</h3><div class="figma-group">${data.nodes.map(id=>`<a href="https://www.figma.com/design/${encodeURIComponent(data.file)}/?node-id=${normalizeNode(id)}" target="_blank" rel="noopener">${esc(id)}</a>`).join('')}</div></div>`:'').join('')||'<div><h3>Figma 출처 없음</h3></div>'}
async function loadDocument(){const box=document.getElementById('markdown');const target=selected.file.split('#')[0];try{const response=await fetch(urlFor(target),{cache:'no-cache'});if(!response.ok)throw new Error(`${response.status}`);const raw=await response.text();const fragment=selected.file.includes('#')?selected.file.split('#')[1]:'';box.innerHTML=window.marked?marked.parse(raw):`<pre>${esc(raw)}</pre>`;if(fragment){const heading=[...box.querySelectorAll('h1,h2,h3,h4')].find(el=>el.textContent.toLowerCase().replaceAll(' ','-').includes(fragment));if(heading)setTimeout(()=>heading.scrollIntoView({block:'start'}),0)}box.querySelectorAll('a[href]').forEach(link=>{const href=link.getAttribute('href');link.href=markdownHref(href);if(/^https?:/.test(href)&&new URL(href).host!==location.host){link.target='_blank';link.rel='noopener'}})}catch(error){box.innerHTML=`<p>설명문서를 불러오지 못했습니다. (${esc(error.message)})</p>`}renderFigmaLinks()}
function togglePanel(open){const panel=document.getElementById('doc-panel');panel.classList.toggle('is-open',open);panel.setAttribute('aria-hidden',String(!open));document.getElementById('doc-toggle').setAttribute('aria-pressed',String(open));document.getElementById('doc-shade').classList.toggle('is-visible',open&&matchMedia('(max-width:1024px)').matches)}
function closeNav(){document.getElementById('sidebar').classList.remove('is-open');document.getElementById('nav-shade').classList.remove('is-visible')}
document.getElementById('doc-toggle').addEventListener('click',()=>togglePanel(!document.getElementById('doc-panel').classList.contains('is-open')));document.getElementById('doc-close').addEventListener('click',()=>togglePanel(false));document.getElementById('doc-shade').addEventListener('click',()=>togglePanel(false));
document.getElementById('nav-toggle').addEventListener('click',()=>{document.getElementById('sidebar').classList.add('is-open');document.getElementById('nav-shade').classList.add('is-visible')});document.getElementById('nav-shade').addEventListener('click',closeNav);
document.getElementById('dev-toggle').addEventListener('click',()=>setDeveloperMode(!developerMode));document.querySelectorAll('.mode-button').forEach(button=>button.addEventListener('click',()=>{document.getElementById('preview-frame').dataset.width=button.dataset.width;document.querySelectorAll('.mode-button').forEach(other=>other.setAttribute('aria-pressed',String(other===button)))}));
document.getElementById('copy-code').addEventListener('click',async()=>{await navigator.clipboard.writeText(document.getElementById('code-output').textContent);document.getElementById('copy-code').textContent='복사됨';setTimeout(()=>document.getElementById('copy-code').textContent='복사',1200)});
const resize=document.getElementById('doc-resize');resize.addEventListener('pointerdown',event=>{event.preventDefault();resize.setPointerCapture(event.pointerId);const move=e=>{document.documentElement.style.setProperty('--doc-width',`${Math.max(300,Math.min(innerWidth*.7,innerWidth-e.clientX))}px`)};const up=()=>{resize.removeEventListener('pointermove',move);resize.removeEventListener('pointerup',up)};resize.addEventListener('pointermove',move);resize.addEventListener('pointerup',up)});
async function init(){try{navData=await loadJson('nav.json');buildNav();const all=flatten(navData);const target=decodeURIComponent(location.hash.slice(1));selected=all.find(item=>item.file===target)||all.find(item=>item.title==='Color')||all[0];selectItem(selected)}catch(error){content.innerHTML=`<div class="empty-state"><strong>디자인 시스템을 불러오지 못했습니다</strong><span>${esc(error.message)} · 로컬 서버에서 열어주세요.</span></div>`}}
init();
</script>
</body>
</html>
