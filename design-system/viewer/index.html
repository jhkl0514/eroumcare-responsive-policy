<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f5">
  <title>이로움케어 디자인 시스템</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/sunn-us/SUIT@2/fonts/static/woff2/SUIT.css">
  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="viewer.css">
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script defer src="viewer.js"></script>
</head>
<body>
  <header class="site-header">
    <button class="icon-button mobile-nav-button" id="nav-toggle" aria-label="메뉴 열기" title="메뉴 열기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a class="brand" href="?item=디자인%20시스템%20개요" aria-label="이로움케어 디자인 시스템 홈">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span><strong>이로움케어</strong><small>디자인 시스템</small></span>
    </a>
    <div class="header-divider" aria-hidden="true"></div>
    <p class="header-context">디자인 기준과 사용 방법</p>
    <button class="header-action" id="doc-toggle" aria-expanded="false" aria-controls="doc-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.75h14a1.25 1.25 0 0 1 1.25 1.25v12A1.25 1.25 0 0 1 19 19.25H5A1.25 1.25 0 0 1 3.75 18V6A1.25 1.25 0 0 1 5 4.75Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
      <span>설명문서</span>
    </button>
  </header>

  <div class="app-shell">
    <nav class="sidebar" id="sidebar" aria-label="디자인 시스템 메뉴"></nav>
    <button class="scrim nav-scrim" id="nav-scrim" aria-label="메뉴 닫기" hidden></button>

    <main class="main-column" id="main-column">
      <div class="main-inner">
        <div class="breadcrumbs" id="breadcrumbs" aria-label="현재 위치"></div>
        <header class="page-header">
          <div class="page-copy">
            <p class="eyebrow" id="page-eyebrow"></p>
            <h1 id="page-title">디자인 시스템</h1>
            <p id="page-description"></p>
          </div>
          <div class="view-tabs" role="tablist" aria-label="문서 보기 방식">
            <button class="view-tab" id="design-tab" role="tab" aria-selected="true" aria-controls="design-panel">디자인</button>
            <button class="view-tab" id="development-tab" role="tab" aria-selected="false" aria-controls="development-panel">개발</button>
          </div>
        </header>
        <div class="page-body">
          <article class="design-panel" id="design-panel" role="tabpanel" aria-labelledby="design-tab">
            <div id="design-content"></div>
          </article>
          <article class="development-panel" id="development-panel" role="tabpanel" aria-labelledby="development-tab" hidden>
            <div id="development-content"></div>
          </article>
        </div>
      </div>
    </main>

    <aside class="page-toc" id="page-toc" aria-label="이 페이지에서">
      <p class="toc-title">이 페이지에서</p>
      <nav id="toc-links"></nav>
    </aside>
  </div>

  <aside class="doc-panel" id="doc-panel" aria-label="설명문서" aria-hidden="true">
    <div class="doc-resize" id="doc-resize" aria-hidden="true"></div>
    <header class="doc-header">
      <div><p class="eyebrow">상세 기준</p><strong id="doc-title">설명문서</strong></div>
      <button class="icon-button" id="doc-close" aria-label="설명문서 닫기" title="닫기">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div class="doc-body">
      <div class="markdown-body" id="markdown-body">문서를 불러오는 중입니다.</div>
      <div class="figma-sources" id="figma-sources"></div>
    </div>
  </aside>
  <button class="scrim doc-scrim" id="doc-scrim" aria-label="설명문서 닫기" hidden></button>

  <footer class="site-footer"><span>이로움케어 디자인 시스템</span><span>Design with clarity</span></footer>
</body>
</html>
