<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이로움케어 디자인 시스템</title>
<script>
  /* 예전 뷰어 주소(?item= · ?p= · #파일)를 새 문서 페이지로 보낸다.
     새 문서가 있는 항목은 그 페이지로, 나머지는 item.html이 같은 틀 안에서 보여 준다. */
  (function () {
    var NEW = { '디자인 시스템 개요': 'overview.html', 'Color': 'color.html', 'Typography': 'typography.html', 'Shape': 'shape.html', 'Layout': 'layout.html', 'Icon': 'icon.html', 'Text input': 'text-input.html', 'Select': 'select.html', 'Textarea': 'textarea.html', 'Button': 'button.html', 'Status Chip': 'status-chip.html', 'Modal': 'modal.html' };
    var q = new URLSearchParams(location.search);
    var key = q.get('item') || q.get('p') || decodeURIComponent((location.hash || '').replace(/^#\??/, '').replace(/^item=/, ''));
    var to = 'overview.html';
    if (key) {
      var file = key.split('#')[0].split('/').pop().replace(/\.md$/, '') + '.html';
      var pages = Object.keys(NEW).map(function (k) { return NEW[k]; });
      if (NEW[key]) to = NEW[key];
      else if (/\.md/.test(key) && pages.indexOf(file) > -1) to = file;
      else if (/^foundations\.md/.test(key)) to = 'color.html';
      else to = 'item.html?item=' + encodeURIComponent(key);
    }
    location.replace(to);
  })();
</script>
</head>
<body>
<p><a href="overview.html">이로움케어 디자인 시스템으로 이동</a></p>
</body>
</html>
