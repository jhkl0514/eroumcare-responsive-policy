    <div class="ds-select" data-label="Select field">
      <button class="ds-select__trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-label="Select trigger · Closed">전체</button>

<section data-sample="변형(variant) · 크기 > SelectField">
  <div class="ds-field" data-label="Select · MO · Default">
    <span class="ds-field__label" data-label="Field label">품목</span>
    <div class="ds-select" data-label="Select field">
      <button class="ds-select__trigger" type="button" aria-haspopup="listbox" aria-expanded="false" data-label="Select trigger · Closed">전체 품목</button>
    </div>
  </div>
</section>
<section data-sample="상태 > Focused · 목록 열림">
  <div class="ds-field" data-label="Select · 목록 열림">
    <span class="ds-field__label" data-label="Field label">주문 상태</span>
    <div class="ds-select" data-label="Select field">
      <button class="ds-select__trigger" type="button" aria-haspopup="listbox" aria-expanded="true" data-label="Select trigger · Open">전체</button>
      <div class="ds-select__list" role="listbox" aria-label="주문 상태" data-label="Option list">
        <button class="ds-select__option" type="button" role="option" aria-selected="true" data-label="Option · Selected">전체</button>
        <button class="ds-select__option" type="button" role="option" aria-selected="false" data-label="Option · Default">주문접수</button>
        <button class="ds-select__option" type="button" role="option" aria-selected="false" data-label="Option · Default">상품준비</button>
        <button class="ds-select__option" type="button" role="option" aria-selected="false" data-label="Option · Default">배송완료</button>
      </div>
    </div>
  </div>
</section>
<section data-sample="상태 > Disabled">
  <div class="ds-field" data-label="Select · Disabled">
    <span class="ds-field__label" data-label="Field label">주문 상태</span>
    <div class="ds-select" data-label="Select field">
      <button class="ds-select__trigger" type="button" disabled data-label="Select trigger · Disabled">선택할 수 없음</button>
    </div>
  </div>
</section>
